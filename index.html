<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Waymarks — Travel Stories</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    #worldMap { height: 520px; border-radius: 24px; border: 1px solid rgba(28,23,18,.12); }
    .flight-list { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
    .flight-item { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 14px 16px; border-radius: 14px; background: rgba(255,255,255,.45); border: 1px solid rgba(28,23,18,.12); }
    .flight-item.waiting { opacity: .55; }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="mark" href="#home"><span class="mark-dot"></span>Waymarks</a>
    <nav class="nav">
      <a href="#stories">Stories</a>
      <a href="#atlas">Atlas</a>
      <a href="#about">About</a>
    </nav>
  </header>
  <main id="app"></main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const airports = { MUC:{name:'Munich',lat:48.3538,lng:11.7861}, BKK:{name:'Bangkok',lat:13.69,lng:100.7501}, DMK:{name:'Bangkok Don Mueang',lat:13.9126,lng:100.6068}, CNX:{name:'Chiang Mai',lat:18.7668,lng:98.9626}, NRT:{name:'Tokyo Narita',lat:35.772,lng:140.3929}, HNL:{name:'Honolulu',lat:21.3187,lng:-157.9225}, SFO:{name:'San Francisco',lat:37.6213,lng:-122.379}, PHX:{name:'Phoenix',lat:33.4373,lng:-112.0078}, LHR:{name:'London Heathrow',lat:51.47,lng:-0.4543}, ZRH:{name:'Zurich',lat:47.4582,lng:8.5555} };
    const flights = [
      {from:'MUC',to:'BKK',date:'2026-10-08',time:'14:25-06:05 (+1)'},
      {from:'DMK',to:'CNX',date:'2026-10-10',time:'21:15-22:25'},
      {from:'CNX',to:'BKK',date:'2026-10-13',time:'22:20-23:40'},
      {from:'BKK',to:'NRT',date:'2026-10-15',time:'11:35-20:05'},
      {from:'NRT',to:'HNL',date:'2026-10-27',time:'19:05-07:10 (-1)'},
      {from:'HNL',to:'SFO',date:'2026-11-05',time:'12:15-19:25'},
      {from:'PHX',to:'LHR',date:'2026-11-22',time:'20:40-13:35 (+1)'},
      {from:'LHR',to:'ZRH',date:'2026-11-23',time:'16:00-18:50'}
    ];
    function todayIso(){ const n=new Date(); return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0'); }
    function visible(f,t){ return f.date==='2026-10-08' || f.date<=t; }
    function arc(a,b){ const p=[]; let lng2=b.lng; if(Math.abs(lng2-a.lng)>180) lng2+=lng2>a.lng?-360:360; for(let i=0;i<=48;i++){ const t=i/48; p.push([a.lat+(b.lat-a.lat)*t+Math.sin(Math.PI*t)*4, a.lng+(lng2-a.lng)*t]); } return p; }
    function showAtlas(){
      const today=todayIso();
      const app=document.getElementById('app');
      app.innerHTML='<div class="section-head"><h2>Atlas</h2><p>Routes appear on the day they fly. Munich to Bangkok is already on the map.</p></div><div id="worldMap"></div><div class="flight-list"></div>';
      const list=app.querySelector('.flight-list');
      flights.forEach(f=>{ const on=visible(f,today); const row=document.createElement('div'); row.className='flight-item'+(on?'':' waiting'); row.innerHTML='<strong>'+f.from+' - '+f.to+'</strong><span>'+(on?'On the map':'Hidden until flight day')+'</span><span class="meta">'+airports[f.from].name+' to '+airports[f.to].name+'</span><span class="meta">'+f.date.slice(8)+'.'+f.date.slice(5,7)+'. \u00b7 '+f.time+'</span>'; list.appendChild(row); });
      const map=L.map('worldMap',{worldCopyJump:true}).setView([28,20],2);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{attribution:'\u00a9 OpenStreetMap \u00a9 CARTO',subdomains:'abcd',maxZoom:8}).addTo(map);
      const seen=new Set();
      flights.filter(f=>visible(f,today)).forEach(f=>{ L.polyline(arc(airports[f.from],airports[f.to]),{color:'#b4482a',weight:2.5,dashArray:'7 8'}).bindPopup(f.from+' \u2192 '+f.to+'<br>'+f.time).addTo(map); [f.from,f.to].forEach(code=>{ if(seen.has(code)) return; seen.add(code); L.circleMarker([airports[code].lat,airports[code].lng],{radius:7,color:'#1c1712',weight:2,fillColor:'#b4482a',fillOpacity:1}).bindPopup('<strong>'+code+'</strong><br>'+airports[code].name).addTo(map); }); });
      setTimeout(()=>map.invalidateSize(),200);
    }
    function go(){ if((location.hash||'#home')==='#atlas') showAtlas(); else if(!location.hash||location.hash==='#home') document.getElementById('app').innerHTML='<div class="section-head"><h2>Waymarks</h2><p>Open Atlas for the flight map.</p></div>'; }
    window.addEventListener('hashchange', go);
    go();
  </script>
</body>
</html>
