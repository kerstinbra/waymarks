<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>waymarks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body, h1, h2, h3, p, a, button, input, textarea { font-family: Poppins, sans-serif; }
    h1, h2, h3 { font-weight: 400; }
    p, a, .kicker { font-weight: 300; }
    .mark { font-weight: 300; letter-spacing: 0.01em; }
    .mark-dot { width: 11px; height: 11px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: #b4482a; box-shadow: none; margin-bottom: 3px; }
    #worldMap { height: 560px; border-radius: 24px; border: 1px solid rgba(28,23,18,.12); }
    .country-label { background: transparent; border: 0; box-shadow: none; font-family: Poppins, sans-serif; font-size: 13px; font-weight: 400; letter-spacing: .04em; text-transform: uppercase; color: #5c534a; }
    .pin { background: none; border: 0; }
    .pin i { display: block; width: 9px; height: 9px; background: #b4482a; border: 1.5px solid #fff; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); box-shadow: 0 1px 2px rgba(28,23,18,.28); }
    .about-copy { display: grid; grid-template-columns: 1.1fr .9fr; gap: 36px; align-items: center; }
    .about-copy h2, .story h2, .post h2 { font-size: clamp(2rem, 4vw, 2.8rem); margin: 8px 0 12px; font-weight: 400; }
    .post.welcome h2, .story.welcome h2 { font-size: 1.35rem; }
    .about-copy p, .story p, .post p { color: #5c534a; font-size: 1.02rem; font-weight: 300; }
    .about-copy img { width: 100%; max-width: 440px; border-radius: 24px; display: block; object-fit: cover; height: auto; }
    .posts, .places { display: flex; flex-direction: column; gap: 14px; max-width: 46rem; margin-top: 22px; }
    .post, .place { padding-bottom: 16px; border-bottom: 1px solid rgba(28,23,18,.12); }
    .place { display: grid; grid-template-columns: 9.5rem 1fr; gap: 8px 16px; }
    .post a.more, .place span { color: #b4482a; }
    .story { max-width: 46rem; }
    .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 22px 0 8px; }
    .gallery button { border: 0; padding: 0; background: #ebe4d6; border-radius: 12px; overflow: hidden; cursor: pointer; }
    .gallery img { width: 100%; height: 92px; object-fit: cover; display: block; }
    .lightbox { position: fixed; inset: 0; background: rgba(18,14,10,.88); z-index: 20; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; }
    .lightbox img { max-width: min(92vw, 980px); max-height: 78vh; border-radius: 12px; }
    .lightbox button { position: absolute; top: 50%; transform: translateY(-50%); width: 46px; height: 46px; border: 0; border-radius: 50%; background: rgba(255,255,255,.9); color: #1c1712; font-size: 24px; cursor: pointer; }
    .lightbox .prev { left: 16px; }
    .lightbox .next { right: 16px; }
    .lightbox .close { top: 16px; right: 16px; transform: none; }
    .lightbox .caption { color: #fff; font-size: 1rem; letter-spacing: .02em; }
    .story blockquote { margin: 28px 0 0; padding-left: 16px; border-left: 2px solid #b4482a; color: #1c1712; font-size: 1.05rem; }
    .back { color: #b4482a; display: inline-block; margin-bottom: 12px; }
    @media (max-width: 800px) { .about-copy { grid-template-columns: 1fr; } .about-copy img { max-width: 100%; } .place { grid-template-columns: 1fr; } .gallery { grid-template-columns: repeat(2, 1fr); } .gallery img { height: 110px; } }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="mark" href="#stories"><span class="mark-dot"></span>waymarks</a>
    <nav class="nav">
      <a href="#stories">Stories</a>
      <a href="#atlas">Atlas</a>
      <a href="#about">About</a>
    </nav>
  </header>
  <main id="app"></main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const stories = [
      {id:'willkommen', country:'Sch\u00f6n, dass du da bist', date:'7. Oktober 2026', excerpt:'Bald ist es so weit. In einem Tag starten wir unsere grosse Reise.', body:['Bald ist es so weit. In einem Tag starten wir unsere grosse Reise. Die Koffer sind fast gepackt, der K\u00fchlschrank ist leer, und die Pflanzen in gute Obhut gegeben.','F\u00fcr uns sind es viele erste Male \u2013 das erste Mal Asien, f\u00fcr mich das erste Mal Reisen ausserhalb der Schulferien, das erste Mal um die Welt.','So bin ich gespannt, welche Facetten wir an uns selbst neu entdecken d\u00fcrfen \u2013 durch so viele Spiegel in unterschiedlichen Kulturen. Ich freue mich darauf, in ganz andere Welten einzutauchen und schlussendlich auf eine andere Art zu merken, was uns in unserem Leben wirklich wichtig ist. Bald geht das Licht hier aus, und morgen Nachmittag sitzen wir schon im Flieger nach Bangkok.'], quote:'Reisen l\u00e4sst dich sprachlos und verwandelt dich dann in einen Geschichtenerz\u00e4hler.', quoteBy:'Ibn Battuta'},
      {id:'thailand', country:'Thailand', date:'9. Oktober 2026', places:[
        {id:'bangkok', country:'Bangkok', date:'9. Oktober 2026', excerpt:'Beim ersten Schritt aus dem Flughafen wehte uns eine Wand aus heissem, dickem, etwas stickigem Wind entgegen.', images:[{src:'https://n.uguu.se/LPwSsRhf.jpg',caption:'Wat Pho'},{src:'https://h.uguu.se/dHZteBoc.jpg',caption:'Wat Pho'},{src:'https://d.uguu.se/CrjCQyhF.jpg',caption:'Wat Pho'},{src:'https://h.uguu.se/tLwBWpjK.jpg',caption:'Wat Pho'},{src:'https://n.uguu.se/TGmCzKGM.jpg',caption:'Wat Pho'},{src:'https://n.uguu.se/ODCoQNOF.jpg',caption:'Tuktuk'},{src:'https://h.uguu.se/RZMAqufN.jpg',caption:'Chao Phraya'},{src:'https://n.uguu.se/GUwYjezL.jpg',caption:'Chao Phraya'},{src:'https://n.uguu.se/OEbUxURw.jpg',caption:'Khao San'},{src:'https://d.uguu.se/VyQPVMCq.jpg',caption:'Streetfood'},{src:'https://n.uguu.se/uADpFymP.jpg',caption:'Thai Tea'},{src:'https://h.uguu.se/cvurDDjp.jpg',caption:'Pad Thai'}], body:['Beim ersten Schritt aus dem Flughafen wehte uns eine Wand aus heissem, dickem, etwas stickigem Wind entgegen. Es ist 06:30 Uhr bei 28 Grad Celsius. Willkommen in Bangkok.','Da wir erst am Nachmittag in unser Hotel einchecken konnten, beschlossen wir, uns den Wat Pho anzusehen, die gr\u00f6sste der 400 Tempelanlagen der Stadt.','\u201eBangkok \u2013 where Buddhas are not just decoration.\u201c Dieses Werbeschild entdeckten wir auf unserer Fahrt in die Stadt. Dass da wohl etwas dran ist, sahen wir schon in den ersten paar Minuten in der Tempelanlage. Etwa 1000 Buddha-Statuen finden dort ihr Zuhause, wobei der bekannteste von allen ein ganz besonderer ist.','Der liegende Buddha, der sich mit 46 Metern L\u00e4nge und 15 Metern H\u00f6he durch den ganzen extra gebauten Viharn erstreckt, war sehr eindr\u00fccklich. Fast noch mehr hat uns jedoch die wundersch\u00f6ne buddhistische Wandbemalung der Versammlungshalle gefallen.','In der Halle war w\u00e4hrend der Besichtigung immer wieder ein Geklimper zu h\u00f6ren. Etwas sp\u00e4ter sahen wir auch, woher es kam: 108 Almosenschalen befinden sich auf der R\u00fcckseite des Buddhas. Jede einzelne mit Kleingeld zu f\u00fcllen soll Gl\u00fcck bringen.','Ein weiterer Teil der Tempelanlage ist die Wat Pho Medical and Massage School, wo die Wat-Pho-Massage angeboten wird. Die Massagetechnik ist tief mit der Entstehung Thailands verwoben und z\u00e4hlt heute zum UNESCO-Kulturerbe.','Da wir uns beide schon auf die Massagen in Thailand gefreut hatten, fanden wir uns wenig sp\u00e4ter gespannt in der Massagehalle ein, in der wir freundlich begr\u00fcsst wurden. Ausgestattet mit eigener Massagebekleidung, bestehend aus einem leinenartigen Hemd und einer Wickelhose, liessen wir uns in der n\u00e4chsten Stunde wortw\u00f6rtlich durchkneten und f\u00fchlten uns in guten und kr\u00e4ftigen H\u00e4nden.','Nach dem Besuch im Tempel tauchten wir in das Stadtleben der Thail\u00e4nder ein: Tempel zwischen Streetfood, Tuktuks, M\u00e4rkten und Kan\u00e4len. Eines fiel uns dabei besonders auf: Die Diskrepanz zwischen den goldenen, aufbereiteten Tempeln und der direkt danebenliegenden Lebensrealit\u00e4t der Bewohner war immens. In der Stadt liegt oft ein beissender Geruch in der Luft, wohl eine Mischung aus der enormen Luftverschmutzung und der noch nicht gut ausgebauten Abwasserentsorgung. Trotz der Armut haben die meisten Thais ihr Lachen und ihre hilfsbereite Art noch keineswegs verloren.','In jeder Ecke standen authentische Mammas, die Pad Thai und andere K\u00f6stlichkeiten kochten. Was wir probierten, war meist lecker, wobei wir uns an Maden, Schlangen und Skorpione nicht herangewagt haben.','F\u00fcr die Heimfahrt zum Hotel entschieden wir uns f\u00fcr eine Tuktuk-Fahrt. Tuktuks sind dreir\u00e4drige, moped\u00e4hnliche Rikschas, die zum Transport und als Taxi genutzt werden. Der Fahrer wollte uns die Fahrt zuerst f\u00fcr 400 Baht verkaufen, das sind etwa 10 Euro. Wir stiegen darauf nicht ein. Daraufhin bot er uns die Fahrt f\u00fcr 100 Baht an, wenn wir eine bestimmte Route mit inkludierten \u201eSehensw\u00fcrdigkeiten\u201c w\u00e4hlen w\u00fcrden. Ein guter Deal, dachten wir, nicht wissend, dass die Sehensw\u00fcrdigkeiten Tempel mit Verk\u00e4ufern und Thai Fashion beinhalteten. Thai Fashion bezeichnet dabei die unz\u00e4hligen kleinen Gesch\u00e4fte, in denen massgeschneiderte Anz\u00fcge angeboten werden. Einige Zeit sp\u00e4ter kamen wir dann ohne Anzug m\u00fcde in unserem Zimmer an.','Am Nachmittag beschlossen wir, ein anderes Transportmittel zu w\u00e4hlen, abseits der doch aufdringlichen Verk\u00e4ufer der Stadt. Auf dem gr\u00f6ssten Fluss, dem Chao Phraya, bringen Wasserbusse vor allem Touristen von A nach B. Mit der Blue Line fuhren wir s\u00fcdw\u00e4rts in Richtung Business-Viertel, wo wir in eine komplett andere Version von Thailand eintauchen konnten.','Wir stiegen beim Iconsiam aus, einem Luxus-Einkaufs- und Lifestyle-Zentrum mit beeindruckender Architektur. Neben Gucci und Prada fanden wir im Untergeschoss einen riesigen Foodmarket mit unz\u00e4hligen St\u00e4nden. Fleischspiesse, Dumplings, Meeresfr\u00fcchte und Sticky Rice teilten sich den Platz mit unz\u00e4hligen anderen Gerichten und der ber\u00fchmten Stinkfrucht Durian. Mitten im Trubel zwischen all den Foodst\u00e4nden und Tausenden Menschen fand, als w\u00e4re es das Normalste der Welt, an einem gew\u00f6hnlichen Freitagnachmittag eine Hochzeitszeremonie statt.','Auf unserem Heimweg machten wir noch einen kleinen Umweg \u00fcber die ber\u00fchmte Khao-San-Strasse. Die Partystrasse ist vor allem bei Backpackern beliebt, war uns jedoch etwas zu laut. Wir entschieden uns f\u00fcr Streetfood in der Nebenstrasse. Nach einer Fussmassage f\u00fcr 5 Euro auf dem Heimweg fielen wir anschliessend m\u00fcde und ersch\u00f6pft ins Bett.']},
        {id:'bangkok-10', country:'Bangkok', date:'10. Oktober 2026', excerpt:'Ausgeschlafen starteten wir wieder Richtung Wasserbus, dieses Mal jedoch nordw\u00e4rts.', images:[{src:'https://h.uguu.se/jWltFRML.jpg',caption:'Chatuchak Park'},{src:'https://h.uguu.se/yeZziAsh.jpg',caption:'Streetfood'}], body:['Ausgeschlafen starteten wir wieder Richtung Wasserbus, dieses Mal jedoch nordw\u00e4rts.','Unser heutiges Ziel war einer der gr\u00f6ssten Open-Air-M\u00e4rkte der Welt. Auf den 15\u2019000 St\u00e4nden des Chatuchak-Marktes kommt definitiv jeder auf seine Kosten: preiswerte Kleidung, Kunst, M\u00f6bel, Tiere oder die umfangreichen kulinarischen Angebote. Das Angebot ist riesig.','Eine wohlverdiente Pause war das Schl\u00fcrfen einer gek\u00fchlten Kokosnuss, die vor unseren Augen frisch mit einer Machete aufgeschlagen wurde. Nach unseren wahrscheinlich etwas unbeholfenen Versuchen, auch das Fleisch der Frucht mit einem Plastikl\u00f6ffel auszukratzen, kam uns eine thail\u00e4ndische Ladenbesitzerin eines anderen Standes zur Hilfe und dr\u00fcckte uns mit einem L\u00e4cheln im Gesicht einen Essl\u00f6ffel in die Hand. Gastfreundschaft, die uns auf unserer Reise in Thailand immer wieder begegnet.','Am Nachmittag schlenderten wir durch den direkt daneben liegenden Chatuchak Park. Die idyllische Oase erinnert mit ihren am Horizont erkennbaren Hochh\u00e4usern ein bisschen an den Central Park in New York. Schritt f\u00fcr Schritt wurde es leiser, und das Markttreiben und der Stadtverkehr r\u00fcckten in den Hintergrund.','Reich best\u00fcckte Bananenb\u00e4ume und Bambusstr\u00e4ucher wurden um die sanften Fl\u00fcsse und den See angelegt. Dazwischen wuselten fleissige Eichh\u00f6rnchen und verschiedenste V\u00f6gel.','Zur\u00fcck am Markt bereiteten sich die Einheimischen gerade auf den Abendtourismus vor. Wie aus dem Nichts erschienen unz\u00e4hlige neue Streetfood-St\u00e4nde auf den Strassen. Wir machten uns langsam auf den Weg Richtung Flughafen, raus aus der lebendigen Millionenmetropole, hin zur n\u00f6rdlich gelegenen kleineren Stadt Chiang Mai. Wir sind gespannt, was uns zwischen den Bergv\u00f6lkern der Karen, den Elefantenschutzst\u00e4tten und dem Dschungel erwarten wird.']},
        {id:'chiangmai', country:'Chiang Mai', date:'10. Oktober 2026'}
      ]},
      {id:'japan', country:'Japan', date:'15. Oktober 2026'},
      {id:'hawaii', country:'Hawaii', date:'26. Oktober 2026'},
      {id:'usa', country:'USA', date:'5. November 2026'}
    ];
    const places = [['8. Oktober','M\u00fcnchen \u2013 Bangkok'],['10. Oktober','Bangkok \u2013 Chiang Mai'],['13. Oktober','Chiang Mai \u2013 Bangkok'],['15. Oktober','Bangkok \u2013 Tokio'],['27. Oktober','Tokio \u2013 Honolulu'],['5. November','Honolulu \u2013 San Francisco'],['22. November','Phoenix \u2013 London'],['23. November','London \u2013 Z\u00fcrich']];
    const airports = { MUC:{lat:48.3538,lng:11.7861}, BKK:{lat:13.69,lng:100.7501}, DMK:{lat:13.9126,lng:100.6068}, CNX:{lat:18.7668,lng:98.9626}, NRT:{lat:35.772,lng:140.3929}, HNL:{lat:21.3187,lng:-157.9225}, SFO:{lat:37.6213,lng:-122.379}, PHX:{lat:33.4373,lng:-112.0078}, LHR:{lat:51.47,lng:-0.4543}, ZRH:{lat:47.4582,lng:8.5555} };
    const countries = [{name:'Deutschland',lat:50.8,lng:10.2},{name:'Thailand',lat:14.8,lng:101.8},{name:'Japan',lat:37.5,lng:138.2},{name:'USA',lat:39.5,lng:-98.3},{name:'Schweiz',lat:46.8,lng:8.2}];
    const flights = [{from:'MUC',to:'BKK',date:'2026-10-08'},{from:'DMK',to:'CNX',date:'2026-10-10'},{from:'CNX',to:'BKK',date:'2026-10-13'},{from:'BKK',to:'NRT',date:'2026-10-15'},{from:'NRT',to:'HNL',date:'2026-10-27'},{from:'HNL',to:'SFO',date:'2026-11-05'},{from:'PHX',to:'LHR',date:'2026-11-22'},{from:'LHR',to:'ZRH',date:'2026-11-23'}];
    function todayIso(){ const n=new Date(); return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0'); }
    function visible(f,t){ return f.date==='2026-10-08' || f.date<=t; }
    function arc(a,b){ const p=[]; let lng2=b.lng; if(Math.abs(lng2-a.lng)>180) lng2+=lng2>a.lng?-360:360; for(let i=0;i<=64;i++){ const t=i/64; p.push([a.lat+(b.lat-a.lat)*t+Math.sin(Math.PI*t)*2.2, a.lng+(lng2-a.lng)*t]); } return p; }
    function pin(){ return L.divIcon({className:'pin', html:'<i></i>', iconSize:[9,12], iconAnchor:[4,11]}); }
    function card(s, href){ return '<article class="post'+(s.id==='willkommen'?' welcome':'')+'"><p class="kicker">'+s.date+'</p><h2>'+(href?'<a href="'+href+'">'+s.country+'</a>':s.country)+'</h2>'+(s.excerpt?'<p>'+s.excerpt+'</p>':'')+(href?'<a class="more" href="'+href+'">Weiterlesen</a>':'')+'</article>'; }
    function showStories(){ document.getElementById('app').innerHTML='<div class="posts">'+stories.map(s=>card(s, s.places||s.body?'#story/'+s.id:null)).join('')+'</div>'; }
    function showCountry(id){ const s=stories.find(x=>x.id===id); if(!s||!s.places){ showStory(id); return; } document.getElementById('app').innerHTML='<article class="story"><a class="back" href="#stories">\u2190 Alle Geschichten</a><p class="kicker">'+s.date+'</p><h2>'+s.country+'</h2><div class="posts">'+s.places.map(p=>card(p, p.body?'#story/'+p.id:null)).join('')+'</div></article>'; }
    function findPlace(id){ for(const s of stories){ if(s.places){ const p=s.places.find(x=>x.id===id); if(p) return {place:p, parent:s}; } if(s.id===id) return {place:s, parent:null}; } return {place:stories[0], parent:null}; }
    function openGallery(images, start){
      let i=start;
      const box=document.createElement('div'); box.className='lightbox';
      box.innerHTML='<button class="close" type="button" aria-label="Schliessen">\u00d7</button><button class="prev" type="button" aria-label="Zur\u00fcck">\u2039</button><img referrerpolicy="no-referrer" alt="Foto"><p class="caption"></p><button class="next" type="button" aria-label="Weiter">\u203a</button>';
      document.body.appendChild(box);
      const img=box.querySelector('img'); const caption=box.querySelector('.caption');
      function show(n){ i=(n+images.length)%images.length; img.src=images[i].src+'?v=5'; caption.textContent=images[i].caption||''; }
      box.querySelector('.prev').onclick=()=>show(i-1);
      box.querySelector('.next').onclick=()=>show(i+1);
      box.querySelector('.close').onclick=()=>box.remove();
      box.onclick=(e)=>{ if(e.target===box) box.remove(); };
      document.onkeydown=(e)=>{ if(e.key==='ArrowRight') show(i+1); if(e.key==='ArrowLeft') show(i-1); if(e.key==='Escape') box.remove(); };
      show(i);
    }
    function showStory(id){
      const found=findPlace(id); const s=found.place; const back=found.parent?'#story/'+found.parent.id:'#stories';
      const photos=s.images&&s.images.length?'<div class="gallery">'+s.images.map((photo,i)=>'<button type="button" data-i="'+i+'"><img alt="'+(photo.caption||s.country)+'" referrerpolicy="no-referrer" src="'+photo.src+'?v=5"></button>').join('')+'</div>':'';
      document.getElementById('app').innerHTML='<article class="story'+(s.id==='willkommen'?' welcome':'')+'"><a class="back" href="'+back+'">\u2190 Zur\u00fcck</a><p class="kicker">'+s.date+'</p><h2>'+s.country+'</h2>'+(s.body||[]).map(p=>'<p>'+p+'</p>').join('')+photos+(s.quote?'<blockquote>\u201e'+s.quote+'\u201c <span class="meta">\u2014 '+s.quoteBy+'</span></blockquote>':'')+'</article>';
      document.querySelectorAll('.gallery button').forEach(btn=>btn.onclick=()=>openGallery(s.images, Number(btn.dataset.i)));
    }
    function showAtlas(){
      const today=todayIso();
      document.getElementById('app').innerHTML='<div class="section-head"><h2>Atlas</h2></div><div id="worldMap"></div><div class="places">'+places.map(p=>'<div class="place"><strong>'+p[0]+'</strong><span>'+p[1]+'</span></div>').join('')+'</div>';
      const map=L.map('worldMap',{worldCopyJump:true}).setView([28,15],2);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'\u00a9 OpenStreetMap',maxZoom:8}).addTo(map);
      countries.forEach(c=> L.marker([c.lat,c.lng],{interactive:false,opacity:0}).bindTooltip(c.name,{permanent:true,direction:'center',className:'country-label'}).addTo(map));
      Object.keys(airports).forEach(code=>{ if(code==='DMK') return; L.marker([airports[code].lat,airports[code].lng],{icon:pin()}).addTo(map); });
      flights.filter(f=>visible(f,today)).forEach(f=> L.polyline(arc(airports[f.from],airports[f.to]),{color:'#9a5344',weight:1.1,opacity:.8,dashArray:'1.5 7',lineCap:'round'}).addTo(map));
      setTimeout(()=>map.invalidateSize(),200);
    }
    function showAbout(){ document.getElementById('app').innerHTML='<section class="about-copy"><div><h2>Kerstin & Stefan</h2><p>Begleite uns auf unserer Reise einmal um die Welt. Vom Gro\u00dfstadtdschungel Bangkok \u00fcber die unbekannten Kulturen Japans und die historischen Kultursch\u00e4tze Hawaiis bis in die Weiten der USA, und zu allem, was uns dazwischen begegnet.</p></div><img alt="Kerstin und Stefan" src="https://n.uguu.se/QfnhYafx.jpg"></section>'; }
    function go(){ const hash=location.hash||'#stories'; if(hash==='#atlas') showAtlas(); else if(hash==='#about') showAbout(); else if(hash==='#story/thailand') showCountry('thailand'); else if(hash.startsWith('#story/')) showStory(hash.slice(7)); else showStories(); }
    window.addEventListener('hashchange', go); go();
  </script>
</body>
</html>
