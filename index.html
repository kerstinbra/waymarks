<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>waymarks</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { font-family: Poppins, sans-serif; }
    .post { margin: 1rem 0; padding: 1rem; border-bottom: 1px solid #ddd; }
  </style>
</head>
<body>
  <header><a href="#stories">waymarks</a></header>
  <main id="app"></main>
  <script>
    const stories = [
      {id:'willkommen', country:'Schön, dass du da bist', date:'7. Oktober 2026', excerpt:'Bald ist es so weit.'},
      {id:'thailand', country:'Thailand', date:'9. Oktober 2026'},
      {id:'japan', country:'Japan', date:'15.+16. Oktober 2026'},
      {id:'hawaii', country:'Hawaii', date:'27. Oktober 2026', places:[
        {id:'road-to-hana', country:'Road to Hana', date:'28. Oktober 2026', excerpt:'Road to Hana'},
        {id:'haleakala', country:'Maui – Haleakalā', date:'3. November 2026', excerpt:'Haleakalā Nationalpark'},
        {id:'oahu-4-5', country:'Oahu', date:'4.–5. November 2026', excerpt:'Abschied von Hawaii'}
      ]},
      {id:'usa', country:'USA', date:'5. November 2026'}
    ];
    function showStories(){
      document.getElementById('app').innerHTML = '<div>' + stories.map(s => 
        '<div class="post"><h2>' + s.country + '</h2><p>' + (s.date||'') + '</p>' + 
        (s.places ? s.places.map(p=>'<p>'+p.country+' – '+p.date+'</p>').join('') : '') +
        '</div>'
      ).join('') + '</div>';
    }
    showStories();
  </script>
</body>
</html>
