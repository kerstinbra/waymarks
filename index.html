    const stories = [
      {id:'willkommen', country:'Sch\u00f6n, dass du da bist', date:'7. Oktober 2026', en:{country:'Nice to have you here', date:'7 October 2026', excerpt:'The countdown is on. In one day we start our big journey.', body:['The countdown is on. In one day we start our big journey. The suitcases are almost packed, the fridge is empty, and the plants are in good hands.','For us these are many firsts – the first time in Asia, for me the first time travelling outside the school holidays, the first time around the world.','I am curious which facets of ourselves we may discover – through so many mirrors in different cultures. I look forward to diving into entirely different worlds and finally noticing, in a different way, what is really important to us in our lives. Soon the lights go out here, and tomorrow afternoon we will already be on the plane to Bangkok.','“Travel makes you speechless and then turns you into a storyteller.” — Ibn Battuta']}, excerpt:'Bald ist es so weit. In einem Tag starten wir unsere grosse Reise.', body:['Bald ist es so weit. In einem Tag starten wir unsere grosse Reise. Die Koffer sind fast gepackt, der K\u00fchlschrank ist leer, und die Pflanzen in gute Obhut gegeben.','F\u00fcr uns sind es viele erste Male \u2013 das erste Mal Asien, f\u00fcr mich das erste Mal Reisen ausserhalb der Schulferien, das erste Mal um die Welt.','So bin ich gespannt, welche Facetten wir an uns selbst neu entdecken d\u00fcrfen \u2013 durch so viele Spiegel in unterschiedlichen Kulturen. Ich freue mich darauf, in ganz andere Welten einzutauchen und schlussendlich auf eine andere Art zu merken, was uns in unserem Leben wirklich wichtig ist. Bald geht das Licht hier aus, und morgen Nachmittag sitzen wir schon im Flieger nach Bangkok.'], quote:'Reisen l\u00e4sst dich sprachlos und verwandelt dich dann in einen Geschichtenerz\u00e4hler.', quoteBy:'Ibn Battuta'},
      {id:'thailand', country:'Thailand', date:'9. Oktober 2026', en:{country:'Thailand', date:'9 October 2026'}, places:[
        {id:'bangkok', country:'Bangkok', date:'9. Oktober 2026', en:{country:'Bangkok', date:'9 October 2026', excerpt:'As we stepped out of the airport a wall of hot, thick, slightly sticky air hit us.', body:['As we stepped out of the airport a wall of hot, thick, slightly sticky air hit us. It is 6:30 in the morning and 28 degrees. Welcome to Bangkok.','Since we could not check into our hotel until the afternoon, we decided to visit Wat Pho, the largest of the city\'s 400 temple complexes.','"Bangkok – where Buddhas are not just decoration." We spotted this sign on our way into the city. That there was something to it became clear within the first few minutes inside the temple grounds. Around 1,000 Buddha statues have their home there, and the most famous of them is a very special one.','The reclining Buddha, stretching 46 metres long and 15 metres high through an entire hall built just for him, was deeply impressive. Almost even more, though, we loved the beautiful Buddhist wall paintings of the assembly hall.','Inside the hall we kept hearing a clinking sound. A little later we saw where it came from: 108 alms bowls line the back of the Buddha, and filling each one with coins is said to bring good luck.','Another part of the temple complex is the Wat Pho Medical and Massage School, where the Wat Pho massage is offered. The technique is deeply woven into the origins of Thailand and is now part of the UNESCO cultural heritage.','Since we had both been looking forward to the massages in Thailand, we treated ourselves to one. We felt in good (and strong ;-)) hands.','After the temple we immersed ourselves in the everyday life of the Thais: temples between street food, tuk-tuks, markets and canals. One thing stood out: the gap between the golden, restored temples and the everyday reality of the people living right next to them was immense. In the city there is often a biting smell – probably a mix of the heavy air pollution and the still poorly developed sewage system. Despite the poverty, most Thais have by no means lost their laughter and their helpful nature.','In every corner stood authentic mamas cooking Pad Thai and other delicacies. What we tried was mostly delicious – though we did not dare the maggots, snakes and scorpions.','For the ride back to the hotel we chose a tuk-tuk. Tuk-tuks are three-wheeled, moped-like rickshaws used for transport and as taxis. The driver first wanted 400 baht for the ride, about 10 euros. We did not take it. He then offered the ride for 100 baht if we chose a certain route with included "sights". A good deal, we thought, not knowing that the sights included temples with vendors and Thai Fashion. Thai Fashion refers to the countless small shops where custom-made suits are offered. Some time later we arrived, without a suit, tired in our room.','In the afternoon we decided to choose a different means of transport, away from the rather pushy vendors of the city. On the largest river, the Chao Phraya, water buses take mainly tourists from A to B. On the Blue Line we rode south towards the business district, where we could dive into a completely different version of Thailand. We got off at Iconsiam, a luxury shopping and lifestyle centre with impressive architecture. Besides Gucci and Prada we found a huge food market in the basement with countless stalls. Meat skewers, dumplings, seafood and sticky rice shared the space with countless other dishes and the famous "stink fruit" durian. In the middle of the hustle between all the food stalls and thousands of people, as if it were the most normal thing in the world, a wedding ceremony took place on an ordinary Friday afternoon.','On our way back we made a small detour via the famous Khao San Road. The party street is especially popular with backpackers, but it was a bit too loud for us. We chose street food in a side street. After a 5-euro foot massage on the way back we then fell tired and exhausted into bed.']}, images:[{src:'images/watpho-spires.jpg',caption:'Wat Pho'},{src:'images/watpho-buddhas.jpg',caption:'Wat Pho'},{src:'images/watpho-hall.jpg',caption:'Wat Pho'},{src:'images/watpho-reclining.jpg',caption:'Wat Pho'},{src:'images/watpho-laughing.jpg',caption:'Wat Pho'},{src:'images/tuktuk.jpg',caption:'Tuktuk'},{src:'images/chao-phraya.jpg',caption:'Chao Phraya'},{src:'images/chao-phraya-2.jpg',caption:'Chao Phraya'},{src:'images/khaosan.jpg',caption:'Khao San'},{src:'images/streetfood.jpg',caption:'Streetfood'},{src:'images/thai-tea.jpg',caption:'Thai Tea'},{src:'images/pad-thai.jpg',caption:'Pad Thai'}], body:['Beim ersten Schritt aus dem Flughafen wehte uns eine Wand aus heissem, dickem, etwas stickigem Wind entgegen. Es ist 06:30 Uhr bei 28 Grad Celsius. Willkommen in Bangkok.','Da wir erst am Nachmittag in unser Hotel einchecken konnten, beschlossen wir, uns den Wat Pho anzusehen, die gr\u00f6sste der 400 Tempelanlagen der Stadt.','\u201eBangkok \u2013 where Buddhas are not just decoration.\u201c Dieses Werbeschild entdeckten wir auf unserer Fahrt in die Stadt. Dass da wohl etwas dran ist, sahen wir schon in den ersten paar Minuten in der Tempelanlage. Etwa 1000 Buddha-Statuen finden dort ihr Zuhause, wobei der bekannteste von allen ein ganz besonderer ist.','Der liegende Buddha, der sich mit 46 Metern L\u00e4nge und 15 Metern H\u00f6he durch den ganzen extra gebauten Viharn erstreckt, war sehr eindr\u00fccklich. Fast noch mehr hat uns jedoch die wundersch\u00f6ne buddhistische Wandbemalung der Versammlungshalle gefallen.','In der Halle war w\u00e4hrend der Besichtigung immer wieder ein Geklimper zu h\u00f6ren. Etwas sp\u00e4ter sahen wir auch, woher es kam: 108 Almosenschalen befinden sich auf der R\u00fcckseite des Buddhas. Jede einzelne mit Kleingeld zu f\u00fcllen soll Gl\u00fcck bringen.','Ein weiterer Teil der Tempelanlage ist die Wat Pho Medical and Massage School, wo die Wat-Pho-Massage angeboten wird. Die Massagetechnik ist tief mit der Entstehung Thailands verwoben und z\u00e4hlt heute zum UNESCO-Kulturerbe.','Da wir uns beide schon auf die Massagen in Thailand gefreut hatten, fanden wir uns wenig sp\u00e4ter gespannt in der Massagehalle ein, in der wir freundlich begr\u00fcsst wurden. Ausgestattet mit eigener Massagebekleidung, bestehend aus einem leinenartigen Hemd und einer Wickelhose, liessen wir uns in der n\u00e4chsten Stunde wortw\u00f6rtlich durchkneten und f\u00fchlten uns in guten und kr\u00e4ftigen H\u00e4nden.','Nach dem Besuch im Tempel tauchten wir in das Stadtleben der Thail\u00e4nder ein: Tempel zwischen Streetfood, Tuktuks, M\u00e4rkten und Kan\u00e4len. Eines fiel uns dabei besonders auf: Die Diskrepanz zwischen den goldenen, aufbereiteten Tempeln und der direkt danebenliegenden Lebensrealit\u00e4t der Bewohner war immens. In der Stadt liegt oft ein beissender Geruch in der Luft, wohl eine Mischung aus der enormen Luftverschmutzung und der noch nicht gut ausgebauten Abwasserentsorgung. Trotz der Armut haben die meisten Thais ihr Lachen und ihre hilfsbereite Art noch keineswegs verloren.','In jeder Ecke standen authentische Mammas, die Pad Thai und andere K\u00f6stlichkeiten kochten. Was wir probierten, war meist lecker, wobei wir uns an Maden, Schlangen und Skorpione nicht herangewagt haben.','F\u00fcr die Heimfahrt zum Hotel entschieden wir uns f\u00fcr eine Tuktuk-Fahrt. Tuktuks sind dreir\u00e4drige, moped\u00e4hnliche Rikschas, die zum Transport und als Taxi genutzt werden. Der Fahrer wollte uns die Fahrt zuerst f\u00fcr 400 Baht verkaufen, das sind etwa 10 Euro. Wir stiegen darauf nicht ein. Daraufhin bot er uns die Fahrt f\u00fcr 100 Baht an, wenn wir eine bestimmte Route mit inkludierten \u201eSehensw\u00fcrdigkeiten\u201c w\u00e4hlen w\u00fcrden. Ein guter Deal, dachten wir, nicht wissend, dass die Sehensw\u00fcrdigkeiten Tempel mit Verk\u00e4ufern und Thai Fashion beinhalteten. Thai Fashion bezeichnet dabei die unz\u00e4hligen kleinen Gesch\u00e4fte, in denen massgeschneiderte Anz\u00fcge angeboten werden. Einige Zeit sp\u00e4ter kamen wir dann ohne Anzug m\u00fcde in unserem Zimmer an.','Am Nachmittag beschlossen wir, ein anderes Transportmittel zu w\u00e4hlen, abseits der doch aufdringlichen Verk\u00e4ufer der Stadt. Auf dem gr\u00f6ssten Fluss, dem Chao Phraya, bringen Wasserbusse vor allem Touristen von A nach B. Mit der Blue Line fuhren wir s\u00fcdw\u00e4rts in Richtung Business-Viertel, wo wir in eine komplett andere Version von Thailand eintauchen konnten.','Wir stiegen beim Iconsiam aus, einem Luxus-Einkaufs- und Lifestyle-Zentrum mit beeindruckender Architektur. Neben Gucci und Prada fanden wir im Untergeschoss einen riesigen Foodmarket mit unz\u00e4hligen St\u00e4nden. Fleischspiesse, Dumplings, Meeresfr\u00fcchte und Sticky Rice teilten sich den Platz mit unz\u00e4hligen anderen Gerichten und der ber\u00fchmten Stinkfrucht Durian. Mitten im Trubel zwischen all den Foodst\u00e4nden und Tausenden Menschen fand, als w\u00e4re es das Normalste der Welt, an einem gew\u00f6hnlichen Freitagnachmittag eine Hochzeitszeremonie statt.','Auf unserem Heimweg machten wir noch einen kleinen Umweg \u00fcber die ber\u00fchmte Khao-San-Strasse. Die Partystrasse ist vor allem bei Backpackern beliebt, war uns jedoch etwas zu laut. Wir entschieden uns f\u00fcr Streetfood in der Nebenstrasse. Nach einer Fussmassage f\u00fcr 5 Euro auf dem Heimweg fielen wir anschliessend m\u00fcde und ersch\u00f6pft ins Bett.']},
        {id:'bangkok-10', country:'Bangkok', date:'10. Oktober 2026', en:{country:'Bangkok', date:'10 October 2026', excerpt:'Well rested, we headed back towards the water bus, this time northwards.', body:['Well rested, we headed back towards the water bus, this time northwards. Our destination today was one of the largest open-air markets in the world. On the 15,000 stalls of Chatuchak Market there is definitely something for everyone – whether affordable clothing, art, furniture, animals or the extensive culinary offerings, the selection is huge.','A well-deserved break was slurping a chilled coconut, freshly split open with a machete before our eyes. After our probably somewhat clumsy attempts to scrape out the flesh with a plastic spoon, a Thai shop owner from another stall came to our help and, with a smile, pressed a tablespoon into our hands. Hospitality that we encountered again and again on our journey in Thailand.','In the afternoon we strolled through the Chatuchak Park right next door. The idyllic oasis, with its high-rises visible on the horizon, reminds one a little of Central Park in New York. Step by step it became quieter and the market bustle and city traffic faded into the background.','Well-stocked banana trees and bamboo shrubs were planted around the gentle streams and the lake, and between them scurried busy squirrels and all kinds of birds.','Back at the market the locals were just preparing for the evening tourism – as if from nowhere, countless new street-food stalls appeared on the streets. We slowly made our way towards the airport – out of the lively metropolis, towards the smaller city of Chiang Mai in the north. We are curious what awaits us among the mountain peoples of the Karen, the elephant sanctuaries and the jungle.']}, excerpt:'Ausgeschlafen starteten wir wieder Richtung Wasserbus, dieses Mal jedoch nordw\u00e4rts.', images:[{src:'images/chatuchak-park.jpg',caption:'Chatuchak Park'},{src:'images/chatuchak-skyline.jpg',caption:'Chatuchak Park'},{src:'images/chatuchak-bamboo.jpg',caption:'Chatuchak Park'},{src:'images/chatuchak-bamboo-2.jpg',caption:'Chatuchak Park'},{src:'images/chatuchak-art.jpg',caption:'Chatuchak'},{src:'images/streetfood-night.jpg',caption:'Streetfood'},{src:'images/streetfood-drinks.jpg',caption:'Streetfood'}], body:['Ausgeschlafen starteten wir wieder Richtung Wasserbus, dieses Mal jedoch nordw\u00e4rts.','Unser heutiges Ziel war einer der gr\u00f6ssten Open-Air-M\u00e4rkte der Welt. Auf den 15\u2019000 St\u00e4nden des Chatuchak-Marktes kommt definitiv jeder auf seine Kosten: preiswerte Kleidung, Kunst, M\u00f6bel, Tiere oder die umfangreichen kulinarischen Angebote. Das Angebot ist riesig.','Eine wohlverdiente Pause war das Schl\u00fcrfen einer gek\u00fchlten Kokosnuss, die vor unseren Augen frisch mit einer Machete aufgeschlagen wurde. Nach unseren wahrscheinlich etwas unbeholfenen Versuchen, auch das Fleisch der Frucht mit einem Plastikl\u00f6ffel auszukratzen, kam uns eine thail\u00e4ndische Ladenbesitzerin eines anderen Standes zur Hilfe und dr\u00fcckte uns mit einem L\u00e4cheln im Gesicht einen Essl\u00f6ffel in die Hand. Gastfreundschaft, die uns auf unserer Reise in Thailand immer wieder begegnet.','Am Nachmittag schlenderten wir durch den direkt daneben liegenden Chatuchak Park. Die idyllische Oase erinnert mit ihren am Horizont erkennbaren Hochh\u00e4usern ein bisschen an den Central Park in New York. Schritt f\u00fcr Schritt wurde es leiser, und das Markttreiben und der Stadtverkehr r\u00fcckten in den Hintergrund.','Reich best\u00fcckte Bananenb\u00e4ume und Bambusstr\u00e4ucher wurden um die sanften Fl\u00fcsse und den See angelegt. Dazwischen wuselten fleissige Eichh\u00f6rnchen und verschiedenste V\u00f6gel.','Zur\u00fcck am Markt bereiteten sich die Einheimischen gerade auf den Abendtourismus vor. Wie aus dem Nichts erschienen unz\u00e4hlige neue Streetfood-St\u00e4nde auf den Strassen. Wir machten uns langsam auf den Weg Richtung Flughafen, raus aus der lebendigen Millionenmetropole, hin zur n\u00f6rdlich gelegenen kleineren Stadt Chiang Mai. Wir sind gespannt, was uns zwischen den Bergv\u00f6lkern der Karen, den Elefantenschutzst\u00e4tten und dem Dschungel erwarten wird.']},
        {id:'chiangmai', country:'Chiang Mai', date:'11.\u201312. Oktober 2026', en:{country:'Chiang Mai', date:'11\u201312 October 2026', excerpt:'Arriving in the north, we started our day with a generous breakfast buffet.', body:['Arriving in the north, we started our day with a generous, plentiful breakfast buffet. From European jam bread to Thai rice dishes, American classics and fresh fruit, everything was there. With full stomachs and a backpack packed for the next two days, we were then picked up punctually in the hotel lobby. The reason we travelled to the north of Thailand was the two-day trip that now lay ahead of us. The aim was to discover the more rural area in the jungle of Thailand, away from the tourist masses.','After a car ride with the group we met our guides – two young men from the Karen villages, with a big grin on their faces and a funny remark on their lips, even if in broken English.','The Karen is a collective term for the indigenous inhabitants of the Thai mountains. Originally many of the peoples come from Myanmar. Since the withdrawal of the British there have been major conflicts between the Burmese military and the Karen, which is why many of the groups fled to Thailand.','So we began our hike up into the mountains of Thailand. The two guides, equipped with their simple plastic flip-flops, set a very ambitious pace with ease. Shortly afterwards a bamboo walking stick was quickly and skilfully made for each of the group.','Our first stop was a wonderful waterfall, where we also enjoyed our lunch. Everyone received an egg rice, carefully and artfully wrapped in a banana leaf. Full of joy, one of the guides pulled a 10 cm spider out of a web and presented it to us, holding it between his fingers in front of our noses. After a cool-down in the waterfall we continued to an "ethical" elephant sanctuary. The first encounter with the animals was incredibly fascinating. Their size, grace and the peace they radiate fascinated us. The keepers told us where they had rescued the animals – one of them still had visible traces of the restraints with which it had been locked up, on its head. And that after it had already been free for 20 years. We were allowed to feed the animals, stroke them and then bathe with them. Even though we enjoyed it very much, there was a voice in the back of our minds wondering whether the animals were really kept so ethically.','After a short further march we continued to the Karen village, where our accommodation and the goal of the day would be. At the first few steps into the village a few pigs grunted at us, tied with simple ropes around their feet. The people smiled at us in their colourful, traditional clothes. The poverty of the people was reflected in very simple living conditions.','Our accommodation was a simple wooden hut standing on stilts – perhaps to keep wild animals away. Our beds were simple mattresses on the floor, fitted with a mosquito net. As a couple we were lucky to have our own "room", while the others slept in a large room. On the balcony in front of the bedroom was a large table on which dinner was also served. And this dinner probably exceeded the expectations and ideas of everyone. The cook and two other people came with plates full of rice, curry, pumpkin with egg, vegetables and watermelon – it was delicious.','After dark our guides lit a fire. We asked them whether there were also snakes in the jungle of Thailand. Yes, they said, but not in the village. The villagers believe that there are spirits that keep them away from the village.','Originally the culture of the Karen was strongly connected with animism, a religion that does not worship one god but assumes that living and non-living things possess a spirit or a soul. Many of the peoples converted to Christianity after the mission, and so in the village we visited there was a Catholic, a Baptist and a Buddhist religious community. Some practices and rituals of the original culture were, however, retained.','So there are, for example, also in Bangkok in front of many houses a small shrine that is used for offerings to the spirit beings.','One of the guides, who spoke better English, told us that he had taught himself all the English, mainly through contact with the tourists. In the school he went to, he said, he had only learned to write, nothing more. He does the tours once a week, otherwise he works with his family on the rice field as a farmer. The rice they grow is not available for sale. It serves solely to feed the village he lives in. The other guide introduced us in the village to his two-year-old son, even though he himself was only just 21 years old.','So the day drew to a close, and all that could be heard were the sounds of the animals from the jungle.','The next morning the smell of fresh scrambled eggs drifted into our noses. When the bread ran out, one of the guides brought us the bread from his own home. "No problem, we eat rice", he said with a friendly smile. We did not accept it, since it was probably meant for his little boy. Still, it touched us anew how, even though they themselves did not have much, they would give everything for their guests.','So a short time later we left the little village behind us and walked downstream. After about half an hour we could already hear a loud rushing. A few metres of elevation lower down another beautiful waterfall awaited us, behind which one could even go into a small, cool half-cave. After a short break we continued in single file. Surrounded by sunshine and wide, green rice fields we crept along the narrow paths until suddenly we could watch 25 of the Karen at the rice harvest. Without further ado our guide grabbed a few of the sickles, and before we knew it we were in the middle of the action and helped cut the rice. Though I am not sure whether that really made them faster.','Downstream it went for about another hour and a half through the dense jungle. Again and again we heard something rustling and did not yet give up hope of spotting a monkey. Slowly the area became more inhabited again. We walked through shady banana plantations, and gradually the first houses of the town appeared. There our taxi was waiting for us again, and when we turned around we noticed that it was exactly the spot where we had set off the day before.','In the air-conditioned bus we drove to a small restaurant where we were served Pad Thai. The toilets, as in the little village, had no flush, but a rain barrel with water and a plastic container that fulfils this function. Sated by our felt tenth Pad Thai, which the Thais apparently do not eat themselves, we went to the last stop: a five-metre-long bamboo raft with which we rafted quietly through the river for half an hour. In the end the ride was much gentler than expected, but in return we could still spot some elephants on the riverbank.','Arriving at the lower base it was time to say goodbye to our guides before the journey home. We would gladly have asked them so much more: about the way they live, what occupies them, what moves them. But that was unfortunately not possible at all because of the language barrier. Still, they gave us experiences and showed us insights into an entirely different world that will stay with us for a long time. It was our money\'s worth in any case, and we hope that a large part of it will really flow to our guides and their families.']}, excerpt:'Angekommen im Norden starteten wir unseren Tag mit einem ausgiebigen Fr\u00fchst\u00fccksbuffet.', images:[{src:'images/cnx-hike-fields.jpg',caption:'Reisfeld'},{src:'images/cnx-hike-forest.jpg',caption:'Wanderung'},{src:'images/cnx-hike-selfie.jpg',caption:'Wanderung'},{src:'images/cnx-rice.jpg',caption:'Reisernte'},{src:'images/cnx-eierreis.jpg',caption:'Eier-Reis im Bananenblatt'},{src:'images/cnx-spider.jpg',caption:'Spinne'},{src:'images/cnx-insect.jpg',caption:'Dschungel'},{src:'images/cnx-stream.jpg',caption:'Dschungel'},{src:'images/cnx-elephant-feed.jpg',caption:'Elefanten'},{src:'images/cnx-elephant-feed2.jpg',caption:'Elefanten'},{src:'images/cnx-elephant-trunk.jpg',caption:'Elefanten'},{src:'images/cnx-elephants.jpg',caption:'Elefanten'},{src:'images/cnx-elephant-bath.jpg',caption:'Elefanten'}], body:[
'Angekommen im Norden starteten wir unseren Tag mit einem ausgiebigen, reichhaltigen Fr\u00fchst\u00fccksbuffet. Vom europ\u00e4ischen Marmeladebrot \u00fcber thail\u00e4ndische Reisgerichte und amerikanische Klassiker bis zu frischem Obst war alles dabei. Mit vollem Magen und einem Rucksack f\u00fcr die n\u00e4chsten zwei Tage wurden wir danach p\u00fcnktlich in der Hotellobby abgeholt.',
'Der Grund, warum wir in den Norden Thailands gereist waren, war der zweit\u00e4gige Trip, der uns nun bevorstand. Ziel war das Entdecken der l\u00e4ndlicheren Gegend im Dschungel, abseits der Touristenmassen.',
'Nach einer Autofahrt mit der Reisegruppe lernten wir unsere Guides kennen: zwei junge M\u00e4nner aus den Karend\u00f6rfern, mit einem breiten Grinsen und einem lustigen Spruch auf den Lippen, auch wenn im gebrochenen Englisch.',
'Die Karen sind ein Sammelbegriff f\u00fcr die indigenen Bewohner der thail\u00e4ndischen Berge. Urspr\u00fcnglich stammen viele der V\u00f6lker aus Myanmar. Seit dem Abzug der Briten herrschen zwischen dem burmesischen Milit\u00e4r und den Karen grosse Konflikte, weswegen viele Gruppen nach Thailand gefl\u00fcchtet sind.',
'So begannen wir unsere Wanderung hinauf in die Berge Thailands. Die zwei Guides legten dabei mit Leichtigkeit, ausger\u00fcstet mit ihren simplen Plastik-Schlappen, ein sehr ambitioniertes Tempo vor. Kurz darauf wurde f\u00fcr jeden der Gruppe flink und geschickt ein Bambus-Gehstock geschnitzt. Immer wieder gab es kurze Stopps, in denen sie uns etwas zu den heimischen Pflanzen und Tieren erz\u00e4hlten. Sie taten das mit einer Faszination und Begeisterung, die mich immer noch zum L\u00e4cheln bringt.',
'Unser erster Stopp war ein wundervoller Wasserfall, wo wir auch unser Mittagessen genossen. Jeder bekam einen Eier-Reis, sorgf\u00e4ltig und kunstvoll in ein Bananenblatt eingewickelt. Voller Freude holte einer der Guides eine zehn Zentimeter grosse Spinne aus einem Netz und hielt sie uns zwischen den Fingern vors Gesicht. Nach einer Abk\u00fchlung im Wasserfall ging es weiter zu einem \u201eethischen\u201c Elefantenschutzgebiet.',
'Die erste Begegnung mit den Tieren war unglaublich faszinierend. Ihre Gr\u00f6sse, Anmut und der Frieden, den sie ausstrahlen, faszinierten uns. Die Pfleger erz\u00e4hlten uns, wo sie die Tiere gerettet haben. Eines der Tiere hatte immer noch sichtbare Spuren der Haltung, in der es eingesperrt gewesen war, auf dem Kopf. Und das, nachdem es schon 20 Jahre befreit war. Wir durften die Tiere f\u00fcttern, streicheln und anschliessend mit ihnen baden. Obwohl wir es sehr genossen, meldete sich im Hinterkopf doch eine Stimme, die fragte, ob die Tiere wirklich so ethisch gehalten wurden.',
'Nach einem kleinen weiteren Marsch ging es weiter zum Karendorf, wo auch unsere Unterkunft und das Ziel des heutigen Tages sein sollte. Bei den ersten paar Schritten ins Dorf kamen uns grunzend ein paar Schweine entgegen, die mit einfachen Schn\u00fcren um den Fuss festgebunden waren. Die Menschen l\u00e4chelten uns in ihren farbigen, traditionellen Kleidern entgegen. Die Armut spiegelte sich in sehr einfachen Wohnverh\u00e4ltnissen.',
'Unsere Unterkunft war eine einfache Holzh\u00fctte, die auf Pfeilern stand, vielleicht um wilde Tiere fernzuhalten. Unsere Betten waren einfache Matratzen am Boden, versehen mit einem Moskitonetz. Wir als Paar hatten das Gl\u00fcck, ein eigenes Zimmer zu haben, w\u00e4hrend die anderen in einem grossen Raum schliefen. Auf dem Balkon vor dem Schlafzimmer stand ein grosser Tisch, auf dem auch das Abendessen serviert wurde. Und dieses Abendessen \u00fcbertraf wohl alle Erwartungen. Der Koch und zwei andere Menschen kamen mit Platten voller Reis, Curry, K\u00fcrbis mit Ei, Gem\u00fcse und Wassermelone. Es war k\u00f6stlich.',
'Nach dem Einbruch der Dunkelheit z\u00fcndeten unsere Guides noch ein Feuer an. Wir fragten sie, ob es im Dschungel Thailands auch Schlangen g\u00e4be. Ja, meinten sie, aber nicht im Dorf. Die Bewohner glauben daran, dass es Geister gibt, die sie vom Dorf fernhalten.',
'Urspr\u00fcnglich war die Kultur der Karen stark mit dem Animismus verbunden, einer Religion, die nicht einen Gott verehrt, sondern davon ausgeht, dass lebendige und unlebendige Dinge einen Geist oder eine Seele besitzen. Viele der V\u00f6lker konvertierten nach der Missionierung zum Christentum, und so fanden sich in dem Dorf, das wir besuchten, eine katholische, eine baptistische und eine buddhistische Gemeinschaft. Einige Praktiken und Rituale der urspr\u00fcnglichen Kultur wurden jedoch beibehalten.',
'So gibt es beispielsweise auch in Bangkok vor vielen H\u00e4usern einen kleinen Schrein, der f\u00fcr Opfergaben an die Geisterwesen verwendet wird.',
'Einer der Guides, der besser Englisch sprach, erz\u00e4hlte uns, dass er sich das Englisch alles selbst beigebracht hat, vor allem im Kontakt mit den Touristen. In der Schule, in der er war, habe er nur Schreiben gelernt, mehr nicht. Die Touren mache er einmal in der Woche, ansonsten arbeite er mit seiner Familie auf dem Reisfeld als Farmer. Der Reis, den sie anbauen, steht dabei nicht zum Verkauf zur Verf\u00fcgung. Er dient allein der Ern\u00e4hrung des Dorfes, in dem er wohnt. Der andere Guide stellte uns im Dorf seinen zweij\u00e4hrigen Sohn vor, obwohl er selbst gerade erst 21 Jahre alt war.',
'So neigte sich der Tag dem Ende zu, und zu h\u00f6ren waren nur mehr die Ger\u00e4usche der Tiere aus dem Dschungel.',
'Am n\u00e4chsten Morgen wehte uns der Geruch von frischem R\u00fchrei in die Nase. Als das Brot ausging, brachte uns einer der Guides das Brot aus seiner eigenen Wohnung. \u201eNo problem, we eat rice\u201c, meinte er mit einem freundlichen L\u00e4cheln. Wir nahmen es nicht an, da es wohl f\u00fcr seinen kleinen Jungen bestimmt war. Trotzdem ber\u00fchrte es uns aufs Neue, wie sie trotz dem, dass sie selbst nicht viel hatten, alles f\u00fcr ihre G\u00e4ste hergeben w\u00fcrden.',
'So liessen wir kurze Zeit sp\u00e4ter das kleine D\u00f6rfchen hinter uns und liefen flussabw\u00e4rts. Nach etwa einer halben Stunde schon konnten wir ein lautes Rauschen h\u00f6ren. Ein paar H\u00f6henmeter weiter unten erwartete uns ein weiterer wundersch\u00f6ner Wasserfall, hinter den man sogar in eine kleine, k\u00fchle Halbh\u00f6hle konnte. Nach einer kurzen Pause wanderten wir im G\u00e4nsemarsch weiter. Umgeben von Sonnenschein und weiten, gr\u00fcnen Reisfeldern schlichen wir auf den schmalen Wegen entlang, bis wir vor uns pl\u00f6tzlich 25 der Karen bei der Reisernte beobachten konnten. Kurzerhand schnappte sich unser Guide ein paar der Sicheln, und bevor wir uns versahen, waren wir mitten im Geschehen und halfen mit, den Reis abzuschneiden. Wobei ich nicht sicher bin, ob sie dadurch wirklich schneller waren.',
'Flussabw\u00e4rts ging es noch etwa eineinhalb Stunden durch den dichten Dschungel. Immer wieder h\u00f6rten wir etwas rascheln und gaben die Hoffnung noch nicht auf, doch noch einen Affen zu entdecken. Langsam wurde die Gegend wieder bewohnter. Wir wanderten durch schattige Bananenplantagen, und allm\u00e4hlich zeigten sich die ersten H\u00e4user der Stadt. Dort erwartete uns auch wieder unser Taxi, und als wir uns umdrehten, bemerkten wir, dass es exakt die Stelle war, an der wir am Vortag losgelaufen waren.',
'Im klimatisierten Bus fuhren wir zu einem kleinen Restaurant, wo wir Pad Thai serviert bekamen. Die Toiletten besassen dabei, wie im kleinen Dorf, keine Sp\u00fclung, sondern eine Regentonne mit Wasser und einem Plastikbeh\u00e4lter, der diese Funktion erf\u00fcllt. Ges\u00e4ttigt von unserem gef\u00fchlt zehnten Pad Thai, das die Thais anscheinend selbst gar nicht essen, ging es zum letzten Stopp: ein f\u00fcnf Meter langes Bambusfloss, mit dem wir eine halbe Stunde lang ruhig durch den Fluss geraftet sind. Schlussendlich war die Fahrt sehr viel sanfter als erwartet, daf\u00fcr konnten wir noch einige Elefanten am Flussufer entdecken.',
'Angekommen am unteren St\u00fctzpunkt war es an der Zeit, uns von unseren Guides zu verabschieden, bevor es auf die Heimfahrt ging. Gerne h\u00e4tten wir sie so viel mehr gefragt: \u00fcber die Art, wie sie leben, was sie besch\u00e4ftigt, was sie bewegt. Doch das war wegen der sprachlichen Barriere leider gar nicht m\u00f6glich. Dennoch haben sie uns Erfahrungen geschenkt und Einblicke in eine ganz andere Welt gezeigt, die uns noch lange in Erinnerung bleiben. Es war unser Geld auf alle F\u00e4lle wert, und wir hoffen, dass davon auch ein Grossteil wirklich an unsere Guides und ihre Familien fliessen wird.'
]},
        {id:'chiangmai-oldtown', country:'Chiang Mai Old Town', date:'13. Oktober 2026', en:{country:'Chiang Mai Old Town', date:'13 October 2026', excerpt:'When the summer heat is not yet too extreme, I love exploring the city on foot.', body:['When the summer heat is not yet too extreme, the day has just begun, the city is still asleep, the traffic is slow and most lights are still dark, I love putting on my running shoes and exploring the city in a different way. So I used the morning hours to get to know the old part of Chiang Mai as well.','The largest city in the north of Thailand still has 1.2 million inhabitants in its catchment area, but feels much calmer than Bangkok. After a few minutes I reached the river, which winds in its square shape around the ruins of the old city wall. The further I went, the livelier the city became. The first stalls were already being set up, and the early risers among the tourists were already taking their first snapshots in front of the old city gate.','The city, whose name means "New City", has 200 temples and is one of the most popular destinations for digital nomads who stay there for longer. Over bumpy, sometimes suddenly non-existent pavements I suddenly found myself in a small market where there was already lively activity in the morning.','Arriving at the hotel we enjoyed our hotel breakfast again before we set off into the city together. Chiang Mai offers numerous cafés and co-working spaces, where we also spread out for a few hours to work.','In a small restaurant we tried for the first time the culinary hallmark of northern Thailand: Khao Soi. The name roughly translates as "cut rice ribbon". The curious thing is that the dish is almost exclusively prepared with egg noodles made from wheat. The name dates back to the time when the rice-flour sheets were rolled out thin and traditionally cut into strips with a knife. Since the friendly shop owner had misunderstood us, we ended up sitting there with much more food than planned. With the final sticky rice as dessert, this lunch was nevertheless, food-wise, one of the great highlights of the trip.','On the tip of Stefan\'s manager we then set off for the fish pedicure. On the roadside of a side alley stood a large aquarium stocked with countless little fish that could hardly wait to nibble at our soles. The feeling was quite ticklish, unfamiliar and strange at first. After a few minutes, though, we got used to it and could even enjoy it.','Through small alleys, past countless temples and massage offers, we explored the little town, of course barefoot so that the fresh nail polish would not be ruined, and then made our way back to the hotel. One massage later it was already time to slowly head towards the airport.']}, excerpt:'Wenn die Sommerhitze noch nicht zu extrem ist, liebe ich es, die Stadt laufend zu erkunden.', images:[{src:'images/ot-stadttor.jpg',caption:'Stadttor'},{src:'images/ot-mauer.jpg',caption:'Stadtmauer'},{src:'images/ot-fluss.jpg',caption:'Fluss'},{src:'images/ot-kanal.jpg',caption:'Fluss'},{src:'images/ot-gasse.jpg',caption:'Old Town'},{src:'images/ot-coworking.jpg',caption:'Coworking'},{src:'images/ot-essen.jpg',caption:'Tom Kha Goong'},{src:'images/ot-fisch.jpg',caption:'Fisch-Pediküre'},{src:'images/ot-fisch2.jpg',caption:'Fisch-Pediküre'},{src:'images/ot-barfuss.jpg',caption:'Barfuss'},{src:'images/ot-stupa.jpg',caption:'Tempel'},{src:'images/ot-moenche.jpg',caption:'Mönche'}], body:[
'Wenn die Sommerhitze noch nicht zu extrem ist, der Tag gerade angebrochen, die Stadt noch schl\u00e4ft, der Verkehr langsam ist und die meisten Lichter noch dunkel sind, liebe ich es, meine Laufschuhe anzuziehen und die Stadt auf eine andere Art zu erkunden. So nutzte ich die Morgenstunden, um auch den alten Teil von Chiang Mai kennenzulernen.',
'Die gr\u00f6sste Stadt im Norden Thailands hat zwar immer noch 1,2 Millionen Einwohner im Einzugsgebiet, f\u00fchlt sich aber sehr viel ruhiger an als Bangkok. Nach ein paar Minuten erreichte ich den Fluss, der sich in seiner viereckigen Form um die Ruinen der alten Stadtmauer schl\u00e4ngelt. Je weiter ich kam, desto lebendiger wurde die Stadt. Erste St\u00e4nde wurden schon aufgebaut, und die Fr\u00fchaufsteher unter den Touristen schossen ihre ersten Schnappsch\u00fcsse vor dem alten Stadttor.',
'Die Stadt, deren Name \u201eNeue Stadt\u201c bedeutet, besitzt 200 Tempel und ist eines der beliebtesten Ziele f\u00fcr digitale Nomaden, die dort l\u00e4ngere Zeit verweilen. \u00dcber holprige, teilweise pl\u00f6tzlich nicht mehr vorhandene Gehwege fand ich mich in einem kleinen Markt wieder, auf dem schon am Morgen reges Treiben herrschte.',
'Angekommen im Hotel genossen wir wieder unser Hotelfr\u00fchst\u00fcck, bevor wir uns gemeinsam in die Stadt aufmachten. Chiang Mai bietet zahlreiche Cafés und Co-Working-Spaces, wo wir uns ein paar Stunden breit machten, um zu arbeiten.',
'In einem kleinen Restaurant probierten wir erstmals das kulinarische Wahrzeichen Nordthailands: Khao Soi. Der Name bedeutet \u00fcbersetzt grob \u201egeschnittenes Reisband\u201c. Das Kuriose daran ist, dass das Gericht fast ausschliesslich mit Eiernudeln aus Weizen zubereitet wird. Der Name stammt noch aus der Zeit, als die Teigfladen aus Reis d\u00fcnn ausgerollt und traditionell mit dem Messer in Streifen geschnitten wurden. Da die sympathische Ladenbesitzerin uns falsch verstanden hatte, sassen wir schlussendlich mit sehr viel mehr Essen da als geplant. Mit dem abschliessenden Sticky Rice als Nachspeise war dieses Mittagessen essenstechnisch eines unserer grossen Highlights der Reise.',
'Auf den Tipp von Stefans Manager hin machten wir uns anschliessend auf den Weg zur Fisch-Pedik\u00fcre. Am Strassenrand einer Seitengasse stand ein grosses Aquarium, best\u00fcckt mit unz\u00e4hligen kleinen Fischen, die es kaum erwarten konnten, unsere Fusssohlen anzuknabbern. Das Gef\u00fchl war am Anfang ziemlich kitzelig, ungewohnt und komisch. Nach ein paar Minuten gew\u00f6hnten wir uns aber daran und konnten es sogar geniessen.',
'Durch kleine G\u00e4sschen, vorbei an unz\u00e4hligen Tempeln und Massageangeboten erkundeten wir das St\u00e4dtchen, nat\u00fcrlich barfuss, damit der frische Nagellack nicht zerst\u00f6rt wird, und machten uns anschliessend wieder auf den Weg zur\u00fcck ins Hotel. Eine Massage sp\u00e4ter war es schon wieder Zeit, uns langsam auf den Weg Richtung Flughafen zu machen.'
]}]},
      {id:'japan', country:'Japan', date:'15.+16. Oktober 2026', places:[{id:'tokio', country:'Tokio', date:'15.+16. Oktober 2026', excerpt:'Flughafen Tokio Narita. 40 Millionen Passagiere pro Jahr.', images:[{src:'images/jp-roboter.jpg',caption:'Narita'},{src:'images/jp-shibuya1.jpg',caption:'Shibuya'},{src:'images/jp-shibuya2.jpg',caption:'Shibuya'},{src:'images/jp-ubahn.jpg',caption:'U-Bahn'},{src:'images/jp-gyoza.jpg',caption:'Gyoza'},{src:'images/jp-takoyaki.jpg',caption:'Takoyaki'},{src:'images/jp-shibuya.mp4',caption:'Shibuya-Kreuzung',video:true}], body:['Flughafen Tokio Narita. 40 Millionen Passagiere pro Jahr. Dennoch merken wir auf unseren ersten paar Schritten in Japan vor allem eines: alles ist geordnet, alles hat Struktur, alles verl\u00e4uft reibungslos. Auf unserer eineinhalbst\u00fcndigen Zugfahrt in die Stadtmitte beobachteten wir Hunderte Menschen, keiner davon telefonierte laut oder unterhielt sich in einer unpassenden Lautst\u00e4rke. M\u00fcllk\u00fcbel sind fast nirgendwo zu finden, und die Vorgabe ist, den M\u00fcll mit sich zu nehmen \u2013 so lange, bis man einen findet, auch wenn das erst zuhause ist. Und die Einheimischen scheinen sich trotz der vielen Regeln an alle zu halten. Das umfangreiche U-Bahn-Netz gilt als eines der besten der Welt und besitzt gleich drei U-Bahn-Anbieter. Die drittgr\u00f6sste Stadt f\u00fchlt sich bei weitem nicht so chaotisch an wie Bangkok, die Regeln und die Struktur vermitteln auch eine Art Sicherheit. Nach unserer Ankunft nach Mitternacht machten wir uns erst am n\u00e4chsten Mittag auf den Weg in die Stadt.',
'Von den wuselnden Menschenmassen liessen wir uns mittragen in eine Gegend, wo es nach kleinen, gem\u00fctlichen Restaurants mit authentischem Essen aussah \u2013 und landeten in einem kleinen Sushi-Restaurant. Die W\u00e4nde waren dunkel, und auf zwei kleinen Emporen standen je zwei K\u00fcnstler vor ihrer Vitrine mit frischem Fisch. Um die Erh\u00f6hungen herum gab es schulterhohe W\u00e4nde, davor Bartische mit Sitzpl\u00e4tzen. Wir liessen uns von einem \u00e4lteren Japaner einen Platz zuweisen und setzten uns auf die Holzhocker. Mithilfe der Bildkarten bestellten wir unser erstes japanisches Sushi. Wir bekamen heissen Gr\u00fcntee und dampfende Miso-Suppe serviert und konnten von unserem Platz aus staunend zusehen, wie der Sushi-Koch-K\u00fcnstler vor unseren Augen den Reis zu passenden P\u00e4ckchen formte und kunstvoll den Fisch darauf drapierte. Etwas \u00fcberfordert von der japanischen Essensetikette genossen wir also unser Mahl und kamen langsam im neuen Land an.',
'Als es dunkel wurde, nahmen wir die U-Bahn zur ber\u00fchmten Shibuya-Kreuzung, der meistfrequentierten Fussg\u00e4ngerquerung der Welt. Pro Ampelphase queren 2.500 bis 3.000 Menschen die Kreuzung. Daneben steht eine ganz besondere Statue: Hachiko. Der Akita-Hund wartete nach dem pl\u00f6tzlichen Tod seines Besitzers, Professor Ueno, fast zehn Jahre lang jeden Tag am Bahnhof Shibuya auf ihn. Er starb 1935, ohne je aufgegeben zu haben. Die Bronzestatue erinnert an diese Treue und ist heute einer der bekanntesten Treffpunkte Tokios.',
'Das Viertel Shibuya erinnert mit den grellen Lichtern etwas an New York, auch wenn die Oktopusb\u00e4llchen und Dumplings uns wieder erinnerten, wo wir gerade waren \u2013 in einer Stadt, von der wir noch keinen Schimmer haben, was sie alles ausmacht, und die wirklich zu entdecken wahrscheinlich einige Wochen dauern w\u00fcrde.'], en:{country:'Japan', date:'15 October 2026', excerpt:'Tokyo Narita Airport. 40 million passengers a year.', body:['Tokyo Narita Airport. 40 million passengers a year. And yet, on our first few steps in Japan, we notice above all one thing: everything is orderly, everything has structure, everything runs smoothly. On our one-and-a-half-hour train ride into the city centre we watched hundreds of people, none of whom was talking loudly on the phone or conversing at an inappropriate volume. Rubbish bins are almost nowhere to be found, and the rule is to take your rubbish with you – until you find one, even if that is only at home. And the locals seem to stick to all the rules despite there being so many of them. The extensive subway network is considered one of the best in the world and has no fewer than three subway operators. The third-largest city feels nowhere near as chaotic as Bangkok; the rules and the structure also convey a kind of safety. After our arrival after midnight we only set off into the city the next midday.','We let the bustling crowds carry us into an area that looked like it had small, cosy restaurants with authentic food – and ended up in a small sushi restaurant. The walls were dark, and on two small raised platforms two artists each stood in front of their display case with fresh fish. Around the platforms there were shoulder-high walls, and in front of them bar tables with seats. We let an older Japanese man assign us a seat and sat down on the wooden stools. With the help of the picture cards we ordered our first Japanese sushi. We were served hot green tea and steaming miso soup and could watch in amazement from our seat as the sushi chef artist formed the rice into fitting packets before our eyes and artfully arranged the fish on top. Somewhat overwhelmed by the Japanese dining etiquette, we enjoyed our meal and slowly arrived in the new country.','When it got dark we took the subway to the famous Shibuya Crossing, the busiest pedestrian crossing in the world. Per traffic-light phase 2,500 to 3,000 people cross the intersection. Next to it stands a very special statue: Hachiko. The Akita dog waited at Shibuya Station every day for nearly ten years after the sudden death of his owner, Professor Ueno. He died in 1935 without ever having given up. The bronze statue commemorates this loyalty and is today one of Tokyo\'s best-known meeting points.','The Shibuya district, with its glaring lights, reminds one a little of New York, even if the octopus balls and dumplings reminded us again of where we were – in a city of which we still have no idea what makes it up, and which would probably take several weeks to really discover.']}},{id:'tokio-17', country:'Tokio', date:'17.+18. Oktober 2026', images:[{src:'images/jp2-weg.jpg',caption:'Meiji Jingu'},{src:'images/jp2-baum.jpg',caption:'Meiji Jingu'},{src:'images/jp2-schrein.jpg',caption:'Meiji Jingu'},{src:'images/jp2-waschen.jpg',caption:'Reinigung'},{src:'images/jp2-gyukatsu1.jpg',caption:'Gyukatsu'},{src:'images/jp2-gyukatsu2.jpg',caption:'Gyukatsu'},{src:'images/jp2-sky1.jpg',caption:'Sky Tree'},{src:'images/jp2-sky2.jpg',caption:'Sky Tree'},{src:'images/jp2-starbucks.jpg',caption:'Tokio'},{src:'images/jp3-kerstin.jpg',caption:'Gyukatsu'},{src:'images/jp3-gyukatsu3.jpg',caption:'Gyukatsu'},{src:'images/jp3-skytree-tag.jpg',caption:'Sky Tree'},{src:'images/jp3-skytree-nacht.jpg',caption:'Sky Tree'},{src:'images/jp3-auffuehrung.jpg',caption:'Aufführung'},{src:'images/jp3-rikscha.jpg',caption:'Rikscha'}], excerpt:'Am nächsten Vormittag zeigten sich Zentimeter für Zentimeter des neuen Stadtteiles.', body:['Am nächsten Vormittag zeigten sich Zentimeter für Zentimeter des neuen Stadtteiles, als wir schön in der Reihe der Rolltreppe standen. Links sollte man stehen – erst dachten wir, um genug Platz zu lassen, dass jene, die es eiliger hatten, vorbei huschen können. Es wäre aber nicht Japan, wenn es nicht noch eine Regel gäbe: auf der Rolltreppe ja nicht zu laufen.','Vor uns türmten sich die nächsten riesigen, glänzenden Hochhäuser auf. Hochhäuser, die bei uns wahrscheinlich als unglaublich hoch und architektonisch bewundernswert gelten würden. Dort sind sie eine Handvoll der Tausenden riesigen Gebäude, und es dauerte nicht lang, bis diese Art von Gebäuden normal wurde.','Raus aus dem Trubel der Stadt betraten wir das Tor zum Meiji-Jingu-Gyoen-Park. Die Tausenden Touristen verteilten sich gut im angelegten Park. Fleissige Arbeiter sorgten für ein perfektes Erscheinungsbild, sogar der Kies wurde mithilfe eines Besens von Blättern befreit. Nach ein paar Minuten entlang des kühlen, schattigen Weges merkten wir, wie gut es tat, wieder in der Natur zu sein. Riesige Spinnenweben mit bunten Bewohnern spannten sich über den gesamten Weg. Angekommen im Zentrum des extra angelegten Waldes zeigten sich uns die ersten Blicke auf den Meiji-Jingu-Schrein, einen Schinto-Schrein.','Schinto ist die ursprüngliche, originale Religion Japans und tief mit dem Leben dort verbunden. Der Schinto-Glaube hat keinen Gründer, kein heiliges Buch und nicht einmal das Konzept von religiösen Konversionen. Shinto steht für die Harmonie mit der Natur und Tugenden wie Magokoro, was mit ehrlichem Herz übersetzt werden kann. Shintos finden Heiligkeit in den Kamis, dem heiligen Geist, wobei dieser in unzähligen Arten und Formen vorkommt: in der Mythologie, der Natur und den Menschen. Der Schrein wurde dem Kaiser Meiji gewidmet, der von 1852 bis 1912 lebte. Als Japan seine Tore zur Welt öffnete, war er es, der die Initiative zum Knüpfen von Freundschaften mit anderen Ländern ergriff. Ausserdem fand er einen Weg, die westliche Kultur zu adaptieren, ohne die japanische Identität aufzugeben. Seine Frau Shoken unterstützte ihn dabei nicht nur, sondern setzte sich sehr für das nationale Wohl und die Frauenbildung ein. Beide drückten ihre Gedanken über Waka-Gedichte aus, die im Schrein vorliegen.','Nach ihrem Tod entstand durch Spenden von 100.000 Bäumen der Wald mit dem Schrein, der mittlerweile zu einem natürlichen Wald zusammengewachsen ist und viele heimische Pflanzen und Tiere beheimatet.','Hungrig vom vielen Laufen führte uns unser leerer Magen zu einem kleinen Restaurant mit nur neun Sitzplätzen, das genau ein Gericht auf der Karte stehen hatte: Gyukatsu. Rindfleisch mit japanischen Saucen und Beilagen, das auf dem eigenen kleinen Tischgrill auf einem heissen Stein gegrillt werden kann.','Nachdem wir herausgefunden hatten, wie die unterschiedlichen würzigen Saucen und spannenden Beilagen gedacht waren, fanden wir es sehr lecker – quasi die japanische Luxusvariante des Wiener Schnitzels.','Unser Hauptprogrammpunkt, fest eingeplant an dem Tag, war der Besuch des Sky Trees in Tokio. Sky Tree – Himmelsbaum – einen passenderen Namen hätte es für dieses Gebäude wohl kaum geben können. Mit seinen 634 Metern gilt er als der höchste freistehende Turm der Welt und Japans höchstes Gebäude. Dem Eiffelturm ähnlich wurde er so konzipiert, dass er als das erdbebensicherste Gebäude zählt. Witzig ist, dass wir am ersten Tag in Tokio eine Erdbebenwarnung auf unser Handy bekommen haben. Während uns die Meldung nicht sehr erschreckte, hätten die Reaktionen rund um uns nicht unterschiedlicher sein können. Manche Menschen hielten sich sofort an Säulen fest, und eine gewisse Panik war spürbar. Andere schien es wie uns nicht weiter zu beschäftigen. Erst ein paar Stunden später erfuhren wir, dass die Meldung eine Fehlmeldung war und die angegebene Stärke eine 9.9 war – ein Erdbeben in dieser Stärke hätten wir und viele Millionen andere in Tokio vermutlich nicht überlebt.','Innerhalb von 50 Sekunden brachte uns der Aufzug des Sky Trees vom 4. Stock auf 350 Meter, mit einem weiteren Aufzug brachten wir auch noch die restlichen Höhenmeter auf unseren höchsten Punkt auf 450 Metern.','Die Aussicht über die Metropole war sehr eindrücklich, wobei wir bei weitem nicht die Einzigen waren, die diese Idee hatten.','Nach dem Auschecken am nächsten Tag machten wir uns auf den Weg zu einem ganz besonderen Ereignis: jedes Jahr, genau zweimal jährlich, findet im Sensoji-Tempel in Asakusa der Tanz des goldenen Drachen statt. Der Tempel, der älteste in Tokio, trägt den Bergnamen Kinryuzan, Berg des goldenen Drachen. Die Legende besagt, dass einst ein goldener Drache vom Himmel herabstieg, um die Göttin der Barmherzigkeit zu schützen. Seit 1958 wird zu Ehren dieser Geschichte zweimal im Jahr ein achtzehn Meter langer, goldener Drache durch die Strassen und den Tempelhof getragen und getanzt.','Danach machten wir uns mit dem Shinkansen auf den Weg nach Osaka. Der Schnellzug, der mit bis zu 285 Kilometern pro Stunde unterwegs ist, bringt einen in etwa zweieinhalb Stunden von Tokio nach Shin-Osaka. Wir sind gespannt, was uns in der nächsten Stadt erwartet.']},{id:'osaka', country:'Osaka', date:'18.-19. Oktober 2026', excerpt:'Obwohl sich die Grossstädte in einigem sehr ähnlich sind, hat doch jede Stadt für sich ihren ganz eigenen Charme.', body:['Obwohl sich die Grossstädte in einigem sehr ähnlich sind, hat doch jede Stadt für sich ihren ganz eigenen Charme. Angekommen in Osaka, wohlbemerkt mit Zimmer im 33. Stock, beschlossen wir, doch noch eine Runde in der Stadt zu drehen. Gleich um die Ecke fanden wir ein Plätzchen an der Bar eines kleinen Restaurants. Eigentlich hätten wir den zwei jungen Betreibern einfach den ganzen Abend lang zusehen können und wären schon glücklich gewesen. Es schien, als wären wir hier in einem kleinen Paradies des Ikigai gelandet. Ikigai, übersetzt etwa Grund zu leben, bezeichnet das, was dem Leben Sinn und Freude gibt. Es muss nichts Grosses sein, oft ist es die Freude an der eigenen Arbeit, an kleinen Dingen, die den Alltag erfüllen. Die zwei Betreiber hatten während unseres gesamten Aufenthaltes ein Lächeln im Gesicht und das Essen, das sie uns servierten, war eines der besten auf unserer Reise. Vor allem die Gyozas, kleine angebratene Teigtaschen, waren köstlich.','Bei unserem kleinen Verdauungsspaziergang durch die Stadt zeigte sich uns die gesamte Palette: bunte, schrille Automaten- und Gamingläden, der beliebte Cheesecake mit ewig langer Schlange davor und dazwischen ein kleiner Laden mit einigen süssen Welpen und Kätzchen zu verkaufen. Trotz dem Trubel fühlte sich Osaka etwas ruhiger an. Wir fühlten uns wohl.','Gegründet in der Edo-Zeit, 1820, war der Kuromon-Markt, an dem wir am nächsten Morgen hinspazierten, eigentlich die Anlaufstelle für die einheimischen Köche. Mittlerweile ist er auch bei Touristen beliebt und bietet neben Streetfood vor allem frischen Fisch und Meeresfrüchte. Einer der Stände zog dabei vor allem unsere Aufmerksamkeit auf sich: fangfrischer Thunfisch, sortiert nach Fettgehalt im Fleisch, wurde schön portioniert und in einer Kühltheke präsentiert. Wir durften uns von all den Päckchen eines aussuchen, das wir dem Verkäufer reichten. Als wir uns anschliessend verständigen konnten, ob nun Sushi, Nigiri oder Sashimi, wurde der Thunfisch frisch vor unseren Augen aufgeschnitten und verarbeitet. Wir konnten dabei direkt zusehen und anschliessend geniessen. So frisches Sushi werden wir wohl so schnell nicht mehr bekommen.','Wir liessen uns anschliessend noch ein bisschen durch die Stadt treiben, unter anderem durch die drei Kilometer lange überdachte Einkaufsstrasse, und beschlossen dann, den restlichen Tag ruhig anzugehen. Die vielen Eindrücke und Schritte durch die Städte machen doch ganz schön müde. Gut, dass wir direkt im Hotel ein Onsen hatten, das wir geniessen konnten. Ein Onsen ist ein japanisches Thermalbad, das von natürlichen heissen Quellen gespeist wird. Es ist bewusst so konzipiert, dass der Körper und auch der Kopf zur Ruhe kommen können.'], images:[{src:'images/osaka-kuromon.jpg',caption:'Kuromon-Markt'},{src:'images/osaka-sushi.jpg',caption:'Thunfisch'},{src:'images/osaka-gyoza.jpg',caption:'Gyoza'},{src:'images/osaka-hamburg.jpg',caption:'Hamburgsteak'},{src:'images/osaka-broccoli.jpg',caption:'Brokkoli'},{src:'images/osaka-matcha.jpg',caption:'Matcha'},{src:'images/osaka-strasse.jpg',caption:'Osaka'},{src:'images/osaka-dotonbori.jpg',caption:'Dotonbori'},{src:'images/osaka-deckel.jpg',caption:'Kanaldeckel'}]},{id:'kyoto', country:'Kyoto', date:'20. Oktober 2026', excerpt:'Frühmorgens am nächsten Tag, als viele Lichter noch dunkel waren, stiegen wir in den Zug Richtung Kyoto ein.', body:['Frühmorgens am nächsten Tag, als viele Lichter noch dunkel waren und im Bahnhof nur die im Anzug gekleideten Businessmenschen mit ihren Aktenkoffern unterwegs waren, stiegen wir in den Zug Richtung Kyoto ein. Kyoto ist eine der geschichtlich und kulturell bedeutendsten Städte Japans.','Wir wollten unbedingt so früh wie möglich beim südlich gelegenen Fushimi-Inari-Schrein sein, um die Massen der Touristen zu vermeiden. Anfang Januar sind es täglich bis zu einer Million Touristen, die den Tempel bestaunen. Am frühen Morgen unseres Besuchs waren zwar schon andere neugierige Besucher da, aber es war noch sehr angenehm. Das Besondere am Tempel sind die roten, grossen Torii-Tore, deren Anzahl uns mächtig staunen liess. Durch mehr als zehntausend Stück kann man auf dem Gelände durchlaufen. Ruhigere Schreine weiter im Wald laden zum Verweilen ein, die Füchse mit roten Kapuzen leuchteten im mystischen Licht zwischen den moosbewachsenen Steinen, ganz abseits der Touristenmassen.','Der nächste Stopp, fest geplant in Kyoto, pünktlich zur Ladenöffnung um 11:30 Uhr war, nicht wie man glauben könnte Sushi oder Ramen, sondern Wagyu-Beef, verarbeitet zu einem saftigen Burger. Es gab sogar Handschuhe zum Essen, aus diesem Grund. Die jungen Ladenbesitzer begrüssten uns fröhlich mit ihrem japanischen Gruss, von dem wir keine Ahnung hatten, was er bedeutet, aber wir fühlten uns sehr willkommen.'], images:[{src:'images/kyoto-torii1.jpg',caption:'Fushimi Inari'},{src:'images/kyoto-torii2.jpg',caption:'Fushimi Inari'},{src:'images/kyoto-torii3.jpg',caption:'Fushimi Inari'},{src:'images/kyoto-nacht.jpg',caption:'Fushimi Inari'},{src:'images/kyoto-fuchs1.jpg',caption:'Fuchs'},{src:'images/kyoto-fuchs2.jpg',caption:'Fuchs'},{src:'images/kyoto-fuchs3.jpg',caption:'Fuchsschreine'},{src:'images/kyoto-burger.jpg',caption:'Wagyu-Burger'}]},{id:'hiroshima', country:'Hiroshima', date:'21. Oktober 2026'}]},{id:'hawaii', country:'Hawaii', date:'26. Oktober 2026', en:{country:'Hawaii', date:'26 October 2026'}},

    const places = [['8. Oktober','M\u00fcnchen \u2013 Bangkok'],['10. Oktober','Bangkok \u2013 Chiang Mai'],['13. Oktober','Chiang Mai \u2013 Bangkok'],['15. Oktober','Bangkok \u2013 Tokio'],['27. Oktober','Tokio \u2013 Honolulu'],['5. November','Honolulu \u2013 San Francisco'],['22. November','Phoenix \u2013 London'],['23. November','London \u2013 Z\u00fcrich']];
    const airports = { MUC:{lat:48.3538,lng:11.7861}, BKK:{lat:13.69,lng:100.7501}, DMK:{lat:13.9126,lng:100.6068}, CNX:{lat:18.7668,lng:98.9626}, NRT:{lat:35.772,lng:140.3929}, HNL:{lat:21.3187,lng:-157.9225}, SFO:{lat:37.6213,lng:-122.379}, PHX:{lat:33.4373,lng:-112.0078}, LHR:{lat:51.47,lng:-0.4543}, ZRH:{lat:47.4582,lng:8.5555} };
    const countries = [{name:'Deutschland',lat:50.8,lng:10.2},{name:'Thailand',lat:14.8,lng:101.8},{name:'Japan',lat:37.5,lng:138.2},{name:'USA',lat:39.5,lng:-98.3},{name:'Schweiz',lat:46.8,lng:8.2}];
    const flights = [{from:'MUC',to:'BKK',date:'2026-10-08'},{from:'DMK',to:'CNX',date:'2026-10-10'},{from:'CNX',to:'BKK',date:'2026-10-13'},{from:'BKK',to:'NRT',date:'2026-10-15'},{from:'NRT',to:'HNL',date:'2026-10-27'},{from:'HNL',to:'SFO',date:'2026-11-05'},{from:'PHX',to:'LHR',date:'2026-11-22'},{from:'LHR',to:'ZRH',date:'2026-11-23'}];
    function todayIso(){ const n=new Date(); return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0'); }
    function visible(f,t){ return f.date==='2026-10-08' || f.date<=t; }
    function arc(a,b){ const p=[]; let lng2=b.lng; if(Math.abs(lng2-a.lng)>180) lng2+=lng2>a.lng?-360:360; for(let i=0;i<=64;i++){ const t=i/64; p.push([a.lat+(b.lat-a.lat)*t+Math.sin(Math.PI*t)*2.2, a.lng+(lng2-a.lng)*t]); } return p; }
    function pin(){ return L.divIcon({className:'pin', html:'<i></i>', iconSize:[9,12], iconAnchor:[4,11]}); }
    function card(s, href, showDate){ const date = (showDate!==false && L(s,'date')) ? '<p class="kicker">'+L(s,'date')+'</p>' : ''; return '<article class="post'+(s.id==='willkommen'?' welcome':'')+'">'+date+'<h2>'+(href?'<a href="'+href+'">'+L(s,'country')+'</a>':L(s,'country'))+'</h2>'+(L(s,'excerpt')?'<p>'+L(s,'excerpt')+'</p>':'')+(href?'<a class="more" href="'+href+'">Weiterlesen</a>':'')+'</article>'; }
    function showStories(){ document.getElementById('app').innerHTML='<div class="posts">'+stories.map(s=>card(s, s.places||s.body?'#story/'+s.id:null, !s.places)).join('')+'</div>'; }
    function showCountry(id){ const s=stories.find(x=>x.id===id); if(!s||!s.places){ showStory(id); return; } document.getElementById('app').innerHTML='<article class="story"><a class="back" href="#stories">\u2190 Alle Geschichten</a><h2>'+L(s,'country')+'</h2><div class="posts">'+s.places.map(p=>card(p, L(p,'body')?'#story/'+p.id:null)).join('')+'</div></article>'; }
    function findPlace(id){ for(const s of stories){ if(s.places){ const p=s.places.find(x=>x.id===id); if(p) return {place:p, parent:s}; } if(s.id===id) return {place:s, parent:null}; } return {place:stories[0], parent:null}; }
    function openGallery(images, start){
      let i=start;
      const box=document.createElement('div'); box.className='lightbox';
      box.innerHTML='<button class="close" type="button" aria-label="Schliessen">\u00d7</button><button class="prev" type="button" aria-label="Zur\u00fcck">\u2039</button><img referrerpolicy="no-referrer" alt="Foto"><video controls playsinline style="display:none;max-width:100%;max-height:80vh"></video><p class="caption"></p><button class="next" type="button" aria-label="Weiter">\u203a</button>';
      document.body.appendChild(box);
      const img=box.querySelector('img'); const vid=box.querySelector('video'); const caption=box.querySelector('.caption');
      function show(n){ i=(n+images.length)%images.length; const item=images[i]; caption.textContent=item.caption||''; if(item.video){ img.style.display='none'; vid.style.display='block'; vid.src=item.src; vid.play(); } else { vid.pause(); vid.style.display='none'; img.style.display='block'; img.src=item.src+'?v=6'; } }
      box.querySelector('.prev').onclick=()=>show(i-1);
      box.querySelector('.next').onclick=()=>show(i+1);
      box.querySelector('.close').onclick=()=>box.remove();
      box.onclick=(e)=>{ if(e.target===box) box.remove(); };
      document.onkeydown=(e)=>{ if(e.key==='ArrowRight') show(i+1); if(e.key==='ArrowLeft') show(i-1); if(e.key==='Escape') box.remove(); };
      show(i);
    }
    function showStory(id){
      const found=findPlace(id); const s=found.place; const back=found.parent?'#story/'+found.parent.id:'#stories';
      const photos=s.images&&s.images.length?'<div class="gallery">'+s.images.map((photo,i)=>'<button type="button" data-i="'+i+'">'+(photo.video?'<video muted playsinline src="'+photo.src+'"></video>':'<img alt="'+(photo.caption||L(s,'country'))+'" referrerpolicy="no-referrer" src="'+photo.src+'?v=6">')+'</button>').join('')+'</div>':'';
      document.getElementById('app').innerHTML='<article class="story'+(s.id==='willkommen'?' welcome':'')+'"><a class="back" href="'+back+'">\u2190 Zur\u00fcck</a><p class="kicker">'+L(s,'date')+'</p><h2>'+L(s,'country')+'</h2>'+(s.body||[]).map(p=>'<p>'+p+'</p>').join('')+photos+(s.quote?'<blockquote>\u201e'+s.quote+'\u201c <span class="meta">\u2014 '+s.quoteBy+'</span></blockquote>':'')+'</article>';
      document.querySelectorAll('.gallery button').forEach(btn=>btn.onclick=()=>openGallery(s.images, Number(btn.dataset.i)));
    }
    function showAtlas(){
      const today=todayIso();
      document.getElementById('app').innerHTML='<div class="section-head"><h2>Atlas</h2></div><div id="worldMap"></div><div class="places">'+places.map(p=>'<div class="place"><strong>'+p[0]+'</strong><span>'+p[1]+'</span></div>').join('')+'</div>';
      const map=L.map('worldMap',{worldCopyJump:true}).setView([28,15],2);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'\u00a9 OpenStreetMap',maxZoom:8}).addTo(map);
      countries.forEach(c=> L.marker([c.lat,c.lng],{interactive:false,opacity:0}).bindTooltip(c.name,{permanent:true,direction:'center',className:'country-label'}).addTo(map));
      Object.keys(airports).forEach(code=>{ if(code==='DMK') return; L.marker([airports[code].lat,airports[code].lng],{icon:pin()}).addTo(map); });
      flights.filter(f=>visible(f,today)).forEach(f=> L.polyline(arc(airports[f.from],airports[f.to]),{color:'#9a5344',weight:1.1,opacity:.8,dashArray:'1.5 7',lineCap:'round'}).addTo(map));
      setTimeout(()=>map.invalidateSize(),200);
    }
    function showAbout(){ const about = lang==='en' ? 'Join us on our journey once around the world. From the urban jungle of Bangkok through the unknown cultures of Japan and the historic treasures of Hawaii to the vastness of the USA, and everything we encounter in between.' : 'Begleite uns auf unserer Reise einmal um die Welt. Vom Gro\u00dfstadtdschungel Bangkok \u00fcber die unbekannten Kulturen Japans und die historischen Kultursch\u00e4tze Hawaiis bis in die Weiten der USA, und zu allem, was uns dazwischen begegnet.'; document.getElementById('app').innerHTML='<section class="about-copy"><div><h2>Kerstin & Stefan</h2><p>'+about+'</p></div><img alt="Kerstin und Stefan" src="images/kerstin-stefan.jpg"></section>'; }
    function go(){ const hash=location.hash||'#stories'; if(hash==='#atlas') showAtlas(); else if(hash==='#about') showAbout(); else if(hash.startsWith('#story/')){ const id=hash.slice(7); const s=stories.find(x=>x.id===id); if(s&&s.places) showCountry(id); else showStory(id); } else showStories(); }
    document.querySelectorAll('.lang').forEach(b=>{ b.classList.toggle('active', b.dataset.lang===lang); b.addEventListener('click', ()=>{ lang=b.dataset.lang; localStorage.setItem('waymarks-lang', lang); document.querySelectorAll('.lang').forEach(x=>x.classList.toggle('active', x.dataset.lang===lang)); go(); }); });
    window.addEventListener('hashchange', go); go();
  </script>
