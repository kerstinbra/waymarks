lden die Kante eines 300 Meter hohen Abgrunds, der wie eine Startrampe für extreme Winde wirkt. Hawaiis Landschaft beeindruckt uns an diesem Tag schon zum zweiten Mal zutiefst.","Nach dem Zurückgeben des Autos wollten wir eigentlich nur kurz in der Surfschule nachfragen, wann am Abend noch Stunden frei wären. Ganz in hawaiianischer Manier schlagen sie vor, einfach gleich zu bleiben und die Chance zu nutzen. Wir lassen uns von ihrem Enthusiasmus mitreissen und liegen schon ein paar Minuten später paddelnd auf den Brettern im Meer. Voller Freude und Stolz über unseren besseren Fortschritt als erwartet machen wir uns müde zurück ins Hotelzimmer und tun nicht mehr viel – bis uns am Abend noch ein wundervoller Sonnenuntergang am Strand und als Krönung ein Feuerwerk am anderen Ende des Waikiki-Strandes erwartet."],images:[{src:'images/honolulu30-aussicht1.jpg',caption:'Diamond Head'},{src:'images/honolulu30-aussicht2.jpg',caption:'Diamond Head'},{src:'images/honolulu30-paar2.jpg',caption:'Diamond Head'},{src:'images/honolulu30-stadt.jpg',caption:'Aussicht auf Honolulu'},{src:'images/honolulu30-weg.jpg',caption:'Zum Aussichtspunkt'},{src:'images/honolulu30-strasse.jpg',caption:'Auf dem Weg'},{src:'images/honolulu30-kerstin.jpg',caption:'Ostküste'},{src:'images/honolulu30-waikiki.jpg',caption:'Waikiki'},{src:'images/honolulu30-sonnenuntergang.jpg',caption:'Sonnenuntergang'},{src:'images/honolulu30-nacht.jpg',caption:'Waikiki bei Nacht'},{src:'images/honolulu30-paar1.jpg',caption:'Happy Faces nach dem Surfen'}]},{id:'maui',country:'Maui',date:'31. Oktober – 1. November 2026',excerpt:'Nach nur 21 Minuten in der Luft erreichen wir die südlich gelegene Insel Maui.',body:["Nach nur 21 Minuten in der Luft erreichen wir die südlich gelegene Insel Maui. Die zweitgrösste Insel Hawaiis besteht quasi aus zwei riesigen Vulkanen und einem Tal in der Mitte, weswegen sie auch „the valley island“ (die Tal-Insel) genannt wird. Der im Osten liegende Haleakalā-Vulkan hat einen Kraterdurchmesser, in den ganz Manhattan passen würde, und macht rund 75 Prozent der ganzen Insel aus. Auf der ganzen Insel leben 160.000 Menschen, die sich den Platz aber täglich mit 40.000 Touristen teilen – im Vergleich dazu scheint allein die Stadt Honolulu mit ihren 360.000 Einwohnern sehr viel lebendiger.","Als wir langsam unsere ersten Schritte auf der noch fremden Insel machten, sahen wir davon noch nicht sehr viel. Die meisten der Wolken, die über den Pazifik ziehen, bleiben an den Gipfeln hängen, was dafür sorgte, dass wir ausser dem Tal und dem Meer noch keine Idee hatten, was sich darunter verbergen soll. Da es noch etwas zu früh war, im Airbnb einzuchecken, fuhren wir am Strand Richtung Westen. Nur 15 Minuten entfernt, gleich hinter der gemütlichen, einladenden Stadt Paia, befand sich der Hookipa Beach Park. Obwohl es spannend war, den Surfern, Windsurfern und Kitesurfern zuzusehen, hofften wir hier etwas anderes beobachten zu können. Ganz im hinteren Teil des Strandes, geschützt durch ein Absperrband, fanden wir etwa 40 Meeresschildkröten in unterschiedlichen Grössen, die sich genüsslich in der Nachmittagssonne ausruhten. Den Tieren in ihrer reptilartigen Haut mit den robusten Panzern und ihrer langsamen, ruhigen Art zuzusehen war sehr faszinierend.","Am nächsten Morgen entschieden wir uns dafür, den westlichen Teil der Insel zu erkunden. Schon bald stellten wir fest, dass der „Highway“ auf Maui eine ganz andere Bedeutung hat, als wir uns das vorgestellt haben. Durch enge Kurven, oft nur einspurig, schlängeln sich die Strassen um die Insel. Im Vergleich zu Oahu ist die Gegend sehr wenig besiedelt und bis auf ein paar Häuschen und einem „Dorf“ mit etwa 10 Häusern liefen wir dort kaum einer Menschenseele über den Weg (bis auf die anderen Touristen, die sich in das abenteuerliche Vergnügen stürzten). Einen kurzen Stopp legten wir beim Nakalele Blowhole ein – ein Naturwunder der Nordwestküste Mauis. Durch Meereserosion entstand ein Loch in der Lavabank, durch das bei starkem Wellengang geysirtartige Fontänen mit bis zu 30 Metern in die Höhe schiessen. Das Spektakel anzusehen war wirklich eindrücklich – auch wenn wir es aus der Ferne beobachteten, um nicht 20 Dollar für das kurze Parken zu zahlen.","Weiter im Westen der Insel befindet sich Lahaina – eine Stadt mit tiefer, bewegender Geschichte. Früher, im 19. Jahrhundert, zählte Lahaina als die erste königliche Hauptstadt Hawaiis und galt für die Ureinwohner der Insel als heilige Stätte. Die Stadt war in den letzten Jahren zu einer lebendigen, bunten Mischung aus heimeligen Holzhäusern aus dem 19. Jahrhundert, Kunstausstellungen, Restaurants, historischen Stätten und der malerischen Front Street geworden. Bis zum 8. August 2023. Ein immenser Brand, ausgelöst durch umfallende Strommasten und in kürzester Zeit entfacht und verbreitet durch den vorbeiziehenden Hurricane Dora, breitete sich über die Stadt aus und hinterliess immense Verluste. 102 Menschen verloren im tödlichsten Wildfeuer des letzten Jahrhunderts ihr Leben. Für die Ureinwohner galt das Feuer als mehr als ein materieller Verlust. Das Feuer riss ihr spirituelles Herz der Insel mit all ihren Dokumenten in den Museen und einen grossen Teil der hawaiianischen Identität in den Abgrund.","Als wir durch die damals so lebendige Stadt fuhren, sahen wir enorm viele Baustellen – die Aufräumarbeiten und das Entsorgen giftiger Abfälle dauerten durch das US-Militär und die Katastrophenhilfe bis Anfang 2025, die Stadt hat sich lange noch nicht erholt. Obwohl das Wohngebiet langsam wächst, ist von der Front Street aufgrund von komplizierten Genehmigungsverfahren noch nichts zu sehen.","Nach unserem Stopp für den Sonnenuntergang in Kihei, den wir wie die Einheimischen von einem Grashügel aus beobachteten, machten wir es uns bei einem „authentic Mexican food“-Restaurant gemütlich. Auf dem Menü standen neben vielzähligen anderen Varianten der Teigfladen Tacos – einer der grossen Vorteile, wenn man in den USA und somit in Mexiko-Nähe reist. Ohne viele Erwartungen waren wir überrascht, wie lecker es war – und zu den Nachos mit Salsa aufs Haus sagten wir nach diesem abenteuerlichen Tag auch nicht nein."],images:[{src:'images/maui-pferd1.jpg',caption:'Pferd'},{src:'images/maui-pferd2.jpg',caption:'Pferd'},{src:'images/maui-klippe.jpg',caption:'Nordküste'},{src:'images/maui-weg.jpg',caption:'Nordküste'},{src:'images/maui-regenbogen1.jpg',caption:'Regenbogen'},{src:'images/maui-regenbogen2.jpg',caption:'Regenbogen'},{src:'images/maui-sonnenuntergang.jpg',caption:'Sonnenuntergang'},{src:'images/maui-nebel.jpg',caption:'Nebel'}]},{id:'road-to-hana',country:'Maui – Road to Hana',date:'2. November 2026',excerpt:'Die Road to Hana gilt als eine der bekanntesten und atemberaubendsten Panoramaküstenstrassen der Welt.',body:["Die Road to Hana gilt als eine der bekanntesten und atemberaubendsten Panoramaküstenstrassen der Welt. Auf 103 Kilometern windet sie sich durch 620 Haarnadelkurven und über 59 Brücken, von denen 46 einspurig sind, und verbindet das traditionelle Dörfchen Hana mit dem Rest der Insel. Hana gilt als einer der letzten Orte des alten, „echten“ Hawaiis. Ganz ohne Ampeln, Fast-Food-Ketten oder Hotelkomplexe leben dort noch viele Natives, viele noch in traditioneller Weise. Dadurch dass es so lange vom Rest der Insel abgeschottet war, sind sie der Verwestlichung weitgehend aus dem Weg gegangen und legen grossen Wert darauf, ihre Gemeinschaft zu pflegen und die hawaiianische Sprache an nächste Generationen weiterzugeben. Gegen einen Ausbau oder eine Verbreiterung der Strasse nach Hana haben sie sich die letzten Jahrzehnte gewehrt.","Früh morgens starteten wir also im Surferstädtchen Paia, der Tank war vollgetankt, der Kaffee heiss dampfend im Getränkeständer platziert. Gleich am Anfang stand ein Schild, dass die Strasse „ahead“ gesperrt sei, woraufhin wir dachten, unser Abenteuer habe ein schnelles Ende gefunden. Wir entschieden uns, trotzdem weiterzufahren, bis ein endgültiges Fahrverbotsschild uns den Weg blockieren würde – was gottseidank nicht der Fall war. Die nächsten Stunden waren ein Aneinanderreihen von Staunen, Überraschung und Faszination. Da es in den letzten Tagen und Wochen sehr viel geregnet hat, waren die Strassen oft kleine Bäche. Unzählige Wasserfälle, Aussichtspunkte, Brücklein und Pflanzenarten reihten sich aneinander und es schien kein Ende zu nehmen. Da es auf der Strasse grossteils keinen Empfang gab, entschieden wir uns für einen Audio-Guide, was eine tolle Idee war. Neben den wichtigsten Stopps unterhielt uns der hawaiianische Guide mit spannenden Fakten, Geschichten und Liedern auf dem ganzen Weg. Einige der Zwischenstopps, die uns besonders gefallen haben, waren dabei folgende:","Rainbow Trees. Schon als wir am Anfang der Hana Road waren, türmten sich die besonderen Eukalyptusbäume neben uns auf. Etwas später hatten wir die Chance, in einem kleinen Park einen ganz genauen Blick auf die Riesen zu werfen. Die Eukalyptusbäume werden aufgrund ihrer Rinde Regenbogenbäume genannt. Nach dem Schälen der Rinde, das der Baum immer wieder durchläuft, verfärben sich die Stellen in unterschiedlichsten Farben und sehen aus, als hätte jemand mit dem Pinsel nachgeholfen. Heimisch sind die Bäume in Hawaii eigentlich nicht, 1930 wurden eine Million der Bäume importiert und gepflanzt. Ursprünglich war die Idee, somit der Bodenerosion entgegenzuwirken, leider stellte sich das Holz später aber als vollkommen ungeeignet als Bauholz heraus. Schön anzusehen sind sie auf alle Fälle.","Lava Caves. Den Stopp bei den Lavahöhlen verpassten wir beim ersten Vorbeifahren, weil er so unscheinbar war. Kein Schild beschriftete den Punkt der Route, kein Auto stand in der kleinen Ausbuchtung der Strasse. Ohne genaue Weganweisungen fanden wir schlussendlich einen Eingang zu einer Lavahöhle. Im Gegensatz zu anderen Höhlen entstand diese Höhle in einer extrem kurzen Zeit. Während eines Vulkanausbruchs des Haleakalā-Vulkans trocknete die herabfliessende Lava auf der Aussenseite bereits aus, während sich im Inneren noch eine Höhle bildete, die auch heute noch zu sehen ist. Wir waren sehr überrascht, wie weit es in die Höhle ging und wie wunderschön sie an der Decke glitzerte. Auch wenn das Gefühl etwas komisch war, so tief in die Höhle zu gehen, nicht wissend, was hinter der nächsten Ecke wohl so lauerte, waren wir sehr froh, diesen Zwischenstopp eingelegt zu haben – ein wirkliches Highlight ganz abseits der anderen Touristen auf diesem Weg. Aufgrund des Wetters und den Warnungen an der Strasse waren aber bis auf den nächsten Stopp ;-) kaum Touristen unterwegs – im Vergleich zu anderen Tagen hatten wir wohl wirklich Glück.","Auntie Anne’s Banana Bread. Zufällig ganz pünktlich um 08:30 Uhr bogen wir eine Strasse Richtung Strand ab und sahen das einzige Mal an diesem Tag eine Menschenschlange an einem Stand stehen. Die Türen öffneten sich und uns strömte schon der Geruch von frisch gebackenen Köstlichkeiten entgegen. Wir beschlossen uns der Reihe anzuschliessen und hielten schon wenige Minuten später das Bananenbrot des bekanntesten Standes auf dem Weg in der Hand. In der Hochsaison schliesst der Stand oft schon um Mittag, weil sie ausverkauft sind. Wie viele Brote dabei verkauft werden gilt als Betriebsgeheimnis, pro Woche werden aber ca. 900 kg Bananen verbacken – und das seit 30 Jahren. Der Hype um das Bananenbrot verspricht allerdings nicht zu viel, einen besseren „Znüne“-Snack als das unglaublich gut riechende, noch warme und richtig gut schmeckende Bananenbrot hätten wir uns nicht vorstellen können.","Pipiwai Trail. Unser letzter Stopp des heutigen Tages, bevor wir uns wieder retour Richtung Inselmitte aufmachten, war der Haleakalā-Nationalpark 16 Kilometer weiter südlich von Hana. Viele Naturliebhaber reisen den ganzen Weg der Hana-Route hinunter, nur um diesen Teil des Nationalparks zu sehen und den Pipiwai Trail entlang zu wandern. Der Pipiwai Trail war auch auf unserer Liste und war rückblickend einer der schönsten Trails, die wir je entlanggegangen sind.","Ein Highlight folgte dem anderen und innerhalb weniger Minuten änderte sich die Umgebung, es fühlte sich an, als würde man von einem Hollywood-Film in den nächsten stolpern, nur schöner. Unter anderem findet sich dort ein 200 Jahre alter Banyan-Baum, der durch seine Luftwurzeln nicht nur in die Höhe, sondern auch immer mehr in die Breite wächst.","Weiter oben im Trail wechseln die „klassischen“ Bäume zu riesigen Bambuswäldern. Da der Bambus so hoch und dicht wächst, ist das Tageslicht teilweise gar nicht mehr so gut sichtbar und der Wald scheint in einem mystischen, smaragdgrünen Licht. Neben dem visuellen Erlebnis hat uns auch ein akustisches Wunder in den Bann gezogen. Wenn der Wind des Pazifiks durch die Bambusstangen bläst, schlagen diese aneinander und es entsteht ein unverkennbares Klacken und Summen in der Höhe. Wurzelschützende Pfade schlängeln sich durch den Wald und ganz oben angekommen zeigt sich das Finale des ganzen Tages: der Waimoku-Wasserfall („Wasser, das das Land zerschneidet“).","Als Hinweis auf die extreme Naturkraft des Wasserfalls stehen am Wegesrand immer wieder Hinweistafeln, die auf die Gefahren der Kraft aufmerksam machen, „die kein Mitgefühl hat“. An einer halbrunden Felswand zeigt sich der 122 Meter hohe Wasserfall wie auf einer Bühne im Amphitheater – daneben fliessen ebenfalls eindrückliche 4–5 weitere Wasserfälle hinunter.","Nach unserem Mittagssandwich mit einer wirklich schwer zu toppenden Aussicht machten wir uns auf den Weg zurück, erst zum Auto und anschliessend auch zurück zu unserer Wohnung, vorbei an den kleinen alten Brücken und durch dieselben schmalen Kurven, jedoch beschenkt mit unglaublich schönen Erfahrungen an diesem Tag."],images:[{src:'images/hana-strasse.jpg',caption:'Road to Hana'},{src:'images/hana-rainbowtree1.jpg',caption:'Rainbow Tree'},{src:'images/hana-rainbowtree2.jpg',caption:'Rainbow Tree'},{src:'images/hana-hoehle1.jpg',caption:'Lava Cave'},{src:'images/hana-kerstin-hoehle.jpg',caption:'Lava Cave'},{src:'images/hana-wurzeln.jpg',caption:'Lava Cave'},{src:'images/hana-bananenbrot.jpg',caption:'Aunty Sandy\'s Banana Bread'},{src:'images/hana-banyan.jpg',caption:'Banyan Tree'},{src:'images/hana-bruecke.jpg',caption:'Pipiwai Trail'},{src:'images/hana-bambus-neu.jpg',caption:'Bambuswald'},{src:'images/hana-stefan-bruecke.jpg',caption:'Pipiwai Trail'},{src:'images/hana-stefan-weg-neu.jpg',caption:'Pipiwai Trail'},{src:'images/hana-blatt.jpg',caption:'Pipiwai Trail'},{src:'images/hana-wasserfall1.jpg',caption:'Wasserfall'},{src:'images/hana-strand.jpg',caption:'Schwarzer Strand'},{src:'images/hana-schildkroete.jpg',caption:'Schildkröte'},{src:'images/hana-essen.jpg',caption:'Essen'},{src:'images/hana-waimoku.jpg',caption:'Waimoku Falls'}]},{id:'haleakala',country:'Maui – Haleakalā',date:'3. November 2026',excerpt:'Am Morgen begrüsste uns anstatt des öfter vorkommenden Regens der Sonnenschein.',body:["Am Morgen begrüsste uns anstatt des öfter vorkommenden Regens der Sonnenschein, und das erste Mal in unserem Maui-Aufenthalt konnten wir die zwei Vulkangipfel teilweise sehen, die sich davor immer unter dichten Regenwolken versteckten.","Nachdem wir die Küstenregion des Nationalparks schon am Vortag erkundet hatten (Pipiwai Trail), war es an diesem Tag an der Reihe, die zweite Welt des Parks zu entdecken. Von der gegensätzlichen Richtung aus machten wir uns auf die eineinhalbstündige Autofahrt 3055 Meter in die Höhe – mit einem kurzen Zwischenstopp für thailändisches Streetfood ging es über steile Serpentinen immer näher an den höchstgelegenen Punkt des mächtigen Vulkans. Würde man die Höhe vom Meeresgrund (Basis) zum Gipfel messen, wäre der Vulkan nach seinen „Artgenossen“ Mauna Kea und Mauna Loa der dritthöchste Berg der Welt.","Auf unserem Weg nach oben sahen wir immer wieder Schilder mit „Achtung – Nēnē wohnt hier“. Die Nēnē, die schwer vom Aussterben bedrohte Gansart, spazierte fröhlich hier und da über die Strasse. Immer wieder wehten Wolken an uns vorbei, bis wir am Ende die Wolkengrenze durchschritten und bei strahlendem Sonnenschein unser Ziel erreichten. Oben angekommen ging es schon wieder nach unten. Dem Sliding Sands Trail liefen wir in den Krater des Vulkans, wo uns eindrückliche Farbspiele unterschiedlicher Sande empfingen. Durch den Krater verlaufen 47 Kilometer Wanderwege, sogar zwei kleine Hütten gibt es, in denen eine Übernachtung möglich ist. Die absolute Stille faszinierte uns – ausser einem kleinen Windhauch hier und da war absolut nichts zu hören. Ohropax hätten an diesem Ort wohl kein gutes Geschäft zu machen.","Obwohl die Landschaft zum Weiterwandern einlud, machten wir uns langsam auf den steilen Rückweg durch die Vulkanlandschaft. Oben angekommen färbte sich die gesamte Umgebung jede Minute noch intensiver in das wunderschöne Licht der Dämmerung. Angelehnt an das rote Vulkangestein beobachteten wir das unglaubliche Naturspektakel der untergehenden Sonne. Weit über dem Wolkenmeer verwandelte sich der Aschekegel in eine strahlende Marslandschaft. Auch Mark Twain besuchte einst diesen Ort und beschrieb das Spektakel mit folgenden Worten: „Das erhabenste Spektakel, das ich je erlebt habe, und ich glaube, die Erinnerung daran wird für immer bei mir bleiben.“"],images:[{src:'images/haleakala-trail.jpg',caption:'Sliding Sands Trail'},{src:'images/haleakala-crater.jpg',caption:'Krater Haleakalā'},{src:'images/haleakala-selfie.jpg',caption:'Auf dem Gipfel'},{src:'images/haleakala-sunset.jpg',caption:'Sonnenuntergang'},{src:'images/haleakala-summit-night.jpg',caption:'Summit bei Dämmerung'},{src:'images/haleakala-kerstin.jpg',caption:'Im Krater'},{src:'images/haleakala-couple.jpg',caption:'Am Summit'}]},{id:'oahu-4-5',country:'Oahu',date:'4.–5. November 2026',excerpt:'Erst ein paar Tage zuvor machten wir unsere ersten neugierigen Schritte auf Maui.',body:["Erst ein paar Tage zuvor machten wir unsere ersten neugierigen Schritte auf Maui. Zugegebenermassen war es für uns keine Liebe auf den ersten Blick wie bei Oahu. Mit jedem weiteren Tag aber gewährte uns Maui einen weiteren Blick in die Schönheit und Vielfalt der Insel und unzählige Momente des Staunens. Die wilden Dschungel, unglaublichen Höhen, wunderschönen Wasserfälle und so viel mehr hinterliessen Dankbarkeit, dass wir uns doch für diese Insel entschieden haben.","Nun war es Zeit, wieder zurück zum Flughafen zu fahren, und schon etwas später landeten wir wieder auf der nördlichen Insel Oahu. Während Stefan noch einmal zum Memorial der USS Arizona fuhr, um das Schiffswrack bei klarem Wasser anzusehen, machte sich Kerstin erneut auf in die Mitte des Waikiki-Strandes, in der Hoffnung, noch ein paar Wellen reiten zu können. Während der klare und somit ruhige See definitiv Vorteile beim Anblick der Gedenkstätte hatte, traute Kerstin kaum ihren Augen – die Wellen, die ein paar Tage vorher so optimal zum Surfen waren, waren an diesem Nachmittag schlichtweg einfach nicht da. Ein paar Surfer sassen draussen auf ihren Brettern in der Hoffnung, es noch verwenden zu können. Wir gaben diese Hoffnung jedoch auf und genossen unseren letzten Abend in Hawaii.","Der letzte Morgen auf der hawaiianischen Insel begann ganz früh im tiefen Blau des Pazifiks. Mit einem Boot von Island Splash Tours fuhren wir hinaus zum Turtle Canyon, einem Riff mitten im offenen Meer vor Waikiki – ausgestattet mit Schnorcheln und Flossen. Obwohl die Anbieter eine Schildkröten-Garantie für ihre Touren ausschreiben, waren wir von unserem anschliessenden Erlebnis total begeistert. Nach einem Sprung ins kühle Nass führte uns unser Guide zu einem bestimmten Platz. Und dort lagen sie – zehn Schildkröten am Meeresgrund, die sich an diesem Ort platzieren, um von den Putzerfischen gereinigt zu werden. Immer wieder schüttelte sich eine der Schildkröten, bevor sie in kompletter Tiefenentspannung und Eleganz knapp an uns vorbeischwamm, um an der Oberfläche Luft zu holen. Die Tiere so hautnah beobachten zu können, übertraf unsere Erwartungen. Womit wir aber noch weniger gerechnet hätten, war die unglaublich schillernde, bunte Unterwasserwelt, die sich sonst noch zeigte. Unterschiedlichste Fische in ihren Schwärmen schlängelten sich durch die Korallen. Wir waren unter anderem sehr froh, so respektvolle Anbieter gefunden zu haben, da die anderen Gruppenleiter vom Anlocken der Fische bis hin zum Jagen der Schildkröten (was gegen die Schutzmassnahmen und auch gegen den Respekt gegenüber den Tieren verstösst) alle Mittel einsetzten, um den Teilnehmern eine „gute“ Erfahrung zu ermöglichen.","Ganz beseelt von diesem Erlebnis ging es für uns (leider) Richtung Flughafen und ab ans andere Ende des Pazifiks. Nächster Stopp – San Francisco. Und vielen Dank, Hawaii, es war uns eine Ehre."],images:[{src:'images/oahu-last-water.jpg',caption:'Klares Wasser – USS Arizona'},{src:'images/oahu-last-drink.jpg',caption:'Letzter Drink'},{src:'images/oahu-last-rainbow.jpg',caption:'Regenbogen in Waikiki'},{src:'images/oahu-last-sunset.jpg',caption:'Sonnenuntergang Marina'},{src:'images/oahu-last-beach.mp4',caption:'Waikiki Beach',video:true}]}],en:{country:'Hawaii',date:'27 October 2026'}},{id:'usa',country:'USA',date:'5. November 2026',en:{country:'USA',date:'5 November 2026'},places:[{id:'sf-monterey',country:'San Francisco – Monterey',date:'05.–06. November 2026',excerpt:'Als Kind träumte ich davon, eines Tages die Golden Gate Bridge mit eigenen Augen zu sehen.',body:["Als Kind und Jugendliche war die USA für mich, Kerstin, so weit weg und schien unerreichbar. Als meine Gota damals von ihren Erlebnissen von ihrem Roadtrip durch die Weiten der USA erzählte und mir die beeindruckenden Fotos zeigte, träumte ich davon, wie es wohl wäre, eines Tages mit eigenen Augen die Golden Gate Bridge zu sehen. Einige Jahre später dachte ich an diese Erinnerungen zurück – mit Blick auf die Golden Gate Bridge in San Francisco. Aufgrund der starken Strömungen, des tiefen Wassers und dem heftigen Wind galt sie als „unmöglich“ zu bauen – bis zu ihrer Fertigstellung im Jahr 1937. Somit steht die Brücke wohl nicht nur für das Wahrzeichen von San Francisco, sondern auch den amerikanischen Traum – das Land, in dem alles möglich ist.","Und um zu erfahren, was diese Möglichkeiten alles umfasste, war unser kleiner Roadtrip der nächsten Tage wohl eine sehr gute Möglichkeit.","Erstaunlich war zunächst schon einmal, wie es möglich war, auf einem Land, das von steilen Hügeln übersät ist, eine Millionenstadt zu bauen. Die Straßen waren so steil, dass fast schon Angst hochkam, rückwärts bergab zu purzeln oder zumindest am Ende der Straße mit dem Interbau des Autos aufzusitzen. Doch keine Befürchtung wurde wahr und die Hügel boten uns wunderschöne Ausblicke und gratis Anhöhen, um super auf die Sehenswürdigkeiten der Stadt zu blicken. Eine davon ist der Pier 39. Die zweistöckige, auf Holzpfählen erbaute Pieranlage umfasst neben Jahrmarktfeeling maritime Restaurants (wie das Baba Gam, das Lieblingslokal von Forrest Gump) und zweifach besondere Aussichten. Während sich direkt vor dem Pier hunderte von grölenden Seerobben aneinanderkuscheln und sonnen, erblickt man weiter draußen das berühmte Inselgefängnis Alcatraz. Leider war dieses wegen Umbauarbeiten geschlossen und wir konnten nicht von nächster Nähe sehen, wo die Schwerstverbrecher wie der berühmte Al Capone viele Stunden absassen.","Nach einer kleinen Wanderung, die uns noch einmal ganz besondere Perspektiven auf die Golden Gate Bridge gaben, war es Zeit, weiter in den Süden zu fahren. Nach einigen Autominuten erreichten wir das kleine Küstenstädtchen Monterey, das im charmanten Stil eine gemütliche Atmosphäre ausstrahlte."],images:[{src:'images/sf-golden-gate.jpg',caption:'Golden Gate Bridge'},{src:'images/sf-street-bubbles.jpg',caption:'Jones Street'},{src:'images/sf-forrest-bench.jpg',caption:'Forrest Gump Bank'},{src:'images/sf-bubba-exterior.jpg',caption:'Bubba Gump Shrimp Co.'},{src:'images/sf-bubba-interior.jpg',caption:'Bubba Gump Innen'},{src:'images/sf-steep-street.jpg',caption:'Steile Straße'},{src:'images/sf-pier39-seals.jpg',caption:'Pier 39 – Seelöwen'},{src:'images/sf-trail.jpg',caption:'Wanderung'},{src:'images/sf-golden-gate-trees.jpg',caption:'Golden Gate durch die Bäume'},{src:'images/sf-beach-cliff.jpg',caption:'Küste'},{src:'images/sf-sunset.jpg',caption:'Sonnenuntergang'}]},{id:'monterey-calabasas',country:'Monterey – Calabasas',date:'06.–07. November 2026',excerpt:'Carmel by the Sea – eine wunderschöne Stadt mit bitterem Beigeschmack.',body:["Nach einem guten Kaffee konnte unser Tag starten und wir fuhren weiter in die Stadt Carmel by the Sea. Schon nach den ersten Metern fiel uns auf, dass dieses Städtchen einen ganz anderen Eindruck vermittelte. Später erfuhren wir, dass die Stadt eine der faszinierendsten und ungewöhnlichsten Stadtgeschichten Kaliforniens hat. Die Entstehung des Ortes geht nicht wie viele andere auf die Industrialisierung zurück, sondern auf die Idee von zwei Männern im Jahre 1902. Ihre Vision war es, einen Zufluchtsort für Menschen zu erschaffen, die sich der Kunst, Literatur und Natur verschrieben hatten. Durch das Erdbeben 1906 in San Francisco verstärkt, entwickelte sich in kurzer Zeit eine Künstlerstadt und damit eine der bedeutendsten Künstler- und Intellektuellenkolonien der amerikanischen Westküste. Die Gemeinschaft war extrem politisch, wenn es darum ging, den kommerziellen Fortschritt aus ihrem Paradies fernzuhalten – so gibt es auch heute immer noch keine Hausnummern, sondern Hausnamen, die Post wird im zentralen Postamt abgeholt.","Als wir durch das ehemalige ideologisch geprägte Städtchen liefen, bemerkten wir aber auch einen bitteren Beigeschmack. Der Denkmalschutz und die extremen Regulierungen machten die Gebäude rar – und somit vor allem bei Reichen, denen das wunderschöne abgelegene Örtchen sehr gelegen kam, extrem beliebt. Die Immobilienpreise schossen in die Höhe, was zur Folge hatte, dass von den anfangs ärmlichen, idealistischen Künstlerinnen, die den Ort gründeten, immer weniger überleben konnten. Obwohl die Optik der damaligen Künstlerenklave immer noch den Häuschen der 1930er Jahre gleicht, ist der Ort heute ein perfekt inszeniertes, museales Refugium für die Oberschicht. Während in den Anfangsjahren Grundstücke zu 100 Dollar Anzahlung vergeben wurden, liegt der Durchschnittspreis der Immobilien heute bei 2,5–3 Millionen Euro – 75 % der Häuser stehen großteils leer, weil sie nur als Zweitwohnsitz genutzt werden. Hotelangestellte und Arbeitende der Stadt müssen auf Nebenörtchen zum Wohnen ausweichen, da sie sich die Lebenshaltungskosten in Carmel nicht leisten können.","Eine wunderschöne Stadt – doch der bittere Beigeschmack ließ es für uns nur zu einem kurzen Aufenthalt werden.","Die klassischen amerikanischen Übernachtungsmöglichkeiten begleiteten uns die nächsten Tage und standen – insofern wir nicht gerade in der Wüste mit keiner Menschenseele in der Nähe fuhren – in jeder dritten Kreuzung."]}]}];
    const places = [['8. Oktober','M\u00fcnchen \u2013 Bangkok'],['10. Oktober','Bangkok \u2013 Chiang Mai'],['13. Oktober','Chiang Mai \u2013 Bangkok'],['15. Oktober','Bangkok \u2013 Tokio'],['27. Oktober','Tokio \u2013 Honolulu'],['5. November','Honolulu \u2013 San Francisco'],['22. November','Phoenix \u2013 London'],['23. November','London \u2013 Z\u00fcrich']];
    const airports = { MUC:{lat:48.3538,lng:11.7861}, BKK:{lat:13.69,lng:100.7501}, DMK:{lat:13.9126,lng:100.6068}, CNX:{lat:18.7668,lng:98.9626}, NRT:{lat:35.772,lng:140.3929}, HNL:{lat:21.3187,lng:-157.9225}, SFO:{lat:37.6213,lng:-122.379}, PHX:{lat:33.4373,lng:-112.0078}, LHR:{lat:51.47,lng:-0.4543}, ZRH:{lat:47.4582,lng:8.5555} };
    const countries = [{name:'Deutschland',lat:50.8,lng:10.2},{name:'Thailand',lat:14.8,lng:101.8},{name:'Japan',lat:37.5,lng:138.2},{name:'USA',lat:39.5,lng:-98.3},{name:'Schweiz',lat:46.8,lng:8.2}];
    const flights = [{from:'MUC',to:'BKK',date:'2026-10-08'},{from:'DMK',to:'CNX',date:'2026-10-10'},{from:'CNX',to:'BKK',date:'2026-10-13'},{from:'BKK',to:'NRT',date:'2026-10-15'},{from:'NRT',to:'HNL',date:'2026-10-27'},{from:'HNL',to:'SFO',date:'2026-11-05'},{from:'PHX',to:'LHR',date:'2026-11-22'},{from:'LHR',to:'ZRH',date:'2026-11-23'}];
    function todayIso(){ const n=new Date(); return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0'); }
    function visible(f,t){ return f.date==='2026-10-08' || f.date<=t; }
    function arc(a,b){ const p=[]; let lng2=b.lng; if(Math.abs(lng2-a.lng)>180) lng2+=lng2>a.lng?-360:360; for(let i=0;i<=64;i++){ const t=i/64; p.push([a.lat+(b.lat-a.lat)*t+Math.sin(Math.PI*t)*2.2, a.lng+(lng2-a.lng)*t]); } return p; }
    function pin(){ return L.divIcon({className:'pin', html:'<i></i>', iconSize:[9,12], iconAnchor:[4,11]}); }
    function card(s, href, showDate){ const date = (showDate!==false && L(s,'date')) ? '<p class="kicker">'+L(s,'date')+'</p>' : ''; return '<article class="post'+(s.id==='willkommen'?' welcome':'')+'">'+date+'<h2>'+(href?'<a href="'+href+'">'+L(s,'country')+'</a>':L(s,'country'))+'</h2>'+(L(s,'excerpt')?'<p>'+L(s,'excerpt')+'</p>':'')+(href?'<a class="more" href="'+href+'">Weiterlesen</a>':'')+'</article>'; }
    function showStories(){ document.getElementById('app').innerHTML='<div class="posts">'+stories.map(s=>card(s, s.places||s.body?'#story/'+s.id:null, !s.places)).join('')+'</div>'; }
    function showCountry(id){ const s=stories.find(x=>x.id===id); if(!s||!s.places){ showStory(id); return; } document.getElementById('app').innerHTML='<article class="story"><a class="back" href="#stories">\u2190 Alle Geschichten</a><h2>'+L(s,'country')+'</h2><div class="posts">'+s.places.map(p=>card(p, L(p,'body')?'#story/'+p.id:null)).join('')+'</div></article>'; }
    function findPlace(id){ for(const s of stories){ if(s.places){ const p=s.places.find(x=>x.id===id); if(p) return {place:p, parent:s}; } if(s.id===id) return {place:s, parent:null}; } return {place:stories[0], parent:null}; }
    function openGallery(images, start){
      let i=start;
      const box=document.createElement('div'); box.className='lightbox';
      box.innerHTML='<button class="close" type="button" aria-label="Schliessen">\u00d7</button><button class="prev" type="button" aria-label="Zur\u00fcck">\u2039</button><img referrerpolicy="no-referrer" alt="Foto"><video controls playsinline style="display:none;max-width:100%;max-height:80vh"></video><p class="caption"></p><button class="next" type="button" aria-label="Weiter">\u203a</button>';
      document.body.appendChild(box);
      const img=box.querySelector('img'); const vid=box.querySelector('video'); const caption=box.querySelector('.caption');
      function show(n){ i=(n+images.length)%images.length; const item=images[i]; caption.textContent=item.caption||''; if(item.video){ img.style.display='none'; vid.style.display='block'; vid.src=item.src; vid.play(); } else { vid.pause(); vid.style.display='none'; img.style.display='block'; img.src=item.src+'?v=8'; } }
      box.querySelector('.prev').onclick=()=>show(i-1);
      box.querySelector('.next').onclick=()=>show(i+1);
      box.querySelector('.close').onclick=()=>box.remove();
      box.onclick=(e)=>{ if(e.target===box) box.remove(); };
      document.onkeydown=(e)=>{ if(e.key==='ArrowRight') show(i+1); if(e.key==='ArrowLeft') show(i-1); if(e.key==='Escape') box.remove(); };
      show(i);
    }
    function showStory(id){
      const found=findPlace(id); const s=found.place; const back=found.parent?'#story/'+found.parent.id:'#stories';
      const photos=s.images&&s.images.length?'<div class="gallery">'+s.images.map((photo,i)=>'<button type="button" data-i="'+i+'">'+(photo.video?'<video muted playsinline src="'+photo.src+'"></video>':'<img alt="'+(photo.caption||L(s,'country'))+'" referrerpolicy="no-referrer" src="'+photo.src+'?v=8">')+'</button>').join('')+'</div>':'';
      document.getElementById('app').innerHTML='<article class="story'+(s.id==='willkommen'?' welcome':'')+'"><a class="back" href="'+back+'">\u2190 Zur\u00fcck</a><p class="kicker">'+L(s,'date')+'</p><h2>'+L(s,'country')+'</h2>'+(s.body||[]).map(p=>'<p>'+p+'</p>').join('')+photos+(s.quote?'<blockquote>\u201e'+s.quote+'\u201c <span class="meta">\u2014 '+s.quoteBy+'</span></blockquote>':'')+'</article>';
      document.querySelectorAll('.gallery button').forEach(btn=>btn.onclick=()=>openGallery(s.images, Number(btn.dataset.i)));
    }
    function showAtlas(){
      const today=todayIso();
      document.getElementById('app').innerHTML='<div class="section-head"><h2>Atlas</h2></div><div id="worldMap"></div><div class="places">'+places.map(p=>'<div class="place"><strong>'+p[0]+'</strong><span>'+p[1]+'</span></div>').join('')+'</div>';
      const map=L.map('worldMap',{worldCopyJump:true}).setView([28,15],2);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'\u00a9 OpenStreetMap',maxZoom:8}).addTo(map);
      countries.forEach(c=> L.marker([c.lat,c.lng],{interactive:false,opacity:0}).bindTooltip(c.name,{permanent:true,direction:'center',className:'country-label'}).addTo(map));
      Object.keys(airports).forEach(code=>{ if(code==='DMK') return; L.marker([airports[code].lat,airports[code].lng],{icon:pin()}).addTo(map); });
      flights.filter(f=>visible(f,today)).forEach(f=> L.polyline(arc(airports[f.from],airports[f.to]),{color:'#9a5344',weight:1.1,opacity:.8,dashArray:'1.5 7',lineCap:'round'}).addTo(map));
      setTimeout(()=>map.invalidateSize(),200);
    }
    function showAbout(){ const about = lang==='en' ? 'Join us on our journey once around the world. From the urban jungle of Bangkok through the unknown cultures of Japan and the historic treasures of Hawaii to the vastness of the USA, and everything we encounter in between.' : 'Begleite uns auf unserer Reise einmal um die Welt. Vom Gro\u00dfstadtdschungel Bangkok \u00fcber die unbekannten Kulturen Japans und die historischen Kultursch\u00e4tze Hawaiis bis in die Weiten der USA, und zu allem, was uns dazwischen begegnet.'; document.getElementById('app').innerHTML='<section class="about-copy"><div><h2>Kerstin & Stefan</h2><p>'+about+'</p></div><img alt="Kerstin und Stefan" src="images/kerstin-stefan.jpg"></section>'; }
    function go(){ const hash=location.hash||'#stories'; if(hash==='#atlas') showAtlas(); else if(hash==='#about') showAbout(); else if(hash.startsWith('#story/')){ const id=hash.slice(7); const s=stories.find(x=>x.id===id); if(s&&s.places) showCountry(id); else showStory(id); } else showStories(); }
    document.querySelectorAll('.lang').forEach(b=>{ b.classList.toggle('active', b.dataset.lang===lang); b.addEventListener('click', ()=>{ lang=b.dataset.lang; localStorage.setItem('waymarks-lang', lang); document.querySelectorAll('.lang').forEach(x=>x.classList.toggle('active', x.dataset.lang===lang)); go(); }); });
    window.addEventListener('hashchange', go); go();
  
  </script>
