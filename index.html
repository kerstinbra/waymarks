<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>waymarks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500&display=swap" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body, h1, h2, h3, p, a, button, input, textarea { font-family: Poppins, sans-serif; }
    h1, h2, h3 { font-weight: 400; }
    p, a, .kicker { font-weight: 300; }
    .mark { font-weight: 300; letter-spacing: 0.01em; }
    .mark-dot { width: 11px; height: 11px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: #b4482a; box-shadow: none; margin-bottom: 3px; }
    #worldMap { height: 560px; border-radius: 24px; border: 1px solid rgba(28,23,18,.12); }
    .country-label { background: transparent; border: 0; box-shadow: none; font-family: Poppins, sans-serif; font-size: 13px; font-weight: 400; letter-spacing: .04em; text-transform: uppercase; color: #5c534a; }
    .pin { background: none; border: 0; }
    .pin i { display: block; width: 9px; height: 9px; background: #b4482a; border: 1.5px solid #fff; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); box-shadow: 0 1px 2px rgba(28,23,18,.28); }
    .about-copy { display: grid; grid-template-columns: 1.1fr .9fr; gap: 36px; align-items: center; }
    .about-copy h2, .story h2, .post h2 { font-size: clamp(2rem, 4vw, 2.8rem); margin: 8px 0 12px; font-weight: 400; }
    .about-copy p, .story p, .post p { color: #5c534a; font-size: 1.02rem; font-weight: 300; }
    .about-copy img { width: 100%; max-width: 440px; border-radius: 24px; display: block; object-fit: cover; height: auto; }
    .posts, .places { display: flex; flex-direction: column; gap: 14px; max-width: 46rem; margin-top: 22px; }
    .post, .place { padding-bottom: 16px; border-bottom: 1px solid rgba(28,23,18,.12); }
    .place { display: grid; grid-template-columns: 9.5rem 1fr; gap: 8px 16px; }
    .post a.more, .place span { color: #b4482a; }
    .story { max-width: 46rem; }
    .carousel { position: relative; margin: 22px 0 8px; border-radius: 18px; overflow: hidden; background: #ebe4d6; }
    .carousel img { width: 100%; height: min(72vw, 520px); object-fit: cover; display: block; }
    .carousel button { position: absolute; top: 50%; transform: translateY(-50%); width: 42px; height: 42px; border: 0; border-radius: 50%; background: rgba(255,255,255,.86); color: #1c1712; font-size: 22px; cursor: pointer; }
    .carousel .prev { left: 12px; }
    .carousel .next { right: 12px; }
    .carousel .count { position: absolute; right: 14px; bottom: 12px; background: rgba(28,23,18,.55); color: #fff; border-radius: 999px; padding: 4px 10px; font-size: .82rem; }
    .story blockquote { margin: 28px 0 0; padding-left: 16px; border-left: 2px solid #b4482a; color: #1c1712; font-size: 1.05rem; }
    .back { color: #b4482a; display: inline-block; margin-bottom: 12px; }
    @media (max-width: 800px) { .about-copy { grid-template-columns: 1fr; } .about-copy img { max-width: 100%; } .place { grid-template-columns: 1fr; } .carousel img { height: 68vw; } }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="mark" href="#stories"><span class="mark-dot"></span>waymarks</a>
    <nav class="nav">
      <a href="#stories">Stories</a>
      <a href="#atlas">Atlas</a>
      <a href="#about">About</a>
    </nav>
  </header>
  <main id="app"></main>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const stories = [
      {id:'willkommen', country:'Sch\u00f6n, dass du da bist', date:'7. Oktober 2026', excerpt:'Bald ist es so weit. In einem Tag starten wir unsere grosse Reise.', body:['Bald ist es so weit. In einem Tag starten wir unsere grosse Reise. Die Koffer sind fast gepackt, der K\u00fchlschrank ist leer, und die Pflanzen in gute Obhut gegeben.','F\u00fcr uns sind es viele erste Male \u2013 das erste Mal Asien, f\u00fcr mich das erste Mal Reisen ausserhalb der Schulferien, das erste Mal um die Welt.','So bin ich gespannt, welche Facetten wir an uns selbst neu entdecken d\u00fcrfen \u2013 durch so viele Spiegel in unterschiedlichen Kulturen. Ich freue mich darauf, in ganz andere Welten einzutauchen und schlussendlich auf eine andere Art zu merken, was uns in unserem Leben wirklich wichtig ist. Bald geht das Licht hier aus, und morgen Nachmittag sitzen wir schon im Flieger nach Bangkok.'], quote:'Reisen l\u00e4sst dich sprachlos und verwandelt dich dann in einen Geschichtenerz\u00e4hler.', quoteBy:'Ibn Battuta'},
      {id:'thailand', country:'Bangkok', date:'9. Oktober 2026', excerpt:'Beim ersten Schritt aus dem Flughafen wehte uns eine Wand aus heissem, dickem, etwas stickigem Wind entgegen.', images:['https://n.uguu.se/iJCUdBqg.jpg','https://n.uguu.se/SXMXpHtC.jpg','https://d.uguu.se/aUHDzsWR.jpg','https://h.uguu.se/CLVJDqmu.jpg','https://d.uguu.se/SmMssjOV.jpg','https://n.uguu.se/xSSDPHpK.jpg','https://n.uguu.se/YhNtUJlA.jpg'], body:['Beim ersten Schritt aus dem Flughafen wehte uns eine Wand aus heissem, dickem, etwas stickigem Wind entgegen. Es ist 06:30 Uhr bei 28 Grad Celsius. Willkommen in Bangkok.','Da wir erst am Nachmittag in unser Hotel einchecken konnten, beschlossen wir, uns den Wat Pho anzusehen, die gr\u00f6sste der 400 Tempelanlagen der Stadt.','\u201eBangkok \u2013 where Buddhas are not just decoration.\u201c Dieses Werbeschild entdeckten wir auf unserer Fahrt in die Stadt. Dass da wohl etwas dran ist, sahen wir schon in den ersten paar Minuten in der Tempelanlage. Etwa 1000 Buddha-Statuen finden dort ihr Zuhause, wobei der bekannteste von allen ein ganz besonderer ist.','Der liegende Buddha, der sich mit 46 Metern L\u00e4nge und 15 Metern H\u00f6he durch den ganzen extra gebauten Viharn erstreckt, war sehr eindringlich. Fast noch mehr hat uns jedoch die wundersch\u00f6ne buddhistische Wandbemalung der Versammlungshalle gefallen.','In der Halle war w\u00e4hrend der Besichtigung immer wieder ein Geklimper zu h\u00f6ren. Etwas sp\u00e4ter sahen wir auch, woher es kam: 108 Almosenschalen befinden sich auf der R\u00fcckseite des Buddhas. Jede einzelne mit Kleingeld zu f\u00fcllen soll Gl\u00fcck bringen.','Ein weiterer Teil der Tempelanlage ist die Wat Pho Medical and Massage School, wo die Wat-Pho-Massage angeboten wird. Die Massagetechnik ist tief mit der Entstehung Thailands verwoben und z\u00e4hlt heute zum UNESCO-Kulturerbe.','Da wir uns beide schon auf die Massagen in Thailand gefreut hatten, fanden wir uns wenig sp\u00e4ter gespannt in der Massagehalle ein, in der wir freundlich begr\u00fcsst wurden. Ausgestattet mit eigener Massagebekleidung, bestehend aus einem leinenartigen Hemd und einer Wickelhose, liessen wir uns in der n\u00e4chsten Stunde wortw\u00f6rtlich durchkneten und f\u00fchlten uns in guten und kr\u00e4ftigen H\u00e4nden.','Nach dem Besuch im Tempel tauchten wir in das Stadtleben der Thail\u00e4nder ein: Tempel zwischen Streetfood, Tuktuks, M\u00e4rkten und Kan\u00e4len. Eines fiel uns dabei besonders auf: Die Diskrepanz zwischen den goldenen, aufbereiteten Tempeln und der direkt danebenliegenden Lebensrealit\u00e4t der Bewohner war immens. In der Stadt liegt oft ein beissender Geruch in der Luft, wohl eine Mischung aus der enormen Luftverschmutzung und der noch nicht gut ausgebauten Abwasserentsorgung. Trotz der Armut haben die meisten Thais ihr Lachen und ihre hilfsbereite Art noch keineswegs verloren.','In jeder Ecke standen authentische Mammas, die Pad Thai und andere K\u00f6stlichkeiten kochten. Was wir probierten, war meist lecker, wobei wir uns an Maden, Schlangen und Skorpione nicht herangewagt haben.','F\u00fcr die Heimfahrt zum Hotel entschieden wir uns f\u00fcr eine Tuktuk-Fahrt. Tuktuks sind dreir\u00e4drige, moped\u00e4hnliche Rikschas, die zum Transport und als Taxi genutzt werden. Der Fahrer wollte uns die Fahrt zuerst f\u00fcr 400 Baht verkaufen, etwa 10 Euro. Wir stiegen darauf nicht ein. Daraufhin bot er uns die Fahrt f\u00fcr 100 Baht an, wenn wir eine bestimmte Route mit inkludierten Sehensw\u00fcrdigkeiten w\u00e4hlen w\u00fcrden. Ein guter Deal, dachten wir, nicht wissend, dass die Sehensw\u00fcrdigkeiten Tempel mit Verk\u00e4ufern und Thai Fashion beinhalteten. Thai Fashion ist eines der unz\u00e4hligen kleinen Gesch\u00e4fte, in denen massgeschneiderte Anz\u00fcge angeboten werden. Einige Zeit sp\u00e4ter kamen wir dann ohne Anzug m\u00fcde in unserem Zimmer an.']},
      {id:'japan', country:'Japan', date:'15. Oktober 2026'},
      {id:'hawaii', country:'Hawaii', date:'26. Oktober 2026'},
      {id:'usa', country:'USA', date:'5. November 2026'},
      {id:'schweiz', country:'Schweiz', date:'23. November 2026'}
    ];
    const places = [['8. Oktober','M\u00fcnchen \u2013 Bangkok'],['10. Oktober','Bangkok \u2013 Chiang Mai'],['13. Oktober','Chiang Mai \u2013 Bangkok'],['15. Oktober','Bangkok \u2013 Tokio'],['27. Oktober','Tokio \u2013 Honolulu'],['5. November','Honolulu \u2013 San Francisco'],['22. November','Phoenix \u2013 London'],['23. November','London \u2013 Z\u00fcrich']];
    const airports = { MUC:{lat:48.3538,lng:11.7861}, BKK:{lat:13.69,lng:100.7501}, DMK:{lat:13.9126,lng:100.6068}, CNX:{lat:18.7668,lng:98.9626}, NRT:{lat:35.772,lng:140.3929}, HNL:{lat:21.3187,lng:-157.9225}, SFO:{lat:37.6213,lng:-122.379}, PHX:{lat:33.4373,lng:-112.0078}, LHR:{lat:51.47,lng:-0.4543}, ZRH:{lat:47.4582,lng:8.5555} };
    const countries = [{name:'Deutschland',lat:50.8,lng:10.2},{name:'Thailand',lat:14.8,lng:101.8},{name:'Japan',lat:37.5,lng:138.2},{name:'USA',lat:39.5,lng:-98.3},{name:'Schweiz',lat:46.8,lng:8.2}];
    const flights = [{from:'MUC',to:'BKK',date:'2026-10-08'},{from:'DMK',to:'CNX',date:'2026-10-10'},{from:'CNX',to:'BKK',date:'2026-10-13'},{from:'BKK',to:'NRT',date:'2026-10-15'},{from:'NRT',to:'HNL',date:'2026-10-27'},{from:'HNL',to:'SFO',date:'2026-11-05'},{from:'PHX',to:'LHR',date:'2026-11-22'},{from:'LHR',to:'ZRH',date:'2026-11-23'}];
    function todayIso(){ const n=new Date(); return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0'); }
    function visible(f,t){ return f.date==='2026-10-08' || f.date<=t; }
    function arc(a,b){ const p=[]; let lng2=b.lng; if(Math.abs(lng2-a.lng)>180) lng2+=lng2>a.lng?-360:360; for(let i=0;i<=64;i++){ const t=i/64; p.push([a.lat+(b.lat-a.lat)*t+Math.sin(Math.PI*t)*2.2, a.lng+(lng2-a.lng)*t]); } return p; }
    function pin(){ return L.divIcon({className:'pin', html:'<i></i>', iconSize:[9,12], iconAnchor:[4,11]}); }
    function showStories(){ document.getElementById('app').innerHTML='<div class="posts">'+stories.map(s=>'<article class="post"><p class="kicker">'+s.date+'</p><h2>'+(s.body?'<a href="#story/'+s.id+'">'+s.country+'</a>':s.country)+'</h2>'+(s.excerpt?'<p>'+s.excerpt+'</p>':'')+(s.body?'<a class="more" href="#story/'+s.id+'">Weiterlesen</a>':'')+'</article>').join('')+'</div>'; }
    function showStory(id){
      const s=stories.find(x=>x.id===id)||stories[0];
      const photos=s.images&&s.images.length?'<div class="carousel"><button class="prev" type="button" aria-label="Zur\u00fcck">\u2039</button><img alt="Bangkok"><button class="next" type="button" aria-label="Weiter">\u203a</button><span class="count"></span></div>':'';
      document.getElementById('app').innerHTML='<article class="story"><a class="back" href="#stories">\u2190 Alle Geschichten</a><p class="kicker">'+s.date+'</p><h2>'+s.country+'</h2>'+(s.body||[]).map(p=>'<p>'+p+'</p>').join('')+photos+(s.quote?'<blockquote>\u201e'+s.quote+'\u201c <span class="meta">\u2014 '+s.quoteBy+'</span></blockquote>':'')+'</article>';
      if(!s.images||!s.images.length) return;
      let i=0; const img=document.querySelector('.carousel img'); const count=document.querySelector('.carousel .count');
      function show(n){ i=(n+s.images.length)%s.images.length; img.src=s.images[i]; count.textContent=(i+1)+' / '+s.images.length; }
      document.querySelector('.carousel .prev').onclick=()=>show(i-1);
      document.querySelector('.carousel .next').onclick=()=>show(i+1);
      show(0);
    }
    function showAtlas(){
      const today=todayIso();
      document.getElementById('app').innerHTML='<div class="section-head"><h2>Atlas</h2></div><div id="worldMap"></div><div class="places">'+places.map(p=>'<div class="place"><strong>'+p[0]+'</strong><span>'+p[1]+'</span></div>').join('')+'</div>';
      const map=L.map('worldMap',{worldCopyJump:true}).setView([28,15],2);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'\u00a9 OpenStreetMap',maxZoom:8}).addTo(map);
      countries.forEach(c=> L.marker([c.lat,c.lng],{interactive:false,opacity:0}).bindTooltip(c.name,{permanent:true,direction:'center',className:'country-label'}).addTo(map));
      Object.keys(airports).forEach(code=>{ if(code==='DMK') return; L.marker([airports[code].lat,airports[code].lng],{icon:pin()}).addTo(map); });
      flights.filter(f=>visible(f,today)).forEach(f=> L.polyline(arc(airports[f.from],airports[f.to]),{color:'#9a5344',weight:1.1,opacity:.8,dashArray:'1.5 7',lineCap:'round'}).addTo(map));
      setTimeout(()=>map.invalidateSize(),200);
    }
    function showAbout(){ document.getElementById('app').innerHTML='<section class="about-copy"><div><h2>Kerstin & Stefan</h2><p>Begleite uns auf unserer Reise einmal um die Welt. Vom Gro\u00dfstadtdschungel Bangkok \u00fcber die unbekannten Kulturen Japans und die historischen Kultursch\u00e4tze Hawaiis bis in die Weiten der USA, und zu allem, was uns dazwischen begegnet.</p></div><img alt="Kerstin und Stefan" src="https://n.uguu.se/QfnhYafx.jpg"></section>'; }
    function go(){ const hash=location.hash||'#stories'; if(hash==='#atlas') showAtlas(); else if(hash==='#about') showAbout(); else if(hash.startsWith('#story/')) showStory(hash.slice(7)); else showStories(); }
    window.addEventListener('hashchange', go); go();
  </script>
</body>
</html>
