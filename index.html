    const stories = [{id:'willkommen',country:'Schön, dass du da bist',date:'7. Oktober 2026',en:{country:'Nice to have you here',date:'7 October 2026',excerpt:'The countdown is on. In one day we start our big journey.',body:["The countdown is on. In one day we start our big journey. The suitcases are almost packed, the fridge is empty, and the plants are in good hands.","For us these are many firsts – the first time in Asia, for me the first time travelling outside the school holidays, the first time around the world.","I am curious which facets of ourselves we may discover – through so many mirrors in different cultures. I look forward to diving into entirely different worlds and finally noticing, in a different way, what is really important to us in our lives. Soon the lights go out here, and tomorrow afternoon we will already be on the plane to Bangkok.","“Travel makes you speechless and then turns you into a storyteller.” — Ibn Battuta"]},excerpt:'Bald ist es so weit. In einem Tag starten wir unsere grosse Reise.',body:["Bald ist es so weit. In einem Tag starten wir unsere grosse Reise. Die Koffer sind fast gepackt, der Kühlschrank ist leer, und die Pflanzen in gute Obhut gegeben.","Für uns sind es viele erste Male – das erste Mal Asien, für mich das erste Mal Reisen ausserhalb der Schulferien, das erste Mal um die Welt.","So bin ich gespannt, welche Facetten wir an uns selbst neu entdecken dürfen – durch so viele Spiegel in unterschiedlichen Kulturen. Ich freue mich darauf, in ganz andere Welten einzutauchen und schlussendlich auf eine andere Art zu merken, was uns in unserem Leben wirklich wichtig ist. Bald geht das Licht hier aus, und morgen Nachmittag sitzen wir schon im Flieger nach Bangkok."],quote:'Reisen lässt dich sprachlos und verwandelt dich dann in einen Geschichtenerzähler.',quoteBy:'Ibn Battuta'},{id:'thailand',country:'Thailand',date:'9. Oktober 2026',en:{country:'Thailand',date:'9 October 2026'},places:[{id:'bangkok',country:'Bangkok',date:'9. Oktober 2026',en:{country:'Bangkok',date:'9 October 2026',excerpt:'As we stepped out of the airport a wall of hot, thick, slightly sticky air hit us.',body:["As we stepped out of the airport a wall of hot, thick, slightly sticky air hit us. It is 6:30 in the morning and 28 degrees. Welcome to Bangkok.","Since we could not check into our hotel until the afternoon, we decided to visit Wat Pho, the largest of the city's 400 temple complexes.","\"Bangkok – where Buddhas are not just decoration.\" We spotted this sign on our way into the city. That there was something to it became clear within the first few minutes inside the temple grounds. Around 1,000 Buddha statues have their home there, and the most famous of them is a very special one.","The reclining Buddha, stretching 46 metres long and 15 metres high through an entire hall built just for him, was deeply impressive. Almost even more, though, we loved the beautiful Buddhist wall paintings of the assembly hall.","Inside the hall we kept hearing a clinking sound. A little later we saw where it came from: 108 alms bowls line the back of the Buddha, and filling each one with coins is said to bring good luck.","Another part of the temple complex is the Wat Pho Medical and Massage School, where the Wat Pho massage is offered. The technique is deeply woven into the origins of Thailand and is now part of the UNESCO cultural heritage.","Since we had both been looking forward to the massages in Thailand, we treated ourselves to one. We felt in good (and strong ;-)) hands.","After the temple we immersed ourselves in the everyday life of the Thais: temples between street food, tuk-tuks, markets and canals. One thing stood out: the gap between the golden, restored temples and the everyday reality of the people living right next to them was immense. In the city there is often a biting smell – probably a mix of the heavy air pollution and the still poorly developed sewage system. Despite the poverty, most Thais have by no means lost their laughter and their helpful nature.","In every corner stood authentic mamas cooking Pad Thai and other delicacies. What we tried was mostly delicious – though we did not dare the maggots, snakes and scorpions.","For the ride back to the hotel we chose a tuk-tuk. Tuk-tuks are three-wheeled, moped-like rickshaws used for transport and as taxis. The driver first wanted 400 baht for the ride, about 10 euros. We did not take it. He then offered the ride for 100 baht if we chose a certain route with included \"sights\". A good deal, we thought, not knowing that the sights included temples with vendors and Thai Fashion. Thai Fashion refers to the countless small shops where custom-made suits are offered. Some time later we arrived, without a suit, tired in our room.","In the afternoon we decided to choose a different means of transport, away from the rather pushy vendors of the city. On the largest river, the Chao Phraya, water buses take mainly tourists from A to B. On the Blue Line we rode south towards the business district, where we could dive into a completely different version of Thailand. We got off at Iconsiam, a luxury shopping and lifestyle centre with impressive architecture. Besides Gucci and Prada we found a huge food market in the basement with countless stalls. Meat skewers, dumplings, seafood and sticky rice shared the space with countless other dishes and the famous \"stink fruit\" durian. In the middle of the hustle between all the food stalls and thousands of people, as if it were the most normal thing in the world, a wedding ceremony took place on an ordinary Friday afternoon.","On our way back we made a small detour via the famous Khao San Road. The party street is especially popular with backpackers, but it was a bit too loud for us. We chose street food in a side street. After a 5-euro foot massage on the way back we then fell tired and exhausted into bed."]},images:[{src:'images/watpho-spires.jpg',caption:'Wat Pho'},{src:'images/watpho-buddhas.jpg',caption:'Wat Pho'},{src:'images/watpho-hall.jpg',caption:'Wat Pho'},{src:'images/watpho-reclining.jpg',caption:'Wat Pho'},{src:'images/watpho-laughing.jpg',caption:'Wat Pho'},{src:'images/tuktuk.jpg',caption:'Tuktuk'},{src:'images/chao-phraya.jpg',caption:'Chao Phraya'},{src:'images/chao-phraya-2.jpg',caption:'Chao Phraya'},{src:'images/khaosan.jpg',caption:'Khao San'},{src:'images/streetfood.jpg',caption:'Streetfood'},{src:'images/thai-tea.jpg',caption:'Thai Tea'},{src:'images/pad-thai.jpg',caption:'Pad Thai'}],body:["Beim ersten Schritt aus dem Flughafen wehte uns eine Wand aus heissem, dickem, etwas stickigem Wind entgegen. Es ist 06:30 Uhr bei 28 Grad Celsius. Willkommen in Bangkok.","Da wir erst am Nachmittag in unser Hotel einchecken konnten, beschlossen wir, uns den Wat Pho anzusehen, die grösste der 400 Tempelanlagen der Stadt.","„Bangkok – where Buddhas are not just decoration.“ Dieses Werbeschild entdeckten wir auf unserer Fahrt in die Stadt. Dass da wohl etwas dran ist, sahen wir schon in den ersten paar Minuten in der Tempelanlage. Etwa 1000 Buddha-Statuen finden dort ihr Zuhause, wobei der bekannteste von allen ein ganz besonderer ist.","Der liegende Buddha, der sich mit 46 Metern Länge und 15 Metern Höhe durch den ganzen extra gebauten Viharn erstreckt, war sehr eindrücklich. Fast noch mehr hat uns jedoch die wunderschöne buddhistische Wandbemalung der Versammlungshalle gefallen.","In der Halle war während der Besichtigung immer wieder ein Geklimper zu hören. Etwas später sahen wir auch, woher es kam: 108 Almosenschalen befinden sich auf der Rückseite des Buddhas. Jede einzelne mit Kleingeld zu füllen soll Glück bringen.","Ein weiterer Teil der Tempelanlage ist die Wat Pho Medical and Massage School, wo die Wat-Pho-Massage angeboten wird. Die Massagetechnik ist tief mit der Entstehung Thailands verwoben und zählt heute zum UNESCO-Kulturerbe.","Da wir uns beide schon auf die Massagen in Thailand gefreut hatten, fanden wir uns wenig später gespannt in der Massagehalle ein, in der wir freundlich begrüsst wurden. Ausgestattet mit eigener Massagebekleidung, bestehend aus einem leinenartigen Hemd und einer Wickelhose, liessen wir uns in der nächsten Stunde wortwörtlich durchkneten und fühlten uns in guten und kräftigen Händen.","Nach dem Besuch im Tempel tauchten wir in das Stadtleben der Thailänder ein: Tempel zwischen Streetfood, Tuktuks, Märkten und Kanälen. Eines fiel uns dabei besonders auf: Die Diskrepanz zwischen den goldenen, aufbereiteten Tempeln und der direkt danebenliegenden Lebensrealität der Bewohner war immens. In der Stadt liegt oft ein beissender Geruch in der Luft, wohl eine Mischung aus der enormen Luftverschmutzung und der noch nicht gut ausgebauten Abwasserentsorgung. Trotz der Armut haben die meisten Thais ihr Lachen und ihre hilfsbereite Art noch keineswegs verloren.","In jeder Ecke standen authentische Mammas, die Pad Thai und andere Köstlichkeiten kochten. Was wir probierten, war meist lecker, wobei wir uns an Maden, Schlangen und Skorpione nicht herangewagt haben.","Für die Heimfahrt zum Hotel entschieden wir uns für eine Tuktuk-Fahrt. Tuktuks sind dreirädrige, mopedähnliche Rikschas, die zum Transport und als Taxi genutzt werden. Der Fahrer wollte uns die Fahrt zuerst für 400 Baht verkaufen, das sind etwa 10 Euro. Wir stiegen darauf nicht ein. Daraufhin bot er uns die Fahrt für 100 Baht an, wenn wir eine bestimmte Route mit inkludierten „Sehenswürdigkeiten“ wählen würden. Ein guter Deal, dachten wir, nicht wissend, dass die Sehenswürdigkeiten Tempel mit Verkäufern und Thai Fashion beinhalteten. Thai Fashion bezeichnet dabei die unzähligen kleinen Geschäfte, in denen massgeschneiderte Anzüge angeboten werden. Einige Zeit später kamen wir dann ohne Anzug müde in unserem Zimmer an.","Am Nachmittag beschlossen wir, ein anderes Transportmittel zu wählen, abseits der doch aufdringlichen Verkäufer der Stadt. Auf dem grössten Fluss, dem Chao Phraya, bringen Wasserbusse vor allem Touristen von A nach B. Mit der Blue Line fuhren wir südwärts in Richtung Business-Viertel, wo wir in eine komplett andere Version von Thailand eintauchen konnten.","Wir stiegen beim Iconsiam aus, einem Luxus-Einkaufs- und Lifestyle-Zentrum mit beeindruckender Architektur. Neben Gucci und Prada fanden wir im Untergeschoss einen riesigen Foodmarket mit unzähligen Ständen. Fleischspiesse, Dumplings, Meeresfrüchte und Sticky Rice teilten sich den Platz mit unzähligen anderen Gerichten und der berühmten Stinkfrucht Durian. Mitten im Trubel zwischen all den Foodständen und Tausenden Menschen fand, als wäre es das Normalste der Welt, an einem gewöhnlichen Freitagnachmittag eine Hochzeitszeremonie statt.","Auf unserem Heimweg machten wir noch einen kleinen Umweg über die berühmte Khao-San-Strasse. Die Partystrasse ist vor allem bei Backpackern beliebt, war uns jedoch etwas zu laut. Wir entschieden uns für Streetfood in der Nebenstrasse. Nach einer Fussmassage für 5 Euro auf dem Heimweg fielen wir anschliessend müde und erschöpft ins Bett."]},{id:'bangkok-10',country:'Bangkok',date:'10. Oktober 2026',en:{country:'Bangkok',date:'10 October 2026',excerpt:'Well rested, we headed back towards the water bus, this time northwards.',body:["Well rested, we headed back towards the water bus, this time northwards. Our destination today was one of the largest open-air markets in the world. On the 15,000 stalls of Chatuchak Market there is definitely something for everyone – whether affordable clothing, art, furniture, animals or the extensive culinary offerings, the selection is huge.","A well-deserved break was slurping a chilled coconut, freshly split open with a machete before our eyes. After our probably somewhat clumsy attempts to scrape out the flesh with a plastic spoon, a Thai shop owner from another stall came to our help and, with a smile, pressed a tablespoon into our hands. Hospitality that we encountered again and again on our journey in Thailand.","In the afternoon we strolled through the Chatuchak Park right next door. The idyllic oasis, with its high-rises visible on the horizon, reminds one a little of Central Park in New York. Step by step it became quieter and the market bustle and city traffic faded into the background.","Well-stocked banana trees and bamboo shrubs were planted around the gentle streams and the lake, and between them scurried busy squirrels and all kinds of birds.","Back at the market the locals were just preparing for the evening tourism – as if from nowhere, countless new street-food stalls appeared on the streets. We slowly made our way towards the airport – out of the lively metropolis, towards the smaller city of Chiang Mai in the north. We are curious what awaits us among the mountain peoples of the Karen, the elephant sanctuaries and the jungle."]},excerpt:'Ausgeschlafen starteten wir wieder Richtung Wasserbus, dieses Mal jedoch nordwärts.',images:[{src:'images/chatuchak-park.jpg',caption:'Chatuchak Park'},{src:'images/chatuchak-skyline.jpg',caption:'Chatuchak Park'},{src:'images/chatuchak-bamboo.jpg',caption:'Chatuchak Park'},{src:'images/chatuchak-bamboo-2.jpg',caption:'Chatuchak Park'},{src:'images/chatuchak-art.jpg',caption:'Chatuchak'},{src:'images/streetfood-night.jpg',caption:'Streetfood'},{src:'images/streetfood-drinks.jpg',caption:'Streetfood'}],body:["Ausgeschlafen starteten wir wieder Richtung Wasserbus, dieses Mal jedoch nordwärts.","Unser heutiges Ziel war einer der grössten Open-Air-Märkte der Welt. Auf den 15’000 Ständen des Chatuchak-Marktes kommt definitiv jeder auf seine Kosten: preiswerte Kleidung, Kunst, Möbel, Tiere oder die umfangreichen kulinarischen Angebote. Das Angebot ist riesig.","Eine wohlverdiente Pause war das Schlürfen einer gekühlten Kokosnuss, die vor unseren Augen frisch mit einer Machete aufgeschlagen wurde. Nach unseren wahrscheinlich etwas unbeholfenen Versuchen, auch das Fleisch der Frucht mit einem Plastiklöffel auszukratzen, kam uns eine thailändische Ladenbesitzerin eines anderen Standes zur Hilfe und drückte uns mit einem Lächeln im Gesicht einen Esslöffel in die Hand. Gastfreundschaft, die uns auf unserer Reise in Thailand immer wieder begegnet.","Am Nachmittag schlenderten wir durch den direkt daneben liegenden Chatuchak Park. Die idyllische Oase erinnert mit ihren am Horizont erkennbaren Hochhäusern ein bisschen an den Central Park in New York. Schritt für Schritt wurde es leiser, und das Markttreiben und der Stadtverkehr rückten in den Hintergrund.","Reich bestückte Bananenbäume und Bambussträucher wurden um die sanften Flüsse und den See angelegt. Dazwischen wuselten fleissige Eichhörnchen und verschiedenste Vögel.","Zurück am Markt bereiteten sich die Einheimischen gerade auf den Abendtourismus vor. Wie aus dem Nichts erschienen unzählige neue Streetfood-Stände auf den Strassen. Wir machten uns langsam auf den Weg Richtung Flughafen, raus aus der lebendigen Millionenmetropole, hin zur nördlich gelegenen kleineren Stadt Chiang Mai. Wir sind gespannt, was uns zwischen den Bergvölkern der Karen, den Elefantenschutzstätten und dem Dschungel erwarten wird."]},{id:'chiangmai',country:'Chiang Mai',date:'11.–12. Oktober 2026',en:{country:'Chiang Mai',date:'11–12 October 2026',excerpt:'Arriving in the north, we started our day with a generous breakfast buffet.',body:["Arriving in the north, we started our day with a generous, plentiful breakfast buffet. From European jam bread to Thai rice dishes, American classics and fresh fruit, everything was there. With full stomachs and a backpack packed for the next two days, we were then picked up punctually in the hotel lobby. The reason we travelled to the north of Thailand was the two-day trip that now lay ahead of us. The aim was to discover the more rural area in the jungle of Thailand, away from the tourist masses.","After a car ride with the group we met our guides – two young men from the Karen villages, with a big grin on their faces and a funny remark on their lips, even if in broken English.","The Karen is a collective term for the indigenous inhabitants of the Thai mountains. Originally many of the peoples come from Myanmar. Since the withdrawal of the British there have been major conflicts between the Burmese military and the Karen, which is why many of the groups fled to Thailand.","So we began our hike up into the mountains of Thailand. The two guides, equipped with their simple plastic flip-flops, set a very ambitious pace with ease. Shortly afterwards a bamboo walking stick was quickly and skilfully made for each of the group.","Our first stop was a wonderful waterfall, where we also enjoyed our lunch. Everyone received an egg rice, carefully and artfully wrapped in a banana leaf. Full of joy, one of the guides pulled a 10 cm spider out of a web and presented it to us, holding it between his fingers in front of our noses. After a cool-down in the waterfall we continued to an \"ethical\" elephant sanctuary. The first encounter with the animals was incredibly fascinating. Their size, grace and the peace they radiate fascinated us. The keepers told us where they had rescued the animals – one of them still had visible traces of the restraints with which it had been locked up, on its head. And that after it had already been free for 20 years. We were allowed to feed the animals, stroke them and then bathe with them. Even though we enjoyed it very much, there was a voice in the back of our minds wondering whether the animals were really kept so ethically.","After a short further march we continued to the Karen village, where our accommodation and the goal of the day would be. At the first few steps into the village a few pigs grunted at us, tied with simple ropes around their feet. The people smiled at us in their colourful, traditional clothes. The poverty of the people was reflected in very simple living conditions.","Our accommodation was a simple wooden hut standing on stilts – perhaps to keep wild animals away. Our beds were simple mattresses on the floor, fitted with a mosquito net. As a couple we were lucky to have our own \"room\", while the others slept in a large room. On the balcony in front of the bedroom was a large table on which dinner was also served. And this dinner probably exceeded the expectations and ideas of everyone. The cook and two other people came with plates full of rice, curry, pumpkin with egg, vegetables and watermelon – it was delicious.","After dark our guides lit a fire. We asked them whether there were also snakes in the jungle of Thailand. Yes, they said, but not in the village. The villagers believe that there are spirits that keep them away from the village.","Originally the culture of the Karen was strongly connected with animism, a religion that does not worship one god but assumes that living and non-living things possess a spirit or a soul. Many of the peoples converted to Christianity after the mission, and so in the village we visited there was a Catholic, a Baptist and a Buddhist religious community. Some practices and rituals of the original culture were, however, retained.","So there are, for example, also in Bangkok in front of many houses a small shrine that is used for offerings to the spirit beings.","One of the guides, who spoke better English, told us that he had taught himself all the English, mainly through contact with the tourists. In the school he went to, he said, he had only learned to write, nothing more. He does the tours once a week, otherwise he works with his family on the rice field as a farmer. The rice they grow is not available for sale. It serves solely to feed the village he lives in. The other guide introduced us in the village to his two-year-old son, even though he himself was only just 21 years old.","So the day drew to a close, and all that could be heard were the sounds of the animals from the jungle.","The next morning the smell of fresh scrambled eggs drifted into our noses. When the bread ran out, one of the guides brought us the bread from his own home. \"No problem, we eat rice\", he said with a friendly smile. We did not accept it, since it was probably meant for his little boy. Still, it touched us anew how, even though they themselves did not have much, they would give everything for their guests.","So a short time later we left the little village behind us and walked downstream. After about half an hour we could already hear a loud rushing. A few metres of elevation lower down another beautiful waterfall awaited us, behind which one could even go into a small, cool half-cave. After a short break we continued in single file. Surrounded by sunshine and wide, green rice fields we crept along the narrow paths until suddenly we could watch 25 of the Karen at the rice harvest. Without further ado our guide grabbed a few of the sickles, and before we knew it we were in the middle of the action and helped cut the rice. Though I am not sure whether that really made them faster.","Downstream it went for about another hour and a half through the dense jungle. Again and again we heard something rustling and did not yet give up hope of spotting a monkey. Slowly the area became more inhabited again. We walked through shady banana plantations, and gradually the first houses of the town appeared. There our taxi was waiting for us again, and when we turned around we noticed that it was exactly the spot where we had set off the day before.","In the air-conditioned bus we drove to a small restaurant where we were served Pad Thai. The toilets, as in the little village, had no flush, but a rain barrel with water and a plastic container that fulfils this function. Sated by our felt tenth Pad Thai, which the Thais apparently do not eat themselves, we went to the last stop: a five-metre-long bamboo raft with which we rafted quietly through the river for half an hour. In the end the ride was much gentler than expected, but in return we could still spot some elephants on the riverbank.","Arriving at the lower base it was time to say goodbye to our guides before the journey home. We would gladly have asked them so much more: about the way they live, what occupies them, what moves them. But that was unfortunately not possible at all because of the language barrier. Still, they gave us experiences and showed us insights into an entirely different world that will stay with us for a long time. It was our money's worth in any case, and we hope that a large part of it will really flow to our guides and their families."]},excerpt:'Angekommen im Norden starteten wir unseren Tag mit einem ausgiebigen Frühstücksbuffet.',images:[{src:'images/cnx-hike-fields.jpg',caption:'Reisfeld'},{src:'images/cnx-hike-forest.jpg',caption:'Wanderung'},{src:'images/cnx-hike-selfie.jpg',caption:'Wanderung'},{src:'images/cnx-rice.jpg',caption:'Reisernte'},{src:'images/cnx-eierreis.jpg',caption:'Eier-Reis im Bananenblatt'},{src:'images/cnx-spider.jpg',caption:'Spinne'},{src:'images/cnx-insect.jpg',caption:'Dschungel'},{src:'images/cnx-stream.jpg',caption:'Dschungel'},{src:'images/cnx-elephant-feed.jpg',caption:'Elefanten'},{src:'images/cnx-elephant-feed2.jpg',caption:'Elefanten'},{src:'images/cnx-elephant-trunk.jpg',caption:'Elefanten'},{src:'images/cnx-elephants.jpg',caption:'Elefanten'},{src:'images/cnx-elephant-bath.jpg',caption:'Elefanten'}],body:["Angekommen im Norden starteten wir unseren Tag mit einem ausgiebigen, reichhaltigen Frühstücksbuffet. Vom europäischen Marmeladebrot über thailändische Reisgerichte und amerikanische Klassiker bis zu frischem Obst war alles dabei. Mit vollem Magen und einem Rucksack für die nächsten zwei Tage wurden wir danach pünktlich in der Hotellobby abgeholt.","Der Grund, warum wir in den Norden Thailands gereist waren, war der zweitägige Trip, der uns nun bevorstand. Ziel war das Entdecken der ländlicheren Gegend im Dschungel, abseits der Touristenmassen.","Nach einer Autofahrt mit der Reisegruppe lernten wir unsere Guides kennen: zwei junge Männer aus den Karendörfern, mit einem breiten Grinsen und einem lustigen Spruch auf den Lippen, auch wenn im gebrochenen Englisch.","Die Karen sind ein Sammelbegriff für die indigenen Bewohner der thailändischen Berge. Ursprünglich stammen viele der Völker aus Myanmar. Seit dem Abzug der Briten herrschen zwischen dem burmesischen Militär und den Karen grosse Konflikte, weswegen viele Gruppen nach Thailand geflüchtet sind.","So begannen wir unsere Wanderung hinauf in die Berge Thailands. Die zwei Guides legten dabei mit Leichtigkeit, ausgerüstet mit ihren simplen Plastik-Schlappen, ein sehr ambitioniertes Tempo vor. Kurz darauf wurde für jeden der Gruppe flink und geschickt ein Bambus-Gehstock geschnitzt. Immer wieder gab es kurze Stopps, in denen sie uns etwas zu den heimischen Pflanzen und Tieren erzählten. Sie taten das mit einer Faszination und Begeisterung, die mich immer noch zum Lächeln bringt.","Unser erster Stopp war ein wundervoller Wasserfall, wo wir auch unser Mittagessen genossen. Jeder bekam einen Eier-Reis, sorgfältig und kunstvoll in ein Bananenblatt eingewickelt. Voller Freude holte einer der Guides eine zehn Zentimeter grosse Spinne aus einem Netz und hielt sie uns zwischen den Fingern vors Gesicht. Nach einer Abkühlung im Wasserfall ging es weiter zu einem „ethischen“ Elefantenschutzgebiet.","Die erste Begegnung mit den Tieren war unglaublich faszinierend. Ihre Grösse, Anmut und der Frieden, den sie ausstrahlen, faszinierten uns. Die Pfleger erzählten uns, wo sie die Tiere gerettet haben. Eines der Tiere hatte immer noch sichtbare Spuren der Haltung, in der es eingesperrt gewesen war, auf dem Kopf. Und das, nachdem es schon 20 Jahre befreit war. Wir durften die Tiere füttern, streicheln und anschliessend mit ihnen baden. Obwohl wir es sehr genossen, meldete sich im Hinterkopf doch eine Stimme, die fragte, ob die Tiere wirklich so ethisch gehalten wurden.","Nach einem kleinen weiteren Marsch ging es weiter zum Karendorf, wo auch unsere Unterkunft und das Ziel des heutigen Tages sein sollte. Bei den ersten paar Schritten ins Dorf kamen uns grunzend ein paar Schweine entgegen, die mit einfachen Schnüren um den Fuss festgebunden waren. Die Menschen lächelten uns in ihren farbigen, traditionellen Kleidern entgegen. Die Armut spiegelte sich in sehr einfachen Wohnverhältnissen.","Unsere Unterkunft war eine einfache Holzhütte, die auf Pfeilern stand, vielleicht um wilde Tiere fernzuhalten. Unsere Betten waren einfache Matratzen am Boden, versehen mit einem Moskitonetz. Wir als Paar hatten das Glück, ein eigenes Zimmer zu haben, während die anderen in einem grossen Raum schliefen. Auf dem Balkon vor dem Schlafzimmer stand ein grosser Tisch, auf dem auch das Abendessen serviert wurde. Und dieses Abendessen übertraf wohl alle Erwartungen. Der Koch und zwei andere Menschen kamen mit Platten voller Reis, Curry, Kürbis mit Ei, Gemüse und Wassermelone. Es war köstlich.","Nach dem Einbruch der Dunkelheit zündeten unsere Guides noch ein Feuer an. Wir fragten sie, ob es im Dschungel Thailands auch Schlangen gäbe. Ja, meinten sie, aber nicht im Dorf. Die Bewohner glauben daran, dass es Geister gibt, die sie vom Dorf fernhalten.","Ursprünglich war die Kultur der Karen stark mit dem Animismus verbunden, einer Religion, die nicht einen Gott verehrt, sondern davon ausgeht, dass lebendige und unlebendige Dinge einen Geist oder eine Seele besitzen. Viele der Völker konvertierten nach der Missionierung zum Christentum, und so fanden sich in dem Dorf, das wir besuchten, eine katholische, eine baptistische und eine buddhistische Gemeinschaft. Einige Praktiken und Rituale der ursprünglichen Kultur wurden jedoch beibehalten.","So gibt es beispielsweise auch in Bangkok vor vielen Häusern einen kleinen Schrein, der für Opfergaben an die Geisterwesen verwendet wird.","Einer der Guides, der besser Englisch sprach, erzählte uns, dass er sich das Englisch alles selbst beigebracht hat, vor allem im Kontakt mit den Touristen. In der Schule, in der er war, habe er nur Schreiben gelernt, mehr nicht. Die Touren mache er einmal in der Woche, ansonsten arbeite er mit seiner Familie auf dem Reisfeld als Farmer. Der Reis, den sie anbauen, steht dabei nicht zum Verkauf zur Verfügung. Er dient allein der Ernährung des Dorfes, in dem er wohnt. Der andere Guide stellte uns im Dorf seinen zweijährigen Sohn vor, obwohl er selbst gerade erst 21 Jahre alt war.","So neigte sich der Tag dem Ende zu, und zu hören waren nur mehr die Geräusche der Tiere aus dem Dschungel.","Am nächsten Morgen wehte uns der Geruch von frischem Rührei in die Nase. Als das Brot ausging, brachte uns einer der Guides das Brot aus seiner eigenen Wohnung. „No problem, we eat rice“, meinte er mit einem freundlichen Lächeln. Wir nahmen es nicht an, da es wohl für seinen kleinen Jungen bestimmt war. Trotzdem berührte es uns aufs Neue, wie sie trotz dem, dass sie selbst nicht viel hatten, alles für ihre Gäste hergeben würden.","So liessen wir kurze Zeit später das kleine Dörfchen hinter uns und liefen flussabwärts. Nach etwa einer halben Stunde schon konnten wir ein lautes Rauschen hören. Ein paar Höhenmeter weiter unten erwartete uns ein weiterer wunderschöner Wasserfall, hinter den man sogar in eine kleine, kühle Halbhöhle konnte. Nach einer kurzen Pause wanderten wir im Gänsemarsch weiter. Umgeben von Sonnenschein und weiten, grünen Reisfeldern schlichen wir auf den schmalen Wegen entlang, bis wir vor uns plötzlich 25 der Karen bei der Reisernte beobachten konnten. Kurzerhand schnappte sich unser Guide ein paar der Sicheln, und bevor wir uns versahen, waren wir mitten im Geschehen und halfen mit, den Reis abzuschneiden. Wobei ich nicht sicher bin, ob sie dadurch wirklich schneller waren.","Flussabwärts ging es noch etwa eineinhalb Stunden durch den dichten Dschungel. Immer wieder hörten wir etwas rascheln und gaben die Hoffnung noch nicht auf, doch noch einen Affen zu entdecken. Langsam wurde die Gegend wieder bewohnter. Wir wanderten durch schattige Bananenplantagen, und allmählich zeigten sich die ersten Häuser der Stadt. Dort erwartete uns auch wieder unser Taxi, und als wir uns umdrehten, bemerkten wir, dass es exakt die Stelle war, an der wir am Vortag losgelaufen waren.","Im klimatisierten Bus fuhren wir zu einem kleinen Restaurant, wo wir Pad Thai serviert bekamen. Die Toiletten besassen dabei, wie im kleinen Dorf, keine Spülung, sondern eine Regentonne mit Wasser und einem Plastikbehälter, der diese Funktion erfüllt. Gesättigt von unserem gefühlt zehnten Pad Thai, das die Thais anscheinend selbst gar nicht essen, ging es zum letzten Stopp: ein fünf Meter langes Bambusfloss, mit dem wir eine halbe Stunde lang ruhig durch den Fluss geraftet sind. Schlussendlich war die Fahrt sehr viel sanfter als erwartet, dafür konnten wir noch einige Elefanten am Flussufer entdecken.","Angekommen am unteren Stützpunkt war es an der Zeit, uns von unseren Guides zu verabschieden, bevor es auf die Heimfahrt ging. Gerne hätten wir sie so viel mehr gefragt: über die Art, wie sie leben, was sie beschäftigt, was sie bewegt. Doch das war wegen der sprachlichen Barriere leider gar nicht möglich. Dennoch haben sie uns Erfahrungen geschenkt und Einblicke in eine ganz andere Welt gezeigt, die uns noch lange in Erinnerung bleiben. Es war unser Geld auf alle Fälle wert, und wir hoffen, dass davon auch ein Grossteil wirklich an unsere Guides und ihre Familien fliessen wird."]},{id:'chiangmai-oldtown',country:'Chiang Mai Old Town',date:'13. Oktober 2026',en:{country:'Chiang Mai Old Town',date:'13 October 2026',excerpt:'When the summer heat is not yet too extreme, I love exploring the city on foot.',body:["When the summer heat is not yet too extreme, the day has just begun, the city is still asleep, the traffic is slow and most lights are still dark, I love putting on my running shoes and exploring the city in a different way. So I used the morning hours to get to know the old part of Chiang Mai as well.","The largest city in the north of Thailand still has 1.2 million inhabitants in its catchment area, but feels much calmer than Bangkok. After a few minutes I reached the river, which winds in its square shape around the ruins of the old city wall. The further I went, the livelier the city became. The first stalls were already being set up, and the early risers among the tourists were already taking their first snapshots in front of the old city gate.","The city, whose name means \"New City\", has 200 temples and is one of the most popular destinations for digital nomads who stay there for longer. Over bumpy, sometimes suddenly non-existent pavements I suddenly found myself in a small market where there was already lively activity in the morning.","Arriving at the hotel we enjoyed our hotel breakfast again before we set off into the city together. Chiang Mai offers numerous cafés and co-working spaces, where we also spread out for a few hours to work.","In a small restaurant we tried for the first time the culinary hallmark of northern Thailand: Khao Soi. The name roughly translates as \"cut rice ribbon\". The curious thing is that the dish is almost exclusively prepared with egg noodles made from wheat. The name dates back to the time when the rice-flour sheets were rolled out thin and traditionally cut into strips with a knife. Since the friendly shop owner had misunderstood us, we ended up sitting there with much more food than planned. With the final sticky rice as dessert, this lunch was nevertheless, food-wise, one of the great highlights of the trip.","On the tip of Stefan's manager we then set off for the fish pedicure. On the roadside of a side alley stood a large aquarium stocked with countless little fish that could hardly wait to nibble at our soles. The feeling was quite ticklish, unfamiliar and strange at first. After a few minutes, though, we got used to it and could even enjoy it.","Through small alleys, past countless temples and massage offers, we explored the little town, of course barefoot so that the fresh nail polish would not be ruined, and then made our way back to the hotel. One massage later it was already time to slowly head towards the airport."]},excerpt:'Wenn die Sommerhitze noch nicht zu extrem ist, liebe ich es, die Stadt laufend zu erkunden.',images:[{src:'images/ot-stadttor.jpg',caption:'Stadttor'},{src:'images/ot-mauer.jpg',caption:'Stadtmauer'},{src:'images/ot-fluss.jpg',caption:'Fluss'},{src:'images/ot-kanal.jpg',caption:'Fluss'},{src:'images/ot-gasse.jpg',caption:'Old Town'},{src:'images/ot-coworking.jpg',caption:'Coworking'},{src:'images/ot-essen.jpg',caption:'Tom Kha Goong'},{src:'images/ot-fisch.jpg',caption:'Fisch-Pediküre'},{src:'images/ot-fisch2.jpg',caption:'Fisch-Pediküre'},{src:'images/ot-barfuss.jpg',caption:'Barfuss'},{src:'images/ot-stupa.jpg',caption:'Tempel'},{src:'images/ot-moenche.jpg',caption:'Mönche'}],body:["Wenn die Sommerhitze noch nicht zu extrem ist, der Tag gerade angebrochen, die Stadt noch schläft, der Verkehr langsam ist und die meisten Lichter noch dunkel sind, liebe ich es, meine Laufschuhe anzuziehen und die Stadt auf eine andere Art zu erkunden. So nutzte ich die Morgenstunden, um auch den alten Teil von Chiang Mai kennenzulernen.","Die grösste Stadt im Norden Thailands hat zwar immer noch 1,2 Millionen Einwohner im Einzugsgebiet, fühlt sich aber sehr viel ruhiger an als Bangkok. Nach ein paar Minuten erreichte ich den Fluss, der sich in seiner viereckigen Form um die Ruinen der alten Stadtmauer schlängelt. Je weiter ich kam, desto lebendiger wurde die Stadt. Erste Stände wurden schon aufgebaut, und die Frühaufsteher unter den Touristen schossen ihre ersten Schnappschüsse vor dem alten Stadttor.","Die Stadt, deren Name „Neue Stadt“ bedeutet, besitzt 200 Tempel und ist eines der beliebtesten Ziele für digitale Nomaden, die dort längere Zeit verweilen. Über holprige, teilweise plötzlich nicht mehr vorhandene Gehwege fand ich mich in einem kleinen Markt wieder, auf dem schon am Morgen reges Treiben herrschte.","Angekommen im Hotel genossen wir wieder unser Hotelfrühstück, bevor wir uns gemeinsam in die Stadt aufmachten. Chiang Mai bietet zahlreiche Cafés und Co-Working-Spaces, wo wir uns ein paar Stunden breit machten, um zu arbeiten.","In einem kleinen Restaurant probierten wir erstmals das kulinarische Wahrzeichen Nordthailands: Khao Soi. Der Name bedeutet übersetzt grob „geschnittenes Reisband“. Das Kuriose daran ist, dass das Gericht fast ausschliesslich mit Eiernudeln aus Weizen zubereitet wird. Der Name stammt noch aus der Zeit, als die Teigfladen aus Reis dünn ausgerollt und traditionell mit dem Messer in Streifen geschnitten wurden. Da die sympathische Ladenbesitzerin uns falsch verstanden hatte, sassen wir schlussendlich mit sehr viel mehr Essen da als geplant. Mit dem abschliessenden Sticky Rice als Nachspeise war dieses Mittagessen essenstechnisch eines unserer grossen Highlights der Reise.","Auf den Tipp von Stefans Manager hin machten wir uns anschliessend auf den Weg zur Fisch-Pediküre. Am Strassenrand einer Seitengasse stand ein grosses Aquarium, bestückt mit unzähligen kleinen Fischen, die es kaum erwarten konnten, unsere Fusssohlen anzuknabbern. Das Gefühl war am Anfang ziemlich kitzelig, ungewohnt und komisch. Nach ein paar Minuten gewöhnten wir uns aber daran und konnten es sogar geniessen.","Durch kleine Gässchen, vorbei an unzähligen Tempeln und Massageangeboten erkundeten wir das Städtchen, natürlich barfuss, damit der frische Nagellack nicht zerstört wird, und machten uns anschliessend wieder auf den Weg zurück ins Hotel. Eine Massage später war es schon wieder Zeit, uns langsam auf den Weg Richtung Flughafen zu machen."]}]},{id:'japan',country:'Japan',date:'15.+16. Oktober 2026',places:[{id:'tokio',country:'Tokio',date:'15.+16. Oktober 2026',excerpt:'Flughafen Tokio Narita. 40 Millionen Passagiere pro Jahr.',images:[{src:'images/jp-roboter.jpg',caption:'Narita'},{src:'images/jp-shibuya1.jpg',caption:'Shibuya'},{src:'images/jp-shibuya2.jpg',caption:'Shibuya'},{src:'images/jp-ubahn.jpg',caption:'U-Bahn'},{src:'images/jp-gyoza.jpg',caption:'Gyoza'},{src:'images/jp-takoyaki.jpg',caption:'Takoyaki'},{src:'images/jp-shibuya.mp4',caption:'Shibuya-Kreuzung',video:true}],body:["Flughafen Tokio Narita. 40 Millionen Passagiere pro Jahr. Dennoch merken wir auf unseren ersten paar Schritten in Japan vor allem eines: alles ist geordnet, alles hat Struktur, alles verläuft reibungslos. Auf unserer eineinhalbstündigen Zugfahrt in die Stadtmitte beobachteten wir Hunderte Menschen, keiner davon telefonierte laut oder unterhielt sich in einer unpassenden Lautstärke. Müllkübel sind fast nirgendwo zu finden, und die Vorgabe ist, den Müll mit sich zu nehmen – so lange, bis man einen findet, auch wenn das erst zuhause ist. Und die Einheimischen scheinen sich trotz der vielen Regeln an alle zu halten. Das umfangreiche U-Bahn-Netz gilt als eines der besten der Welt und besitzt gleich drei U-Bahn-Anbieter. Die drittgrösste Stadt fühlt sich bei weitem nicht so chaotisch an wie Bangkok, die Regeln und die Struktur vermitteln auch eine Art Sicherheit. Nach unserer Ankunft nach Mitternacht machten wir uns erst am nächsten Mittag auf den Weg in die Stadt.","Von den wuselnden Menschenmassen liessen wir uns mittragen in eine Gegend, wo es nach kleinen, gemütlichen Restaurants mit authentischem Essen aussah – und landeten in einem kleinen Sushi-Restaurant. Die Wände waren dunkel, und auf zwei kleinen Emporen standen je zwei Künstler vor ihrer Vitrine mit frischem Fisch. Um die Erhöhungen herum gab es schulterhohe Wände, davor Bartische mit Sitzplätzen. Wir liessen uns von einem älteren Japaner einen Platz zuweisen und setzten uns auf die Holzhocker. Mithilfe der Bildkarten bestellten wir unser erstes japanisches Sushi. Wir bekamen heissen Grüntee und dampfende Miso-Suppe serviert und konnten von unserem Platz aus staunend zusehen, wie der Sushi-Koch-Künstler vor unseren Augen den Reis zu passenden Päckchen formte und kunstvoll den Fisch darauf drapierte. Etwas überfordert von der japanischen Essensetikette genossen wir also unser Mahl und kamen langsam im neuen Land an.","Als es dunkel wurde, nahmen wir die U-Bahn zur berühmten Shibuya-Kreuzung, der meistfrequentierten Fussgängerquerung der Welt. Pro Ampelphase queren 2.500 bis 3.000 Menschen die Kreuzung. Daneben steht eine ganz besondere Statue: Hachiko. Der Akita-Hund wartete nach dem plötzlichen Tod seines Besitzers, Professor Ueno, fast zehn Jahre lang jeden Tag am Bahnhof Shibuya auf ihn. Er starb 1935, ohne je aufgegeben zu haben. Die Bronzestatue erinnert an diese Treue und ist heute einer der bekanntesten Treffpunkte Tokios.","Das Viertel Shibuya erinnert mit den grellen Lichtern etwas an New York, auch wenn die Oktopusbällchen und Dumplings uns wieder erinnerten, wo wir gerade waren – in einer Stadt, von der wir noch keinen Schimmer haben, was sie alles ausmacht, und die wirklich zu entdecken wahrscheinlich einige Wochen dauern würde."],en:{country:'Japan',date:'15 October 2026',excerpt:'Tokyo Narita Airport. 40 million passengers a year.',body:["Tokyo Narita Airport. 40 million passengers a year. And yet, on our first few steps in Japan, we notice above all one thing: everything is orderly, everything has structure, everything runs smoothly. On our one-and-a-half-hour train ride into the city centre we watched hundreds of people, none of whom was talking loudly on the phone or conversing at an inappropriate volume. Rubbish bins are almost nowhere to be found, and the rule is to take your rubbish with you – until you find one, even if that is only at home. And the locals seem to stick to all the rules despite there being so many of them. The extensive subway network is considered one of the best in the world and has no fewer than three subway operators. The third-largest city feels nowhere near as chaotic as Bangkok; the rules and the structure also convey a kind of safety. After our arrival after midnight we only set off into the city the next midday.","We let the bustling crowds carry us into an area that looked like it had small, cosy restaurants with authentic food – and ended up in a small sushi restaurant. The walls were dark, and on two small raised platforms two artists each stood in front of their display case with fresh fish. Around the platforms there were shoulder-high walls, and in front of them bar tables with seats. We let an older Japanese man assign us a seat and sat down on the wooden stools. With the help of the picture cards we ordered our first Japanese sushi. We were served hot green tea and steaming miso soup and could watch in amazement from our seat as the sushi chef artist formed the rice into fitting packets before our eyes and artfully arranged the fish on top. Somewhat overwhelmed by the Japanese dining etiquette, we enjoyed our meal and slowly arrived in the new country.","When it got dark we took the subway to the famous Shibuya Crossing, the busiest pedestrian crossing in the world. Per traffic-light phase 2,500 to 3,000 people cross the intersection. Next to it stands a very special statue: Hachiko. The Akita dog waited at Shibuya Station every day for nearly ten years after the sudden death of his owner, Professor Ueno. He died in 1935 without ever having given up. The bronze statue commemorates this loyalty and is today one of Tokyo's best-known meeting points.","The Shibuya district, with its glaring lights, reminds one a little of New York, even if the octopus balls and dumplings reminded us again of where we were – in a city of which we still have no idea what makes it up, and which would probably take several weeks to really discover."]}},{id:'tokio-17',country:'Tokio',date:'17.+18. Oktober 2026',images:[{src:'images/jp2-weg.jpg',caption:'Meiji Jingu'},{src:'images/jp2-baum.jpg',caption:'Meiji Jingu'},{src:'images/jp2-schrein.jpg',caption:'Meiji Jingu'},{src:'images/jp2-waschen.jpg',caption:'Reinigung'},{src:'images/jp2-gyukatsu1.jpg',caption:'Gyukatsu'},{src:'images/jp2-gyukatsu2.jpg',caption:'Gyukatsu'},{src:'images/jp2-sky1.jpg',caption:'Sky Tree'},{src:'images/jp2-sky2.jpg',caption:'Sky Tree'},{src:'images/jp2-starbucks.jpg',caption:'Tokio'},{src:'images/jp3-kerstin.jpg',caption:'Gyukatsu'},{src:'images/jp3-gyukatsu3.jpg',caption:'Gyukatsu'},{src:'images/jp3-skytree-tag.jpg',caption:'Sky Tree'},{src:'images/jp3-skytree-nacht.jpg',caption:'Sky Tree'},{src:'images/jp3-auffuehrung.jpg',caption:'Aufführung'},{src:'images/jp3-rikscha.jpg',caption:'Rikscha'}],excerpt:'Am nächsten Vormittag zeigten sich Zentimeter für Zentimeter des neuen Stadtteiles.',body:["Am nächsten Vormittag zeigten sich Zentimeter für Zentimeter des neuen Stadtteiles, als wir schön in der Reihe der Rolltreppe standen. Links sollte man stehen – erst dachten wir, um genug Platz zu lassen, dass jene, die es eiliger hatten, vorbei huschen können. Es wäre aber nicht Japan, wenn es nicht noch eine Regel gäbe: auf der Rolltreppe ja nicht zu laufen.","Vor uns türmten sich die nächsten riesigen, glänzenden Hochhäuser auf. Hochhäuser, die bei uns wahrscheinlich als unglaublich hoch und architektonisch bewundernswert gelten würden. Dort sind sie eine Handvoll der Tausenden riesigen Gebäude, und es dauerte nicht lang, bis diese Art von Gebäuden normal wurde.","Raus aus dem Trubel der Stadt betraten wir das Tor zum Meiji-Jingu-Gyoen-Park. Die Tausenden Touristen verteilten sich gut im angelegten Park. Fleissige Arbeiter sorgten für ein perfektes Erscheinungsbild, sogar der Kies wurde mithilfe eines Besens von Blättern befreit. Nach ein paar Minuten entlang des kühlen, schattigen Weges merkten wir, wie gut es tat, wieder in der Natur zu sein. Riesige Spinnenweben mit bunten Bewohnern spannten sich über den gesamten Weg. Angekommen im Zentrum des extra angelegten Waldes zeigten sich uns die ersten Blicke auf den Meiji-Jingu-Schrein, einen Schinto-Schrein.","Schinto ist die ursprüngliche, originale Religion Japans und tief mit dem Leben dort verbunden. Der Schinto-Glaube hat keinen Gründer, kein heiliges Buch und nicht einmal das Konzept von religiösen Konversionen. Shinto steht für die Harmonie mit der Natur und Tugenden wie Magokoro, was mit ehrlichem Herz übersetzt werden kann. Shintos finden Heiligkeit in den Kamis, dem heiligen Geist, wobei dieser in unzähligen Arten und Formen vorkommt: in der Mythologie, der Natur und den Menschen. Der Schrein wurde dem Kaiser Meiji gewidmet, der von 1852 bis 1912 lebte. Als Japan seine Tore zur Welt öffnete, war er es, der die Initiative zum Knüpfen von Freundschaften mit anderen Ländern ergriff. Ausserdem fand er einen Weg, die westliche Kultur zu adaptieren, ohne die japanische Identität aufzugeben. Seine Frau Shoken unterstützte ihn dabei nicht nur, sondern setzte sich sehr für das nationale Wohl und die Frauenbildung ein. Beide drückten ihre Gedanken über Waka-Gedichte aus, die im Schrein vorliegen.","Nach ihrem Tod entstand durch Spenden von 100.000 Bäumen der Wald mit dem Schrein, der mittlerweile zu einem natürlichen Wald zusammengewachsen ist und viele heimische Pflanzen und Tiere beheimatet.","Hungrig vom vielen Laufen führte uns unser leerer Magen zu einem kleinen Restaurant mit nur neun Sitzplätzen, das genau ein Gericht auf der Karte stehen hatte: Gyukatsu. Rindfleisch mit japanischen Saucen und Beilagen, das auf dem eigenen kleinen Tischgrill auf einem heissen Stein gegrillt werden kann.","Nachdem wir herausgefunden hatten, wie die unterschiedlichen würzigen Saucen und spannenden Beilagen gedacht waren, fanden wir es sehr lecker – quasi die japanische Luxusvariante des Wiener Schnitzels.","Unser Hauptprogrammpunkt, fest eingeplant an dem Tag, war der Besuch des Sky Trees in Tokio. Sky Tree – Himmelsbaum – einen passenderen Namen hätte es für dieses Gebäude wohl kaum geben können. Mit seinen 634 Metern gilt er als der höchste freistehende Turm der Welt und Japans höchstes Gebäude. Dem Eiffelturm ähnlich wurde er so konzipiert, dass er als das erdbebensicherste Gebäude zählt. Witzig ist, dass wir am ersten Tag in Tokio eine Erdbebenwarnung auf unser Handy bekommen haben. Während uns die Meldung nicht sehr erschreckte, hätten die Reaktionen rund um uns nicht unterschiedlicher sein können. Manche Menschen hielten sich sofort an Säulen fest, und eine gewisse Panik war spürbar. Andere schien es wie uns nicht weiter zu beschäftigen. Erst ein paar Stunden später erfuhren wir, dass die Meldung eine Fehlmeldung war und die angegebene Stärke eine 9.9 war – ein Erdbeben in dieser Stärke hätten wir und viele Millionen andere in Tokio vermutlich nicht überlebt.","Innerhalb von 50 Sekunden brachte uns der Aufzug des Sky Trees vom 4. Stock auf 350 Meter, mit einem weiteren Aufzug brachten wir auch noch die restlichen Höhenmeter auf unseren höchsten Punkt auf 450 Metern.","Die Aussicht über die Metropole war sehr eindrücklich, wobei wir bei weitem nicht die Einzigen waren, die diese Idee hatten.","Nach dem Auschecken am nächsten Tag machten wir uns auf den Weg zu einem ganz besonderen Ereignis: jedes Jahr, genau zweimal jährlich, findet im Sensoji-Tempel in Asakusa der Tanz des goldenen Drachen statt. Der Tempel, der älteste in Tokio, trägt den Bergnamen Kinryuzan, Berg des goldenen Drachen. Die Legende besagt, dass einst ein goldener Drache vom Himmel herabstieg, um die Göttin der Barmherzigkeit zu schützen. Seit 1958 wird zu Ehren dieser Geschichte zweimal im Jahr ein achtzehn Meter langer, goldener Drache durch die Strassen und den Tempelhof getragen und getanzt.","Danach machten wir uns mit dem Shinkansen auf den Weg nach Osaka. Der Schnellzug, der mit bis zu 285 Kilometern pro Stunde unterwegs ist, bringt einen in etwa zweieinhalb Stunden von Tokio nach Shin-Osaka. Wir sind gespannt, was uns in der nächsten Stadt erwartet."]},{id:'osaka',country:'Osaka',date:'18.-19. Oktober 2026',excerpt:'Obwohl sich die Grossstädte in einigem sehr ähnlich sind, hat doch jede Stadt für sich ihren ganz eigenen Charme.',body:["Obwohl sich die Grossstädte in einigem sehr ähnlich sind, hat doch jede Stadt für sich ihren ganz eigenen Charme. Angekommen in Osaka, wohlbemerkt mit Zimmer im 33. Stock, beschlossen wir, doch noch eine Runde in der Stadt zu drehen. Gleich um die Ecke fanden wir ein Plätzchen an der Bar eines kleinen Restaurants. Eigentlich hätten wir den zwei jungen Betreibern einfach den ganzen Abend lang zusehen können und wären schon glücklich gewesen. Es schien, als wären wir hier in einem kleinen Paradies des Ikigai gelandet. Ikigai, übersetzt etwa Grund zu leben, bezeichnet das, was dem Leben Sinn und Freude gibt. Es muss nichts Grosses sein, oft ist es die Freude an der eigenen Arbeit, an kleinen Dingen, die den Alltag erfüllen. Die zwei Betreiber hatten während unseres gesamten Aufenthaltes ein Lächeln im Gesicht und das Essen, das sie uns servierten, war eines der besten auf unserer Reise. Vor allem die Gyozas, kleine angebratene Teigtaschen, waren köstlich.","Bei unserem kleinen Verdauungsspaziergang durch die Stadt zeigte sich uns die gesamte Palette: bunte, schrille Automaten- und Gamingläden, der beliebte Cheesecake mit ewig langer Schlange davor und dazwischen ein kleiner Laden mit einigen süssen Welpen und Kätzchen zu verkaufen. Trotz dem Trubel fühlte sich Osaka etwas ruhiger an. Wir fühlten uns wohl.","Gegründet in der Edo-Zeit, 1820, war der Kuromon-Markt, an dem wir am nächsten Morgen hinspazierten, eigentlich die Anlaufstelle für die einheimischen Köche. Mittlerweile ist er auch bei Touristen beliebt und bietet neben Streetfood vor allem frischen Fisch und Meeresfrüchte. Einer der Stände zog dabei vor allem unsere Aufmerksamkeit auf sich: fangfrischer Thunfisch, sortiert nach Fettgehalt im Fleisch, wurde schön portioniert und in einer Kühltheke präsentiert. Wir durften uns von all den Päckchen eines aussuchen, das wir dem Verkäufer reichten. Als wir uns anschliessend verständigen konnten, ob nun Sushi, Nigiri oder Sashimi, wurde der Thunfisch frisch vor unseren Augen aufgeschnitten und verarbeitet. Wir konnten dabei direkt zusehen und anschliessend geniessen. So frisches Sushi werden wir wohl so schnell nicht mehr bekommen.","Wir liessen uns anschliessend noch ein bisschen durch die Stadt treiben, unter anderem durch die drei Kilometer lange überdachte Einkaufsstrasse, und beschlossen dann, den restlichen Tag ruhig anzugehen. Die vielen Eindrücke und Schritte durch die Städte machen doch ganz schön müde. Gut, dass wir direkt im Hotel ein Onsen hatten, das wir geniessen konnten. Ein Onsen ist ein japanisches Thermalbad, das von natürlichen heissen Quellen gespeist wird. Es ist bewusst so konzipiert, dass der Körper und auch der Kopf zur Ruhe kommen können."],images:[{src:'images/osaka-kuromon.jpg',caption:'Kuromon-Markt'},{src:'images/osaka-sushi.jpg',caption:'Thunfisch'},{src:'images/osaka-gyoza.jpg',caption:'Gyoza'},{src:'images/osaka-hamburg.jpg',caption:'Hamburgsteak'},{src:'images/osaka-broccoli.jpg',caption:'Brokkoli'},{src:'images/osaka-matcha.jpg',caption:'Matcha'},{src:'images/osaka-strasse.jpg',caption:'Osaka'},{src:'images/osaka-dotonbori.jpg',caption:'Dotonbori'},{src:'images/osaka-deckel.jpg',caption:'Kanaldeckel'}]},{id:'kyoto',country:'Kyoto',date:'20. Oktober 2026',excerpt:'Frühmorgens am nächsten Tag, als viele Lichter noch dunkel waren, stiegen wir in den Zug Richtung Kyoto ein.',body:["Frühmorgens am nächsten Tag, als viele Lichter noch dunkel waren und im Bahnhof nur die im Anzug gekleideten Businessmenschen mit ihren Aktenkoffern unterwegs waren, stiegen wir in den Zug Richtung Kyoto ein. Kyoto ist eine der geschichtlich und kulturell bedeutendsten Städte Japans.","Wir wollten unbedingt so früh wie möglich beim südlich gelegenen Fushimi-Inari-Schrein sein, um die Massen der Touristen zu vermeiden. Anfang Januar sind es täglich bis zu einer Million Touristen, die den Tempel bestaunen. Am frühen Morgen unseres Besuchs waren zwar schon andere neugierige Besucher da, aber es war noch sehr angenehm. Das Besondere am Tempel sind die roten, grossen Torii-Tore, deren Anzahl uns mächtig staunen liess. Durch mehr als zehntausend Stück kann man auf dem Gelände durchlaufen. Ruhigere Schreine weiter im Wald laden zum Verweilen ein, die Füchse mit roten Kapuzen leuchteten im mystischen Licht zwischen den moosbewachsenen Steinen, ganz abseits der Touristenmassen.","Der nächste Stopp, fest geplant in Kyoto, pünktlich zur Ladenöffnung um 11:30 Uhr war, nicht wie man glauben könnte Sushi oder Ramen, sondern Wagyu-Beef, verarbeitet zu einem saftigen Burger. Es gab sogar Handschuhe zum Essen, aus diesem Grund. Die jungen Ladenbesitzer begrüssten uns fröhlich mit ihrem japanischen Gruss, von dem wir keine Ahnung hatten, was er bedeutet, aber wir fühlten uns sehr willkommen.","Zugegebenermassen waren die vielen spannenden Videos auf Instagram über Japan auf der einen Seite sehr spannend, auf der anderen Seite haben sie unsere Erwartungen aber ziemlich in die Höhe getrieben. Oft ist die Sprache von „der beste Burger, den ich je hatte“ oder „das darfst du nicht verpassen“. Ja, der Burger hat uns super geschmeckt und das junge Team war unglaublich freundlich und gut gelaunt. Der beste Burger, den wir je hatten, war es aber leider doch nicht.","Nach dem Essen spazierten wir noch durch das Geisha-Viertel, das mich persönlich sehr faszinierte. Wunderschöne kleine Holzhütten in einem ganz eigenen Stil erwarteten uns dort. Die Geishas, japanische Unterhaltungskünstlerinnen, bieten hier ihre traditionellen Dienstleistungen an. Alles scheint etwas ruhiger und traditioneller abzulaufen in diesem Viertel.","Zurück am Bahnhof versuchten wir, den Zug in die nahegelegene Stadt Nara zu finden, was ausserhalb der grossen Bahnhöfe gar nicht so leicht war. Nach ein paar unglücklichen Versuchen in die falsche Richtung kamen wir etwas später als geplant in Nara an, wo uns gleich schon ein ganz ungewöhnliches Gesicht empfing. Dunkle, braune, grosse Augen blinzelten uns entgegen und verbeugten sich höflich, ganz in der traditionellen japanischen Manier. Nara, die Stadt der frei herumlaufenden Sikahirsche. Und zwar nicht nur im Park zwischen den Tempeln, sondern auch am städtischen Vorplatz des Bahnhofs, am grasbewachsenen Mittelstreifen der Hauptstrasse und spazierend zwischen den fotografierenden Touristen. Eine Stadt, deren Wahrzeichen mit einer Seelenruhe lebendig herumlaufen, fanden wir schon sehr eindrücklich.","Nach 29997 Schritten am Abend fielen wir nach der Heimreise müde ins Bett und verbeugten uns innerlich nochmal vor den kleinen Geschöpfen, dankbar für einen wunderbaren Tag voller spannender Eindrücke."],images:[{src:'images/kyoto-torii1.jpg',caption:'Fushimi Inari'},{src:'images/kyoto-torii2.jpg',caption:'Fushimi Inari'},{src:'images/kyoto-torii3.jpg',caption:'Fushimi Inari'},{src:'images/kyoto-nacht.jpg',caption:'Fushimi Inari'},{src:'images/kyoto-fuchs1.jpg',caption:'Fuchs'},{src:'images/kyoto-fuchs2.jpg',caption:'Fuchs'},{src:'images/kyoto-fuchs3.jpg',caption:'Fuchsschreine'},{src:'images/kyoto-burger.jpg',caption:'Wagyu-Burger'},{src:'images/kyoto-burger2.jpg',caption:'Wagyu-Burger'},{src:'images/kyoto-geisha1.jpg',caption:'Geisha-Viertel'},{src:'images/kyoto-geisha2.jpg',caption:'Geisha-Viertel'},{src:'images/nara-kerstin.jpg',caption:'Nara'},{src:'images/nara-kerstin2.jpg',caption:'Nara'},{src:'images/nara-stefan.jpg',caption:'Nara'},{src:'images/nara-futter.jpg',caption:'Nara'},{src:'images/nara-lawson.jpg',caption:'Nara'}]},{id:'hiroshima',country:'Hiroshima',date:'21. Oktober 2026',excerpt:'You’re lucky, big brother. Diese Worte lesen wir bedrückt und sprachlos auf einer der vielen Tafeln im Museum.',body:["„You’re lucky, big brother.“ Diese Worte lesen wir bedrückt und sprachlos auf einer der vielen Tafeln im Museum. Es sind die letzten Worte eines 11-jährigen Mädchens, bevor es an den Folgen der Verbrennungen und der radioaktiven Strahlung stirbt. Eines von vielen Schicksalen, eine von vielen Stimmen im Hiroshima Peace Memorial Museum.","Am 6. August 1945 um 8:15 Uhr explodierte die Atombombe „Little Boy“ in etwa 600 Metern Höhe über der Stadt. Allein im Jahr 1945 starben schätzungsweise 140.000 Menschen an den Folgen. Drei Tage später, am 9. August, folgte der Abwurf der zweiten Bombe, „Fat Man“, über Nagasaki, bei dem weitere Zehntausende ums Leben kamen. Die USA wollten mit den beiden Abwürfen Japan zur bedingungslosen Kapitulation zwingen und eine blutige Invasion der japanischen Hauptinseln vermeiden, die nach damaligen Schätzungen Hunderttausende weitere Tote auf beiden Seiten gekostet hätte. Gleichzeitig sollte die neue Waffe ihre zerstörerische Kraft demonstrieren.","Die Geschichten zu lesen, die Bilder zu sehen und zu verstehen, wie es so weit kommen konnte, machte den Besuch zu einem der eindrücklichsten Orte, die wir je gesehen haben. Im Museum herrscht eine bedrückte, fassungslose Stille. Der angelegte Park davor dient als Mahnmal. Die Kuppel des A-Bomb Dome, die mitten in der Stadt im Originalzustand erhalten blieb, überstand den Angriff als eines der wenigen Gebäude. Zwischen den Überresten der einst prunkvollen Häuser und dem Museum brennt eine ewige Flamme. Sie ist ein Zeichen des Friedens und soll erst erlöschen, wenn es keine Atomwaffen mehr auf der Welt gibt.","Ein Schicksal, das uns besonders berührte, war das der kleinen Sadako. In ihrer Schule galt sie als Sonnenschein und hatte vor allem im Sprinten grosses Talent. Sie war die Einzige, die mit den Jungen mithalten konnte, und träumte davon, einmal Sprint-Weltmeisterin zu werden. Glücklicherweise überlebte sie den Angriff als Kleinkind, erkrankte Jahre später jedoch wie viele andere an Leukämie. Im Krankenhaus begann sie, Papierkraniche zu falten, in der Hoffnung, dass 1000 Kraniche einen Wunsch erfüllen. Sie starb 1955 im Alter von nur zwölf Jahren. Ihre Mitschüler sammelten Geld und errichteten das Children’s Peace Monument, das noch immer im Park steht. Es erinnert an all die Kinder, die durch die Tragödie ums Leben kamen, Kinder, die nie erfahren durften, wie es ist, sich das erste Mal zu verlieben, einen Beruf zu finden oder die Welt mit Erwachsenenaugen zu sehen.","Es ist erschreckend, wie ein einziger Knopfdruck so viel Leid anrichten kann, Leid bei Menschen, die in ihrem Leben vermutlich nie etwas verbrochen haben und vielleicht nur davon träumten, einmal Sprint-Weltmeisterin zu werden."],images:[{src:'images/hiro-park.jpg',caption:'Peace Park'},{src:'images/hiro-cenotaph.jpg',caption:'Cenotaph'},{src:'images/hiro-cenotaph-nacht.jpg',caption:'Cenotaph'},{src:'images/hiro-dome.jpg',caption:'A-Bomb Dome'},{src:'images/hiro-dome2.jpg',caption:'A-Bomb Dome'},{src:'images/hiro-dome3.jpg',caption:'A-Bomb Dome'},{src:'images/hiro-dome4.jpg',caption:'A-Bomb Dome'},{src:'images/hiro-dome5.jpg',caption:'A-Bomb Dome'},{src:'images/hiro-fluss.jpg',caption:'A-Bomb Dome'},{src:'images/hiro-flamme.jpg',caption:'Ewige Flamme'},{src:'images/hiro-museum1.jpg',caption:'Museum'},{src:'images/hiro-museum2.jpg',caption:'Museum'},{src:'images/hiro-museum3.jpg',caption:'Museum'},{src:'images/hiro-artefakte.jpg',caption:'Museum'},{src:'images/hiro-quote.jpg',caption:'May Peace Prevail on Earth'}]},{id:'takachiho',country:'Takachiho',date:'22. Oktober 2026',excerpt:'Da der Taifun Champi unsere Pläne buchstäblich durcheinanderwirbelte, machten wir uns schon am nächsten Tag das letzte Mal auf den Weg Richtung Westen.',body:["Da der Taifun Champi unsere Pläne buchstäblich durcheinanderwirbelte, machten wir uns schon am nächsten Tag das letzte Mal auf den Weg Richtung Westen. Pünktlich um 08:00 Uhr morgens sassen wir in einem Reisebus, unser Ziel war drei Stunden entfernt. Das erste Mal die Grossstadt verlassend fuhren wir durch kurvige Strassen und Täler, umgeben von dichtem, fast schon tropisch erscheinenden Wäldern. Mit jedem Meter weiter weg von der Stadt wurde es ruhiger und wir durften eine andere, sehr viel ländlichere Umgebung Japans kennenlernen. Immernoch waren die Häuschen, auch in ärmeren, einfacheren Verhältnissen, säuberlich gepflegt und ordentlich.","Nach einiger Zeit kamen wir bei unserem heutigen Ziel an. Angekommen beim Takachiho machten wir uns im Anbetracht der Zeit zügig auf zum Bootsverleih, auf die umliegende Natur konnten wir nur kurze Blicke im Vorbeilaufen erhaschen. Ein freundlicher Singaporese teilte sein Boot mit uns und erzählte, dass er ein- bis zweimal pro Jahr nach Japan käme, um Urlaub zu machen und Kleidung zu kaufen. Japanisch spricht er fliessend, allein durch das Anschauen von japanischen Animes.","Die Natur war wunderschön. Bilder sprechen vermutlich mehr als all unsere Worte, obwohl sie auch nur einen Bruchteil dessen sind, wie es in Wirklichkeit aussieht. Beim Heimfahren beschlossen wir, dass es nach der intensiven, vollen Woche Zeit war, auch ein bisschen herunterzukommen und zu entspannen, eine Idee, die uns an einen ganz besonderen Ort brachte."],images:[{src:'images/taka-bruecke1.jpg',caption:'Takachiho'},{src:'images/taka-boot1.jpg',caption:'Bootsverleih'},{src:'images/taka-stefan.jpg',caption:'Takachiho-Schlucht'},{src:'images/taka-schlucht1.jpg',caption:'Takachiho-Schlucht'},{src:'images/taka-wasserfall1.jpg',caption:'Wasserfall'},{src:'images/taka-wasserfall2.jpg',caption:'Wasserfall'},{src:'images/taka-kerstin.jpg',caption:'Takachiho-Schlucht'},{src:'images/taka-beide.jpg',caption:'Takachiho-Schlucht'},{src:'images/taka-zug.jpg',caption:'Zug'},{src:'images/taka-torii.jpg',caption:'Schrein'},{src:'images/taka-bruecke2.jpg',caption:'Brücke'}]},{id:'toi',country:'Toi',date:'23.-26. Oktober 2026',excerpt:'Am nächsten Abend, kurz vor dem Abendessen, checkten wir das erste Mal in unserem Leben in einem Ryokan ein.',body:["Am nächsten Abend, kurz vor dem Abendessen, checkten wir das erste Mal in unserem Leben in einem Ryokan ein. Ausser uns waren vor allem Japaner im Hotel und liefen in kleinen Schritten, schon in ihrem Yukata gekleidet, an uns vorbei. Der Empfang war sehr freundlich, auch wenn ohne Übersetzer nicht viel funktionieren würde. Zehn Minuten später trafen wir schon im Speisesaal ein, unsere erste Kaiseki-Erfahrung. Kaiseki ist ein traditionelles japanisches Mehrgängemenü, das oft in Ryokans serviert wird. Es besteht aus vielen kleinen, kunstvoll angerichteten Gängen, die die Jahreszeit widerspiegeln und sowohl Auge als auch Gaumen verwöhnen.","Vor uns auf dem Tisch erwarteten uns unter einem Papiertuch schon wunderschöne, kunstvoll angerichtete Häppchen. Neben der Getränkebar gab es eine Reis-Bar mit Suppen und Toppings. Während wir am Essen waren, wurden uns weitere Schälchen serviert, unter anderem frisches Tempura, im Teig frittierter Fisch und Gemüse. Am Anfang war es ganz schön überfordernd, zu verstehen, was nun zusammengehört, im Hinterkopf die Knigge der japanischen Kulinarik. Fischliebhaber kommen hier auf alle Fälle auf ihre Kosten und wir werden es als eine sehr spannende kulinarische Erfahrung in Erinnerung behalten.","Das Frühstück im japanischen Stil war zwar auch spannend, frischen Fisch auf dem Tischgrill am Morgen war dann aber doch auch sehr gewöhnungsbedürftig. Ein weiterer Punkt, der ein Ryokan ausmacht, ist meist das Onsen. Bei uns gab es neben den öffentlichen auch private Onsen, die man reservieren konnte.","Im Zimmer gab es klassische Futonbetten, auf denen wir besser schliefen als erwartet, ein riesiges Zimmer mit einem Teetisch, einem Balkon und einem kleinen Bereich mit zwei Stühlen davor, wo man dem Rauschen des Meeres lauschen konnte und den Fischern direkt beim Ablegen der kleinen Boote zusehen konnte. Der Ort fühlte sich so viel ruhiger an und wir hatten das Gefühl, ziemlich nah an dem zu sein, wie die Japaner selbst Urlaub machen, und sind dankbar für den authentischeren Einblick."],images:[{src:'images/toi-zimmer.jpg',caption:'Ryokan-Zimmer'},{src:'images/toi-stefan-fenster.jpg',caption:'Yukata'},{src:'images/toi-onsen.jpg',caption:'Privates Onsen'},{src:'images/toi-kerstin.jpg',caption:'Kaiseki'},{src:'images/toi-stefan.jpg',caption:'Kaiseki'},{src:'images/toi-kaiseki1.jpg',caption:'Kaiseki'},{src:'images/toi-kaiseki2.jpg',caption:'Kaiseki'},{src:'images/toi-sashimi1.jpg',caption:'Kaiseki'},{src:'images/toi-sashimi2.jpg',caption:'Kaiseki'},{src:'images/toi-hotpot.jpg',caption:'Kaiseki'},{src:'images/toi-schnecken.jpg',caption:'Kaiseki'},{src:'images/toi-gericht.jpg',caption:'Kaiseki'},{src:'images/toi-slippers.jpg',caption:'Toiletten-Slippers'}]},{id:'tokyo-26',country:'Tokio',date:'26.-27. Oktober 2026',excerpt:'Ein letztes Mal fuhren wir mit dem Shinkansen zurück in die Metropole.',body:["Ein letztes Mal fuhren wir mit dem Shinkansen zurück in die Metropole. Angekommen in Asakusa, einem Viertel, das noch sehr traditionell ist, checkten wir in unser Hotel ein. Ganz normal auf Booking gebucht, sollte uns wohl auch diese authentische Erfahrung in Japan nicht entgehen. Beim Eingang in den engen, mit dunklem Holz verkleideten Rezeptionsbereich blickte uns eine Dame entgegen, die wider unserer Erwartungen sehr gut Englisch sprach. Zu unserer linken fand sich ein grosser Automat, auf dem einzelne Zimmer abgebildet waren. Mit nur einem Klick konnte man sich einbuchen – und zwar nicht nur für eine Nacht, sondern auch für eine Stunde. Wir sind in einem sogenannten Love Hotel gelandet. Unsere Köpfe zählten sofort eins und eins zusammen und wir dachten, in einer Unterkunft für kurzfristige Vergnügen gelandet zu sein.","Dabei erfüllen die Love Hotels eine wichtige Rolle in der japanischen Gesellschaft. Gerade junge Paare nutzen sie gerne, um in ihrer Beziehung etwas Privatsphäre zu haben. Aufgrund der hohen Lebenshaltungskosten sind sie oft gezwungen, bis zur Heirat bei ihren Eltern zu leben. Wegen der Hellhörigkeit vieler Wohnungen bieten die Love Hotels für sie – als auch für Ehepaare, bei denen beispielsweise noch die Schwiegereltern wohnen – einen guten Zufluchtsort. Immer mehr Touristinnen buchen sich die Unterkunft – aus mehreren Gründen. Einerseits sind die Zimmer – wie unseres auch – für Tokyos Hotels riesig, oft sind sie nach einem bestimmten Thema gestaltet. Den riesigen Whirlpool und den Balkon mit direkter Aussicht zum Skytree möchten wir auf alle Fälle nicht missen. Fast am Ende unserer Zeit in Japan angekommen, wollten wir noch in ein kulturelles Erbe Japans eintauchen und besuchten eine Teezeremonie. Unsere Gastgeberin sprach perfektes Englisch mit britischem Akzent – das Ergebnis vieler Jahre in London. Die Kunst der Teezeremonie wurde in ihrer Familie seit vielen Generationen praktiziert.","27. Oktober – unser längster Tag beginnt mit einem etwas zu früh klingelnden Wecker. Einmal quer durch die Stadt brachte uns der überfüllte, aber kuschelige Bus zum teamLab Planets. 2018 eröffneten das Künstlerkollektiv teamLab und der E-Commerce-Riese DMM.com das interaktive Kunstmuseum. In vier Räumen kann man digitale Kunst nicht nur ansehen, sondern interaktiv miterleben und mitgestalten. Fasziniert haben uns dabei vor allem zwei Räume. Im Garten, einem der vier Abteile des Museums, waren tausende von lebenden Orchideen aufgehängt. Mit Seilzügen und Bewegungskameras versehen hoben sie sich an, sobald man in die Nähe kam, und aus dem Nichts entstand ein Weg durch die blühenden Pflanzen. Weiter gehend durch knietiefes Wasser mit abwechselnden künstlerischen Effekten landeten wir im Kristalluniversum – die Illusion der Unendlichkeit. 60.000 Lichtstangen umgaben uns, der Boden und die Wände waren verspiegelt, mit dem Handy konnten Planeten in das Labyrinth projiziert werden, umrandet von ruhiger Musik. Diese zwei Räume allein machten unseren Besuch wert, und das frühe Aufstehen am Morgen machte sich durch die geringe Anzahl der Besucher definitiv bezahlt. Ein letztes Mal noch bestellten wir uns beim Ramenrestaurant die beliebte Nudelsuppe, bevor wir uns auf den Weg zum Flughafen machten.","Angekommen am Gate beobachteten wir die Boardings der früheren Flüge, wobei uns zwei der Crew ganz besonders auffielen – mit einer Waage liefen sie durch die Passagierreihen und wogen jeden einzelnen Koffer ab. Unsere Füsse wippten schon unruhig und wir befürchteten, dass dies die Standardprozedur am Flughafen in Japan ist – was uns nach zwei Wochen des Kennenlernens der unzähligen Regeln tatsächlich wenig wunderte. Wir wussten genau, dass unsere Koffer plus Rucksäcke die erlaubten 7 kg (gesamt) weit überschritten und waren schon froh, dass wir in Thailand nicht kontrolliert wurden. Jedes abgewogene Gepäckstück wurde mit einem grünen Band versehen und so freigegeben. Als die Zeit voranschritt, zogen wir möglichst viele Jacken und Pullover an und warteten wie zwei Eskimos am Gate. Wir zählten nur noch die Minuten, bis die zwei Kontrolleure auch zu uns kamen. Durch ein Wunder aber standen wir schlussendlich an der Boardingkontrolle – als einzige ohne grüne Bänder am Gepäck, nahmen unseren Rucksack auf eine Schulter, um es lässig und leicht aussehen zu lassen, und schafften es tatsächlich ohne Hindernisse durch das Boarding. Erleichtert liessen wir uns in unsere Sitze fallen und flogen um 19:00 Uhr los Richtung Hawaii, um am nächsten Morgen, besser gesagt am selben Morgen, dem 27. Oktober um 07:00 Uhr zu landen."],images:[{src:'images/tokyo26-skytree.jpg',caption:'Skytree'},{src:'images/tokyo26-wasser.jpg',caption:'teamLab Planets'},{src:'images/tokyo26-planets.jpg',caption:'teamLab Planets'},{src:'images/tokyo26-orchidee1.jpg',caption:'Orchideen'},{src:'images/tokyo26-orchidee2.jpg',caption:'Orchideen'},{src:'images/tokyo26-garten.jpg',caption:'Orchideengarten'},{src:'images/tokyo26-kristall.jpg',caption:'Kristalluniversum'},{src:'images/tokyo26-tee1.jpg',caption:'Teezeremonie'},{src:'images/tokyo26-tee3.jpg',caption:'Teezeremonie'},{src:'images/tokyo26-tee2.jpg',caption:'Teezeremonie'},{src:'images/tokyo26-suess.jpg',caption:'Teezeremonie'},{src:'images/tokyo26-beide.jpg',caption:'Teezeremonie'}]}]},{id:'hawaii',country:'Hawaii',date:'27. Oktober 2026',places:[{id:'honolulu',country:'Honolulu',date:'27.-28. Oktober 2026',excerpt:'Beim ersten Biss in unser Sauerteigbrot schauten wir uns zufrieden grinsend an – Aloha Hawaii!',body:["Beim ersten Biss in unser Sauerteigbrot, belegt mit frischer Avocado, Feta, Rucola und einem perfekt gekochten Over-Easy-Ei schauten wir uns zufrieden grinsend an – Aloha Hawaii! Auch wenn wir in den ersten fünf Minuten unserer Busfahrt mehr Obdachlose sahen als in ganz Japan, fühlten wir uns wohl – und auch ein bisschen erleichtert, nicht mehr an so viele Regeln und Vorschriften gebunden zu sein. Unser Hostel war ganz in der Nähe des Strandes und da unser Tag schon ziemlich lang war, verbrachten wir die ersten Stunden dösend auf der Dachterrasse in der Hängematte. Zwischen den Palmen, dem wunderschönen Strand und den sympathischen Einheimischen mit ihrer entspannten Mentalität fühlten wir uns super wohl. Staunend beobachteten wir die hunderten Surfer, die zum Teil so souverän auf den Wellen des Pazifiks ritten. Manhattan des Pazifiks wird Honolulu auch genannt, und das Gefühl, das die Stadt vermittelt, könnte zu Tokio nicht gegensätzlicher sein."],images:[{src:'images/honolulu-aloha.jpg',caption:'Welcome Aloha'},{src:'images/honolulu-strand.jpg',caption:'Strand'},{src:'images/honolulu-waikiki.jpg',caption:'Waikiki'},{src:'images/honolulu-oahu.jpg',caption:'Oahu'},{src:'images/honolulu-gandhi.jpg',caption:'Gandhi-Statue'}],video:'images/honolulu-hula.mp4'},{id:'oahu',country:'Oahu Island',date:'29. Oktober 2026',excerpt:'Früh am Morgen steigen wir in das erste Schiff des Tages zum USS Arizona Memorial.',body:["Oahu Island ist eine der fünf grossen hawaiianischen Inseln und erstreckt sich über nur 64 Kilometer in der Länge und 42 Kilometer in der Breite im Pazifischen Ozean. Das nächste Festland und die übrigen Staaten der USA sind 3200 bis 3800 Kilometer entfernt, ostwärts nach Japan sind es sogar 6400 Kilometer.","Unser Tag startet mit einem Ort, der beim Besuch der Insel für uns zumindest nicht wegzudenken ist. Früh am Morgen steigen wir in das erste Schiff des Tages, das uns einige hundert Meter zum USS Arizona Memorial bringt. Das Denkmal wurde direkt über dem Wrack des versunkenen Kriegsschiffes errichtet. Besonders eindrücklich war der Besuch deshalb, weil wir erst eine Woche davor in Hiroshima waren. Hiroshima, der endgültige Gegenangriff der USA auf den Angriff der Japaner auf den amerikanischen Hafen. Am 7. Dezember 1941 griffen japanische Kampfflugzeuge Pearl Harbor an und versenkten unter anderem die USS Arizona, bei der 1177 Menschen ums Leben kamen. Der Angriff führte zum Eintritt der USA in den Zweiten Weltkrieg. Etwas schade war, dass aufgrund des Sturmes am Vortag das Wasser sehr trüb war und wir nicht bis auf den Grund des Schiffes sahen. Die komplexen Zusammenhänge der Gegebenheiten zu verstehen, die zum Angriff auf Pearl Harbor und schlussendlich zum Atombombenabwurf in Hiroshima und Nagasaki führten, sind an einem Vormittag wohl unmöglich zu erfassen. Das Museum war jedoch sehr spannend und konnte einige Wissenslücken füllen.","Weil die USA nicht für das beste Netz des öffentlichen Verkehrs bekannt sind, das auf einer kleinen Insel wohl auch schwer umzusetzen wäre, und wir vorhatten, die Insel auf eigene Faust zu erkunden, mieteten wir für den Rest des Tages ein Auto und machten uns auf den Weg in den Norden. Die Umgebung wurde schnell ländlicher und die Strasse schlängelte sich über alte Brücken und wilde Pflanzen. Nach nur einer halben Stunde erstreckten sich auf unserer linken und rechten Seite Felder mit einer bestimmten Frucht, so weit das Auge reichte. Bald kamen wir bei der Dole-Ananasfarm an. Ihr Ursprung geht zurück in das Jahr 1901, als der Amerikaner James Dole das Unternehmen gründete. Heute ist die Dole-Farm einer der bekanntesten Touristen-Hotspots und bietet neben dem bekannten Dole-Softeis eine 20-minütige Zugfahrt und das grösste Pflanzenlabyrinth der Welt. Das Eis mit Ananas war ganz gut – als wir erfuhren, dass die Ananas ursprünglich gar keine heimische Pflanze in Hawaii war, sondern um 1700 aus Südamerika importiert wurde, tat dem ganzen Erlebnis schon ein kleiner Abbruch.","Gestärkt führte uns unsere Route ganz hoch in den Norden. Besonders bekannt ist er für den 18 Kilometer langen Küstenabschnitt, an dem sich jeden Winter die Profisurfer der Welt versammeln, um sich den grössten Wellen des Planeten zu stellen. Die Hauptsaison startet dabei im November, wir sahen trotz kleineren Wellen staunend den Surfern auf dem Meer zu. Über kurvige Strassen direkt zwischen dem weiten Ozean zur linken und faszinierender Berglandschaft zur rechten fuhren wir an der Ostküste wieder Richtung Süden. Immer wieder blieben wir stehen, um die unglaubliche Natur zu bewundern, wie die fast senkrecht abfallenden grünen Felswände, in denen Jurassic Park, 50 First Dates und über 200 weitere Filme und Serien gedreht wurden. Dabei bildet dieser Teil der Insel ein komplettes Gegenteil zum geschäftigen, lebendigen Strandteil in Waikiki.","Das Heimfahren durch ein bewaldetes Tal fühlte sich an, als wären wir komplett vom Stadtleben abgeschnitten – mitten durch das dschungelartige Grün ragten links und rechts von uns riesige begrünte Felswände nach oben, dazwischen immer wieder wunderschöne Wasserfälle. Die Dämmerung brach langsam ein und der Tag fand seinen Abschluss in einer typischen amerikanischen Fast-Food-Kette, Chick-fil-A, die vor allem für ihre Hühnersandwiches und Waffelpommes bekannt ist."],images:[{src:'images/oahu-arizona.jpg',caption:'USS Arizona Memorial'},{src:'images/oahu-wrack.jpg',caption:'USS Arizona'},{src:'images/oahu-modell.jpg',caption:'Modell'},{src:'images/oahu-ananas.jpg',caption:'Dole Ananasfarm'},{src:'images/oahu-palme.jpg',caption:'Nordküste'},{src:'images/oahu-strand.jpg',caption:'Nordküste'},{src:'images/oahu-welle.jpg',caption:'Nordküste'},{src:'images/oahu-felsbogen.jpg',caption:'Felsbogen'},{src:'images/oahu-natur.jpg',caption:'Ostküste'},{src:'images/oahu-strasse.jpg',caption:'Ostküste'},{src:'images/oahu-bruecke.jpg',caption:'Brücke'},{src:'images/oahu-wurm.jpg',caption:'Regenwurm'},{src:'images/oahu-mural.jpg',caption:'Waikiki'},{src:'images/oahu-dolegebaeude.jpg',caption:'Dole Plantation'},{src:'images/oahu-doleeis.jpg',caption:'Dole Softie'},{src:'images/oahu-beachbus.jpg',caption:'Beach Bus'},{src:'images/oahu-shrimp.jpg',caption:'Garlic Shrimp'},{src:'images/oahu-mann.jpg',caption:'Nordküste'}]},{id:'honolulu-30',country:'Honolulu',date:'30. Oktober 2026',excerpt:'Um 05:20 reisst uns der Wecker etwas früh aus dem Schlaf.',body:["Um 05:20 reisst uns der Wecker etwas früh aus dem Schlaf. Einen Kaffee später, immer noch im Dunkeln, fahren wir mit dem Mietauto Richtung Osten. Schon bald lassen wir die Hochhäuser am Waikiki-Strand hinter uns und erreichen eine Viertelstunde später durch einen einspurigen, 200 Meter langen Tunnel den Parkplatz – mitten in einem Vulkankrater mit 1,2 Kilometern Durchmesser. Der Diamond Head (auf Hawaiianisch Leahi) ist das Wahrzeichen von Honolulu und erhebt sich am östlichen Rand des Waikiki-Strandes 232 Meter in die Höhe.","Die Wege vom Parkplatz zum Gipfel sind gut ausgebaut und führen uns sogar durch rostige Wendeltreppen im Berg – ein Überbleibsel der militärischen Geschichte des Kraters. Für gerade einmal 3300 Dollar kaufte das amerikanische Militär das Areal Anfang des 20. Jahrhunderts und baute es zur ersten Küstenverteidigungsanlage der USA aus, die bis 1950 besetzt blieb. Besonders der Sonnenaufgang ist auf dem Diamond Head bei Touristen beliebt, deshalb bahnen wir uns den Weg vorbei an den langsameren Schlangen. Die Aussicht über ganz Honolulu, getaucht in die Morgendämmerung auf der einen Seite, den weniger bewohnten Südosten der Insel auf der anderen und die unendlichen Weiten des Pazifiks dazwischen, war das frühe Aufstehen definitiv wert.","Wieder im Auto fahren wir weiter nach Osten, vorbei an alten Leuchttürmen und malerischen Landschaften. Richtung Landesinneres erreichen wir den Nuuanu Pali Aussichtspunkt, der auf den Klippen der Koolau-Berge thront. Die zackigen Berggipfel erstrecken sich mächtig über das Land und bi
