  <script>

    function L(s, key){ return (lang==='en' && s.en && s.en[key]) ? s.en[key] : s[key]; }
    const stories = [
      {id:'willkommen', country:'Schön, dass du da bist', date:'7. Oktober 2026', en:{country:'Nice to have you here', date:'7 October 2026', excerpt:'The countdown is on. In one day we start our big journey.', body:['The countdown is on. In one day we start our big journey. The suitcases are almost packed, the fridge is empty, and the plants are in good hands.','For us these are many firsts – the first time in Asia, for me the first time travelling outside the school holidays, the first time around the world.','I am curious which facets of ourselves we may discover – through so many mirrors in different cultures. I look forward to diving into entirely different worlds and finally noticing, in a different way, what is really important to us in our lives. Soon the lights go out here, and tomorrow afternoon we will already be on the plane to Bangkok.','“Travel makes you speechless and then turns you into a storyteller.” — Ibn Battuta']}, excerpt:'Bald ist es so weit. In einem Tag starten wir unsere grosse Reise.', body:['Bald ist es so weit. In einem Tag starten wir unsere grosse Reise. Die Koffer sind fast gepackt, der Kühlschrank ist leer, und die Pflanzen in gute Obhut gegeben.','Für uns sind es viele erste Male – das erste Mal Asien, für mich das erste Mal Reisen ausserhalb der Schulferien, das erste Mal um die Welt.','So bin ich gespannt, welche Facetten wir an uns selbst neu entdecken dürfen – durch so viele Spiegel in unterschiedlichen Kulturen. Ich freue mich darauf, in ganz andere Welten einzutauchen und schlussendlich auf eine andere Art zu merken, was uns in unserem Leben wirklich wichtig ist. Bald geht das Licht hier aus, und morgen Nachmittag sitzen wir schon im Flieger nach Bangkok.'], quote:'Reisen lässt dich sprachlos und verwandelt dich dann in einen Geschichtenerzähler.', quoteBy:'Ibn Battuta'},
      {id:'thailand', country:'Thailand', date:'9. Oktober 2026', en:{country:'Thailand', date:'9 October 2026'}, places:[
        {id:'bangkok', country:'Bangkok', date:'9. Oktober 2026', en:{country:'Bangkok', date:'9 October 2026', excerpt:'As we stepped out of the airport a wall of hot, thick, slightly sticky air hit us.', body:['As we stepped out of the airport a wall of hot, thick, slightly sticky air hit us. It is 6:30 in the morning and 28 degrees. Welcome to Bangkok.','Since we could not check into our hotel until the afternoon, we decided to visit Wat Pho, the largest of the city\'s 400 temple complexes.','\"Bangkok – where Buddhas are not just decoration.\" We spotted this sign on our way into the city. That there was something to it became clear within the first few minutes inside the temple grounds. Around 1,000 Buddha statues have their home there, and the most famous of them is a very special one.','The reclining Buddha, stretching 46 metres long and 15 metres high through an entire hall built just for him, was deeply impressive. Almost even more, though, we loved the beautiful Buddhist wall paintings of the assembly hall.','Inside the hall we kept hearing a clinking sound. A little later we saw where it came from: 108 alms bowls line the back of the Buddha, and filling each one with coins is said to bring good luck.','Another part of the temple complex is the Wat Pho Medical and Massage School, where the Wat Pho massage is offered. The technique is deeply woven into the origins of Thailand and is now part of the UNESCO cultural heritage.','Since we had both been looking forward to the massages in Thailand, we treated ourselves to one. We felt in good (and strong ;-)) hands.','After the temple we immersed ourselves in the everyday life of the Thais: temples between street food, tuk-tuks, markets and canals. One thing stood out: the gap between the golden, restored temples and the everyday reality of the people living right next to them was immense. In the city there is often a biting smell – probably a mix of the heavy air pollution and the still poorly developed sewage system. Despite the poverty, most Thais have by no means lost their laughter and their helpful nature.','In every corner stood authentic mamas cooking Pad Thai and other delicacies. What we tried was mostly delicious – though we did not dare the maggots, snakes and scorpions.','For the ride back to the hotel we chose a tuk-tuk. Tuk-tuks are three-wheeled, moped-like rickshaws used for transport and as taxis. The driver first wanted 400 baht for the ride, about 10 euros. We did not take it. He then offered the ride for 100 baht if we chose a certain route with included \"sights\". A good deal, we thought, not knowing that the sights included temples with vendors and Thai Fashion. Thai Fashion refers to the countless small shops where custom-made suits are offered. Some time later we arrived, without a suit, tired in our room.','In the afternoon we decided to choose a different means of transport, away from the rather pushy vendors of the city. On the largest river, the Chao Phraya, water buses take mainly tourists from A to B. On the Blue Line we rode south towards the business district, where we could dive into a completely different version of Thailand. We got off at Iconsiam, a luxury shopping and lifestyle centre with impressive architecture. Besides Gucci and Prada we found a huge food market in the basement with countless stalls. Meat skewers, dumplings, seafood and sticky rice shared the space with countless other dishes and the famous \"stink fruit\" durian. In the middle of the hustle between all the food stalls and thousands of people, as if it were the most normal thing in the world, a wedding ceremony took place on an ordinary Friday afternoon.','On our way back we made a small detour via the famous Khao San Road. The party street is especially popular with backpackers, but it was a bit too loud for us. We chose street food in a side street. After a 5-euro foot massage on the way back we then fell tired and exhausted into bed.']}, images:[{src:'images/watpho-spires.jpg',caption:'Wat Pho'},{src:'images/watpho-buddhas.jpg',caption:'Wat Pho'},{src:'images/watpho-hall.jpg',caption:'Wat Pho'},{src:'images/watpho-reclining.jpg',caption:'Wat Pho'},{src:'images/watpho-laughing.jpg',caption:'Wat Pho'},{src:'images/tuktuk.jpg',caption:'Tuktuk'},{src:'images/chao-phraya.jpg',caption:'Chao Phraya'},{src:'images/chao-phraya-2.jpg',caption:'Chao Phraya'},{src:'images/khaosan.jpg',caption:'Khao San'},{src:'images/streetfood.jpg',caption:'Streetfood'},{src:'images/thai-tea.jpg',caption:'Thai Tea'},{src:'images/pad-thai.jpg',caption:'Pad Thai'}], body:['Beim ersten Schritt aus dem Flughafen wehte uns eine Wand aus heissem, dickem, etwas stickigem Wind entgegen. Es ist 06:30 Uhr bei 28 Grad Celsius. Willkommen in Bangkok.','Da wir erst am Nachmittag in unser Hotel einchecken konnten, beschlossen wir, uns den Wat Pho anzusehen, die gr\u00f6sste der 400 Tempelanlagen der Stadt.','\u201eBangkok \u2013 where Buddhas are not just decoration.\u201c Dieses Werbeschild entdeckten wir auf unserer Fahrt in die Stadt. Dass da wohl etwas dran ist, sahen wir schon in den ersten paar Minuten in der Tempelanlage. Etwa 1000 Buddha-Statuen finden dort ihr Zuhause, wobei der bekannteste von allen ein ganz besonderer ist.','Der liegende Buddha, der sich mit 46 Metern L\u00e4nge und 15 Metern H\u00f6he durch den ganzen extra gebauten Viharn erstreckt, war sehr eindr\u00fccklich. Fast noch mehr hat uns jedoch die wundersch\u00f6ne buddhistische Wandbemalung der Versammlungshalle gefallen.','In der Halle war w\u00e4hrend der Besichtigung immer wieder ein Geklimper zu h\u00f6ren. Etwas sp\u00e4ter sahen wir auch, woher es kam: 108 Almosenschalen befinden sich auf der R\u00fcckseite des Buddhas. Jede einzelne mit Kleingeld zu f\u00fcllen soll Gl\u00fcck bringen.','Ein weiterer Teil der Tempelanlage ist die Wat Pho Medical and Massage School, wo die Wat-Pho-Massage angeboten wird. Die Massagetechnik ist tief mit der Entstehung Thailands verwoben und z\u00e4hlt heute zum UNESCO-Kulturerbe.','Da wir uns beide schon auf die Massagen in Thailand gefreut hatten, fanden wir uns wenig sp\u00e4ter gespannt in der Massagehalle ein, in der wir freundlich begr\u00fcsst wurden. Ausgestattet mit eigener Massagebekleidung, bestehend aus einem leinenartigen Hemd und einer Wickelhose, liessen wir uns in der n\u00e4chsten Stunde wortw\u00f6rtlich durchkneten und f\u00fchlten uns in guten und kr\u00e4ftigen H\u00e4nden.','Nach dem Besuch im Tempel tauchten wir in das Stadtleben der Thail\u00e4nder ein: Tempel zwischen Streetfood, Tuktuks, M\u00e4rkten und Kan\u00e4len. Eines fiel uns dabei besonders auf: Die Diskrepanz zwischen den goldenen, aufbereiteten Tempeln und der direkt danebenliegenden Lebensrealit\u00e4t der Bewohner war immens. In der Stadt liegt oft ein beissender Geruch in der Luft, wohl eine Mischung aus der enormen Luftverschmutzung und der noch nicht gut ausgebauten Abwasserentsorgung. Trotz der Armut haben die meisten Thais ihr Lachen und ihre hilfsbereite Art noch keineswegs verloren.','In jeder Ecke standen authentische Mammas, die Pad Thai und andere K\u00f6stlichkeiten kochten. Was wir probierten, war meist lecker, wobei wir uns an Maden, Schlangen und Skorpione nicht herangewagt haben.','F\u00fcr die Heimfahrt zum Hotel entschieden wir uns f\u00fcr eine Tuktuk-Fahrt. Tuktuks sind dreir\u00e4drige, moped\u00e4hnliche Rikschas, die zum Transport und als Taxi genutzt werden. Der Fahrer wollte uns die Fahrt zuerst f\u00fcr 400 Baht verkaufen, das sind etwa 10 Euro. Wir stiegen darauf nicht ein. Daraufhin bot er uns die Fahrt f\u00fcr 100 Baht an, wenn wir eine bestimmte Route mit inkludierten \u201eSehensw\u00fcrdigkeiten\u201c w\u00e4hlen w\u00fcrden. Ein guter Deal, dachten wir, nicht wissend, dass die Sehensw\u00fcrdigkeiten Tempel mit Verk\u00e4ufern und Thai Fashion beinhalteten. Thai Fashion bezeichnet dabei die unz\u00e4hligen kleinen Gesch\u00e4fte, in denen massgeschneiderte Anz\u00fcge angeboten werden. Einige Zeit sp\u00e4ter kamen wir dann ohne Anzug m\u00fcde in unserem Zimmer an.','Am Nachmittag beschlossen wir, ein anderes Transportmittel zu w\u00e4hlen, abseits der doch aufdringlichen Verk\u00e4ufer der Stadt. Auf dem gr\u00f6ssten Fluss, dem Chao Phraya, bringen Wasserbusse vor allem Touristen von A nach B. Mit der Blue Line fuhren wir s\u00fcdw\u00e4rts in Richtung Business-Viertel, wo wir in eine komplett andere Version von Thailand eintauchen konnten.','Wir stiegen beim Iconsiam aus, einem Luxus-Einkaufs- und Lifestyle-Zentrum mit beeindruckender Architektur. Neben Gucci und Prada fanden wir im Untergeschoss einen riesigen Foodmarket mit unz\u00e4hligen St\u00e4nden. Fleischspiesse, Dumplings, Meeresfr\u00fcchte und Sticky Rice teilten sich den Platz mit unz\u00e4hligen anderen Gerichten und der ber\u00fchmten Stinkfrucht Durian. Mitten im Trubel zwischen all den Foodst\u00e4nden und Tausenden Menschen fand, als w\u00e4re es das Normalste der Welt, an einem gew\u00f6hnlichen Freitagnachmittag eine Hochzeitszeremonie statt.','Auf unserem Heimweg machten wir noch einen kleinen Umweg \u00fcber die ber\u00fchmte Khao-San-Strasse. Die Partystrasse ist vor allem bei Backpackern beliebt, war uns jedoch etwas zu laut. Wir entschieden uns f\u00fcr Streetfood in der Nebenstrasse. Nach einer Fussmassage f\u00fcr 5 Euro auf dem Heimweg fielen wir anschliessend m\u00fcde und ersch\u00f6pft ins Bett.']},
        {id:'bangkok-10', country:'Bangkok', date:'10. Oktober 2026', en:{country:'Bangkok', date:'10 October 2026', excerpt:'Well rested, we headed back towards the water bus, this time northwards.', body:['Well rested, we headed back towards the water bus, this time northwards. Our destination today was one of the largest open-air markets in the world. On the 15,000 stalls of Chatuchak Market there is definitely something for everyone – whether affordable clothing, art, furniture, animals or the extensive culinary offerings, the selection is huge.','A well-deserved break was slurping a chilled coconut, freshly split open with a machete before our eyes. After our probably somewhat clumsy attempts to scrape out the flesh with a plastic spoon, a Thai shop owner from another stall came to our help and, with a smile, pressed a tablespoon into our hands. Hospitality that we encountered again and again on our journey in Thailand.','In the afternoon we strolled through the Chatuchak Park right next door. The idyllic oasis, with its high-rises visible on the horizon, reminds one a little of Central Park in New York. Step by step it became quieter and the market bustle and city traffic faded into the background.','Well-stocked banana trees and bamboo shrubs were planted around the gentle streams and the lake, and between them scurried busy squirrels and all kinds of birds.','Back at the market the locals were just preparing for the evening tourism – as if from nowhere, countless new street-food stalls appeared on the streets. We slowly made our way towards the airport – out of the lively metropolis, towards the smaller city of Chiang Mai in the north. We are curious what awaits us among the mountain peoples of the Karen, the elephant sanctuaries and the jungle.']}, excerpt:'Ausgeschlafen starteten wir wieder Richtung Wasserbus, dieses Mal jedoch nordw\u00e4rts.', images:[{src:'images/chatuchak-park.jpg',caption:'Chatuchak Park'},{src:'images/chatuchak-skyline.jpg',caption:'Chatuchak Park'},{src:'images/chatuchak-bamboo.jpg',caption:'Chatuchak Park'},{src:'images/chatuchak-bamboo-2.jpg',caption:'Chatuchak Park'},{src:'images/chatuchak-art.jpg',caption:'Chatuchak'},{src:'images/streetfood-night.jpg',caption:'Streetfood'},{src:'images/streetfood-drinks.jpg',caption:'Streetfood'}], body:['Ausgeschlafen starteten wir wieder Richtung Wasserbus, dieses Mal jedoch nordw\u00e4rts.','Unser heutiges Ziel war einer der gr\u00f6ssten Open-Air-M\u00e4rkte der Welt. Auf den 15\u2019000 St\u00e4nden des Chatuchak-Marktes kommt definitiv etwas f\u00fcr jeden – ob erschwingliche Kleidung, Kunst, M\u00f6bel, Tiere oder das umfangreiche kulinarische Angebot, die Auswahl ist riesig.','Eine wohlverdiente Pause war das Schlürfen einer gekühlten Kokosnuss, die frisch vor unseren Augen mit einer Machete ge\u00f6ffnet wurde. Nach unseren wahrscheinlich etwas ungeschickten Versuchen, das Fleisch mit einem Plastikl\u00f6ffel herauszukratzen, kam uns ein thail\u00e4ndischer Ladenbesitzer von einem anderen Stand zu Hilfe und dr\u00fcckte uns mit einem L\u00e4cheln einen Essl\u00f6ffel in die Hand. Gastfreundschaft, die wir immer wieder auf unserer Reise in Thailand erlebten.','Am Nachmittag schlenderten wir durch den direkt danebenliegenden Chatuchak Park. Die idyllische Oase, mit den Hochh\u00e4usern am Horizont sichtbar, erinnert ein wenig an den Central Park in New York. Schritt f\u00fcr Schritt wurde es ruhiger und der Markttrubel und Stadtverkehr verblassten im Hintergrund.','Gut best\u00fcckte Bananenb\u00e4ume und Bambusstr\u00e4ucher waren um die sanften B\u00e4che und den See gepflanzt, und dazwischen huschten fleissige Eichh\u00f6rnchen und allerlei V\u00f6gel.','Zur\u00fcck am Markt bereiteten die Einheimischen gerade den Abendtourismus vor – wie aus dem Nichts erschienen unz\u00e4hlige neue Streetfood-St\u00e4nde auf den Strassen. Wir machten uns langsam auf den Weg zum Flughafen – raus aus der lebhaften Metropole, hin zur kleineren Stadt Chiang Mai im Norden. Wir sind gespannt, was uns unter den Bergv\u00f6lkern der Karen, den Elefantenschutzgebieten und dem Dschungel erwartet.']}
      ]},
      {id:'japan', country:'Japan', date:'15.+16. Oktober 2026', places:[{id:'tokio', country:'Tokio', date:'15.+16. Oktober 2026', excerpt:'Flughafen Tokio Narita. 40 Millionen Passagiere pro Jahr.', images:[{src:'images/jp-roboter.jpg',caption:'Narita'},{src:'images/jp-shibuya1.jpg',caption:'Shibuya'},{src:'images/jp-shibuya2.jpg',caption:'Shibuya'},{src:'images/jp-ubahn.jpg',caption:'U-Bahn'},{src:'images/jp-gyoza.jpg',caption:'Gyoza'},{src:'images/jp-takoyaki.jpg',caption:'Takoyaki'},{src:'images/jp-shibuya.mp4',caption:'Shibuya-Kreuzung',video:true}], body:['Flughafen Tokio Narita. 40 Millionen Passagiere pro Jahr. Dennoch merken wir auf unseren ersten paar Schritten in Japan vor allem eines: alles ist geordnet, alles hat Struktur, alles verl\u00e4uft reibungslos. Auf unserer eineinhalbst\u00fcndigen Zugfahrt in die Stadtmitte beobachteten wir Hunderte Menschen, keiner davon telefonierte laut oder unterhielt sich in einer unpassenden Lautst\u00e4rke. M\u00fcllk\u00fcbel sind fast nirgendwo zu finden, und die Vorgabe ist, den M\u00fcll mit sich zu nehmen \u2013 so lange, bis man einen findet, auch wenn das erst zuhause ist. Und die Einheimischen scheinen sich trotz der vielen Regeln an alle zu halten. Das umfangreiche U-Bahn-Netz gilt als eines der besten der Welt und besitzt gleich drei U-Bahn-Anbieter. Die drittgr\u00f6sste Stadt f\u00fchlt sich bei weitem nicht so chaotisch an wie Bangkok, die Regeln und die Struktur vermitteln auch eine Art Sicherheit. Nach unserer Ankunft nach Mitternacht machten wir uns erst am n\u00e4chsten Mittag auf in die Stadt.','Von den wuselnden Menschenmassen liessen wir uns mittragen in eine Gegend, wo es nach kleinen, gem\u00fctlichen Restaurants mit authentischem Essen aussah \u2013 und landeten in einem kleinen Sushi-Restaurant. Die W\u00e4nde waren dunkel, und auf zwei kleinen erh\u00f6hten Plattformen standen jeweils zwei K\u00fcnstler vor ihrer Vitrine mit frischem Fisch. Um die Plattformen herum gab es schulterhohe W\u00e4nde, und davor Bartische mit Sitzpl\u00e4tzen. Wir liessen uns von einem \u00e4lteren Japaner einen Platz zuweisen und setzten uns auf die Holzhocker. Mithilfe der Bilderkarten bestellten wir unser erstes japanisches Sushi. Wir bekamen heissen Gr\u00fcntee und dampfende Miso-Suppe serviert und konnten von unserem Platz aus staunend zusehen, wie der Sushi-Koch-K\u00fcnstler vor unseren Augen den Reis zu passenden Paketen formte und den Fisch kunstvoll darauf anordnete. Etwas \u00fcberfordert von der japanischen Essensetikette genossen wir unser Mahl und kamen langsam im neuen Land an.','Als es dunkel wurde, nahmen wir die U-Bahn zur ber\u00fchmten Shibuya-Kreuzung, der meistfrequentierten Fussg\u00e4ngerquerung der Welt. Pro Ampelphase queren 2.500 bis 3.000 Menschen die Kreuzung. Daneben steht eine ganz besondere Statue: Hachiko. Der Akita-Hund wartete jahrelang am Bahnhof auf seinen Besitzer, der nicht mehr zur\u00fcckkam. Die Geschichte hat uns ber\u00fchrt.','Das Viertel Shibuya erinnert mit den grellen Lichtern etwas an New York, auch wenn die Oktopusb\u00e4llchen und Dumplings uns wieder erinnerten, wo wir gerade waren \u2013 in einer Stadt, von der wir noch keinen Schimmer haben, was sie alles ausmacht, und die wirklich zu entdecken wahrscheinlich einige Wochen dauern w\u00fcrde.']}, en:{country:'Japan', date:'15 October 2026', excerpt:'Tokyo Narita Airport. 40 million passengers a year.', body:['Tokyo Narita Airport. 40 million passengers a year. And yet, on our first few steps in Japan, we notice above all one thing: everything is orderly, everything has structure, everything runs smoothly. On our one-and-a-half-hour train ride into the city centre we watched hundreds of people, none of whom was talking loudly on the phone or conversing at an inappropriate volume. Rubbish bins are almost nowhere to be found, and the rule is to take your rubbish with you \u2013 until you find one, even if that is only at home. And the locals seem to stick to all the rules despite there being so many of them. The extensive subway network is considered one of the best in the world and has no fewer than three subway operators. The third-largest city feels nowhere near as chaotic as Bangkok; the rules and the structure also convey a kind of safety. After our arrival after midnight we only set off into the city the next midday.','We let the bustling crowds carry us into an area that looked like it had small, cosy restaurants with authentic food \u2013 and ended up in a small sushi restaurant. The walls were dark, and on two small raised platforms two artists each stood in front of their display case with fresh fish. Around the platforms there were shoulder-high walls, and in front of them bar tables with seats. We let an older Japanese man assign us a seat and sat down on the wooden stools. With the help of the picture cards we ordered our first Japanese sushi. We were served hot green tea and steaming miso soup and could watch in amazement from our seat as the sushi chef artist formed the rice into fitting packets before our eyes and artfully arranged the fish on top. Somewhat overwhelmed by the Japanese dining etiquette, we enjoyed our meal and slowly arrived in the new country.','When it got dark we took the subway to the famous Shibuya Crossing, the busiest pedestrian crossing in the world. Per traffic-light phase 2,500 to 3,000 people cross the intersection. Next to it stands a very special statue: Hachiko. The Akita dog waited for years at the station for his owner, who never returned. The story touched us.','The Shibuya district with its bright lights reminds us a bit of New York, even if the octopus balls and dumplings reminded us again where we were \u2013 in a city of which we still have no idea what it all consists of, and which would probably take several weeks to really discover.']}}],
      {id:'hawaii', country:'Hawaii', date:'27. Oktober 2026', places:[
        {id:'road-to-hana', country:'Maui – Road to Hana', date:'2. November 2026', excerpt:'Die Road to Hana ist eine der sch\u00f6nsten K\u00fcstenstrassen der Welt.', images:[{src:'images/hana-strasse.jpg',caption:'Road to Hana'},{src:'images/hana-rainbowtree1.jpg',caption:'Rainbow Tree'},{src:'images/hana-rainbowtree2.jpg',caption:'Rainbow Tree'},{src:'images/hana-hoehle1.jpg',caption:'Lava Cave'},{src:'images/hana-kerstin-hoehle.jpg',caption:'Lava Cave'},{src:'images/hana-wurzeln.jpg',caption:'Lava Cave'},{src:'images/hana-bananenbrot.jpg',caption:'Aunty Sandy\'s Banana Bread'},{src:'images/hana-banyan.jpg',caption:'Banyan Tree'},{src:'images/hana-bruecke.jpg',caption:'Pipiwai Trail'},{src:'images/hana-bambus-neu.jpg',caption:'Bambuswald'},{src:'images/hana-stefan-bruecke.jpg',caption:'Pipiwai Trail'},{src:'images/hana-stefan-weg-neu.jpg',caption:'Pipiwai Trail'},{src:'images/hana-blatt.jpg',caption:'Pipiwai Trail'},{src:'images/hana-wasserfall1.jpg',caption:'Wasserfall'},{src:'images/hana-strand.jpg',caption:'Schwarzer Strand'},{src:'images/hana-schildkroete.jpg',caption:'Schildkr\u00f6te'},{src:'images/hana-essen.jpg',caption:'Essen'},{src:'images/hana-waimoku.jpg',caption:'Waimoku Falls'}], body:['Die Road to Hana ist eine der sch\u00f6nsten K\u00fcstenstrassen der Welt. Mit über 600 Kurven und 59 Br\u00fccken schl\u00e4ngelt sie sich an der Nordostk\u00fcste Mauis entlang. Wir starteten fr\u00fch am Morgen und waren gespannt, was uns erwartet.','Unterwegs hielten wir an vielen kleinen Wasserf\u00e4llen, Lava-H\u00f6hlen und Aussichtspunkten. Besonders beeindruckend war der Rainbow Eucalyptus mit seiner bunten Rinde und der riesige Banyan Tree.','Der H\u00f6hepunkt war der Pipiwai Trail im Haleakal\u0101 Nationalpark. Der Wanderweg f\u00fchrt durch einen Bambuswald zu den Waimoku Falls. Der 122 Meter hohe Wasserfall pr\u00e4sentiert sich wie auf einer B\u00fchne im Amphitheater \u2013 daneben fliessen ebenfalls eindr\u00fcckliche weitere Wasserf\u00e4lle hinunter.','Nach unserem Mittagssandwich mit einer wirklich schwer zu toppenden Aussicht machten wir uns auf den Weg zur\u00fcck, erst zum Auto und anschliessend auch zur\u00fcck zu unserer Wohnung, vorbei an den kleinen alten Br\u00fccken und durch dieselben schmalen Kurven, jedoch beschenkt mit unglaublich sch\u00f6nen Erfahrungen an diesem Tag.']},
        {id:'haleakala', country:'Maui – Haleakal\u0101', date:'3. November 2026', excerpt:'Am Morgen begr\u00fcsste uns anstatt des \u00f6fter vorkommenden Regens der Sonnenschein.', body:['Am Morgen begr\u00fcsste uns anstatt des \u00f6fter vorkommenden Regens der Sonnenschein, und das erste Mal in unserem Maui-Aufenthalt konnten wir die zwei Vulkangipfel teilweise sehen, die sich davor immer unter dichten Regenwolken versteckten.','Nachdem wir die K\u00fcstenregion des Nationalparks schon am Vortag erkundet hatten (Pipiwai Trail), war es an diesem Tag an der Reihe, die zweite Welt des Parks zu entdecken. Von der gegens\u00e4tzlichen Richtung aus machten wir uns auf die eineinhalbst\u00fcndige Autofahrt 3055 Meter in die H\u00f6he.','Oben angekommen erwartete uns die Mondlandschaft des Haleakal\u0101. Der Wind pfiff, die Luft war d\u00fcnn, und der Blick \u00fcber den Krater war atemberaubend.']},
        {id:'oahu-4-5', country:'Oahu', date:'4.\u20135. November 2026', excerpt:'Nach der Ankunft auf Oahu genossen wir die letzten Tage auf Hawaii.', body:['Nach der Ankunft auf Oahu genossen wir die letzten Tage auf Hawaii. W\u00e4hrend Stefan noch einmal zum Memorial der USS Arizona fuhr, machte sich Kerstin auf in die Mitte des Waikiki-Strandes. Die Wellen waren leider nicht da.','Der letzte Morgen begann ganz fr\u00fch im tiefen Blau des Pazifiks. Mit einem Boot fuhren wir hinaus zum Turtle Canyon. Dort lagen zehn Schildkr\u00f6ten am Meeresgrund. Die Tiere so hautnah beobachten zu k\u00f6nnen, \u00fcbertraf unsere Erwartungen.','Ganz beseelt ging es f\u00fcr uns Richtung Flughafen. N\u00e4chster Stopp \u2013 San Francisco. Und vielen Dank, Hawaii, es war uns eine Ehre.']}

    const airports = { MUC:{lat:48.3538,lng:11.7861}, BKK:{lat:13.69,lng:100.7501}, DMK:{lat:13.9126,lng:100.6068}, CNX:{lat:18.7668,lng:98.9626}, NRT:{lat:35.772,lng:140.3929}, HNL:{lat:21.3187,lng:-157.9225}, SFO:{lat:37.6213,lng:-122.379}, PHX:{lat:33.4343,lng:-112.0116}, LHR:{lat:51.47,lng:-0.4543}, ZRH:{lat:47.4582,lng:8.5555} };
    const countries = [{name:'Deutschland',lat:50.8,lng:10.2},{name:'Thailand',lat:14.8,lng:101.8},{name:'Japan',lat:37.5,lng:138.2},{name:'USA',lat:39.5,lng:-98.3},{name:'Schweiz',lat:46.8,lng:8.2}];
    const flights = [{from:'MUC',to:'BKK',date:'2026-10-08'},{from:'DMK',to:'CNX',date:'2026-10-10'},{from:'CNX',to:'BKK',date:'2026-10-13'},{from:'BKK',to:'NRT',date:'2026-10-15'},{from:'NRT',to:'HNL',date:'2026-10-27'},{from:'HNL',to:'SFO',date:'2026-11-05'},{from:'PHX',to:'LHR',date:'2026-11-22'},{from:'LHR',to:'ZRH',date:'2026-11-23'}];
    function todayIso(){ const n=new Date(); return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0'); }

    function visible(f,t){ return f.date==='2026-10-08' || f.date<=t; }

    function arc(a,b){ const p=[]; let lng2=b.lng; if(Math.abs(lng2-a.lng)>180) lng2+=lng2>a.lng?-360:360; for(let i=0;i<=64;i++){ const t=i/64; p.push([a.lat+(b.lat-a.lat)*t+Math.sin(Math.PI*t)*2.2, a.lng+(lng2-a.lng)*t]); } return p; }
    function pin(){ return L.divIcon({className:'pin', html:'<i></i>', iconSize:[9,12], iconAnchor:[4,11]}); }

    function card(s, href, showDate){ const date = (showDate!==false && L(s,'date')) ? '<p class="kicker">'+L(s,'date')+'</p>' : ''; return '<article class="post'+(s.id==='willkommen'?' welcome':'')+'"><a class="more" href="'+(href||'#')+'">'+date+'<h2>'+L(s,'country')+'</h2><p>'+L(s,'excerpt')+'</p></a></article>'; }
    function showStories(){ document.getElementById('app').innerHTML='<div class="posts">'+stories.map(s=>card(s, s.places||s.body?'#story/'+s.id:null, !s.places)).join('')+'</div>'; }
    function showCountry(id){ const c=stories.find(x=>x.id===id); if(!c) return showStories(); document.getElementById('app').innerHTML='<a class="back" href="#stories">\u2190 Stories</a><div class="places">'+c.places.map(p=>'<article class="place"><span>'+L(p,'date')+'</span><a href="#story/'+p.id+'">'+L(p,'country')+'</a></article>').join('')+'</div>'; }
    function showStory(id){ const s=stories.find(x=>x.id===id) || stories.flatMap(x=>x.places||[]).find(x=>x.id===id); if(!s) return showStories(); const back = s.places ? '#stories' : (stories.find(x=>x.places&&x.places.some(p=>p.id===s.id))||{}).id ? '#story/'+(stories.find(x=>x.places&&x.places.some(p=>p.id===s.id)).id) : '#stories'; let html = '<a class="back" href="'+back+'">\u2190 zur\u00fcck</a><article class="story"><p class="kicker">'+L(s,'date')+'</p><h2>'+L(s,'country')+'</h2>'; if(s.images) html += '<div class="gallery">'+s.images.map((im,i)=>'<button onclick="openLightbox('+i+')">'+(im.video?'<video muted loop playsinline src="'+im.src+'"></video>':'<img src="'+im.src+'" alt="'+im.caption+'">')+'</button>').join('')+'</div>'; html += L(s,'body').map(p=>'<p>'+p+'</p>').join(''); if(s.quote) html += '<blockquote>'+s.quote+'<br><small>\u2014 '+s.quoteBy+'</small></blockquote>'; html += '</article>'; document.getElementById('app').innerHTML = html; window.currentImages = s.images || []; }
    function openLightbox(i){ const imgs = window.currentImages; if(!imgs||!imgs[i]) return; const lb = document.createElement('div'); lb.className='lightbox'; lb.innerHTML = '<button class="close" onclick="this.parentNode.remove()">\u00d7</button><button class="prev" onclick="navigate(-1)">\u2039</button><img src="'+imgs[i].src+'"><button class="next" onclick="navigate(1)">\u203a</button><div class="caption">'+imgs[i].caption+'</div>'; document.body.appendChild(lb); window.lbIndex=i; window.lb=lb; }
    function navigate(d){ const imgs=window.currentImages; window.lbIndex=(window.lbIndex+d+imgs.length)%imgs.length; const img=window.lb.querySelector('img'); img.src=imgs[window.lbIndex].src; window.lb.querySelector('.caption').textContent=imgs[window.lbIndex].caption; }
    function showAtlas(){ document.getElementById('app').innerHTML='<div id="worldMap"></div>'; setTimeout(()=>{ const map=L.map('worldMap').setView([20,0],2); L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'\u00a9 OSM \u00a9 CARTO'}).addTo(map); const t=todayIso(); flights.forEach(f=>{ if(!visible(f,t)) return; const a=airports[f.from], b=airports[f.to]; if(a&&b) L.polyline(arc(a,b),{color:'#b4482a',weight:2,opacity:.7}).addTo(map); }); countries.forEach(c=>L.marker([c.lat,c.lng],{icon:pin()}).bindTooltip(c.name,{permanent:true,direction:'right',className:'country-label'}).addTo(map)); },100); }
    function showAbout(){ const about = lang==='en' ? 'Join us on our journey once around the world. From the urban jungle of Bangkok through the unknown cultures of Japan and the historic treasures of Hawaii to the vastness of the USA, and everything we encounter in between.' : 'Begleite uns auf unserer Reise einmal um die Welt. Vom Gro\u00dfstadtdschungel Bangkok \u00fcber die unbekannten Kulturen Japans und die historischen Kultursch\u00e4tze Hawaiis bis in die Weiten der USA, und zu allem, was uns dazwischen begegnet.'; document.getElementById('app').innerHTML='<section class="about-copy"><div><h2>Kerstin & Stefan</h2><p>'+about+'</p></div><img alt="Kerstin und Stefan" src="images/kerstin-stefan.jpg"></section>'; }
    function go(){ const hash=location.hash||'#stories'; if(hash==='#atlas') showAtlas(); else if(hash==='#about') showAbout(); else if(hash.startsWith('#story/')){ const id=hash.slice(7); const s=stories.find(x=>x.id===id); if(s&&s.places) showCountry(id); else showStory(id); } else showStories(); }
    document.querySelectorAll('.lang').forEach(b=>{ b.classList.toggle('active', b.dataset.lang===lang); b.addEventListener('click', ()=>{ lang=b.dataset.lang; localStorage.setItem('waymarks-lang', lang); document.querySelectorAll('.lang').forEach(x=>x.classList.toggle('active', x.dataset.lang===lang)); go(); }); });
    window.addEventListener('hashchange', go); go();
  </script>
